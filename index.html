    function colorAutoPorRol(nombreRol) {

    function getColorRol(rol, config) {

    // Reconstruye la lista de tareas asignadas a un asesor en una fecha (para informes/CSV/rendimiento).
    // Replica la lógica de FormView (rol + día de semana / festivo + tareasSemanales + A001 + filtro por grupo).
    function getTareasAsignadas(asesora, fecha, rol, config) {
      if (!rol) return [];
      var todas = config.tareas || TAREAS_BASE;
      var base = todas.filter(function(t){return (t.roles||[]).indexOf(rol)>=0;});
      var diaKey = (rol === ROL_FESTIVO) ? "festivo" : getDiaSemanaKey(fecha);
      var exc = (config.tareasSemanales && config.tareasSemanales[diaKey] && config.tareasSemanales[diaKey][rol]) || {add:[],remove:[]};
      var quitadas = exc.remove || [];
      var agregadas = (exc.add||[]).map(function(code){return todas.find(function(t){return t.code===code;});}).filter(Boolean);
      var lista = base.filter(function(t){return quitadas.indexOf(t.code)<0;}).concat(agregadas);
      if (!lista.find(function(t){return t.code==="A001"||(t.nombre||"").toLowerCase()==="puntualidad";})) {
        var p = todas.find(function(t){return t.code==="A001";});
        if (p) lista = [p].concat(lista);

      var g = getGrupoDeRol(rol, config);
      var pref = g ? (g.prefix||"").toUpperCase() : null;
      if (pref) lista = lista.filter(function(t){ if(!t.code) return true; if(t.code==="A001"||(t.nombre||"").toLowerCase()==="puntualidad") return true; return t.code.toUpperCase().startsWith(pref); });
      return lista;

    // Métricas de cumplimiento de un registro (entry) de bitácora.
    function calcRendimientoRegistro(entry, config) {
      var checks = entry.checks || {};
      var asign = getTareasAsignadas(entry.asesora, entry.fecha, entry.rol, config);
      var total = asign.length;
      var hechas = 0;
      asign.forEach(function(t){ var v=checks[t.code]||""; if (v==="Si"||v==="Tarde") hechas++; });
      var punt = checks["A001"]||"";
      return {
        total: total, hechas: hechas,
        pct: total>0 ? Math.round(hechas/total*100) : null,
        puntualidad: punt==="Si"?"A tiempo":punt==="Tarde"?"Tarde":"—",
        aTiempo: punt==="Si", tarde: punt==="Tarde"
      };
    }

      const res = Object.assign({}, base);
      // Aplicar roles fijos de asesoras que no estan en el ciclo
      if (config.rolesAsesoras) {
        Object.entries(config.rolesAsesoras).forEach(function(entry) {
          var persona = entry[0]; var rolFijo = entry[1];
          if (rolFijo && !res[persona]) res[persona] = rolFijo;

      // Aplicar overrides del dia (tienen prioridad sobre rol fijo y base)
      Object.entries(dayOver).forEach(function(entry) {
        var persona = entry[0]; var nuevoRol = entry[1];
        delete res[persona];
        if (nuevoRol && nuevoRol !== "libre") res[persona] = nuevoRol;
      });
      return res;
    }

    // Formatea "13:00" -> "1:00 pm" (para el recordatorio visible en las tareas con hora límite)
    function formatHora12(h) {
      if (!h) return "";
      var p = String(h).split(":"); var H = parseInt(p[0],10); var M = (p[1]||"00");
      if (isNaN(H)) return h;
      var ap = H>=12 ? "pm" : "am"; var h12 = H%12; if (h12===0) h12=12;

    var HORARIOS_DEFAULT = [

    var OFICINA_RADIO_M = 50;

    function calcularDistancia(lat1, lng1, lat2, lng2) {
      var R = 6371000; // metros
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLng = (lng2 - lng1) * Math.PI / 180;
      var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
              Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
              Math.sin(dLng/2)*Math.sin(dLng/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function verificarUbicacion(callback) {
      if (!navigator.geolocation) { callback({ok:false, error:"Sin GPS"}); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var dist = calcularDistancia(pos.coords.latitude, pos.coords.longitude, OFICINA_LAT, OFICINA_LNG);
          callback({
            ok: true,
            enOficina: dist <= OFICINA_RADIO_M,
            distancia: Math.round(dist),
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          });
        },
        function(err) { callback({ok:false, error:err.message}); },
        {timeout:8000, maximumAge:60000}
      );
    }

    // ════════════════════════════════════════════════════════════
    // SISTEMA DE HORARIOS por día/rol con overrides por fecha/asesora
    // ════════════════════════════════════════════════════════════
    // Estructura en config:
    //   config.horariosBase = {
    //     lunes: { "Clientes T1": {entrada:"07:00", salida:"15:00"}, "Hibrido": {...} },
    //     martes: {...}, ...
    //   }
    //   config.horariosOverrides = {
    //     "2026-05-25": {                     // fecha ISO
    //       __rol_Clientes_T1: {entrada,salida,descanso},   // override por rol
    //       __asesora_Maria_Gomez: {entrada,salida,descanso}, // override por asesor
    //     }, ...
    //   }
    // Si una entrada tiene `descanso: true` → ese día no se trabaja.
    //
    // Lookup (prioridad de mayor a menor):
    //   1) override por ASESORA en la fecha
    //   2) override por ROL en la fecha
    //   3) horario base del DÍA DE SEMANA + ROL
    //   4) horario antiguo `config.horarios` (compatibilidad hacia atrás)
    //   5) HORARIOS_DEFAULT
    function getHorarioEfectivo(asesora, rol, fecha, config) {
      if (!config) config = {};
      var key = asesora ? asesora.replace(/[.#$\[\]\s]/g,"_") : "";

      // 1) Override por asesor
      var ovrAse = config.horariosOverrides
                 && config.horariosOverrides[fecha]
                 && config.horariosOverrides[fecha]["__asesora_"+key];
      if (ovrAse) return Object.assign({nombre:"Override "+asesora, fuente:"override-asesora"}, ovrAse);

      // 2) Override por rol
      var rolKey = rol ? rol.replace(/[.#$\[\]\s]/g,"_") : "";
      var ovrRol = config.horariosOverrides
                 && config.horariosOverrides[fecha]
                 && config.horariosOverrides[fecha]["__rol_"+rolKey];
      if (ovrRol) return Object.assign({nombre:"Override "+rol, fuente:"override-rol"}, ovrRol);

      // 3) Base por día de semana + rol
      if (rol && fecha) {
        var diaKey = getDiaSemanaKey(fecha);
        var baseDia = config.horariosBase
                   && config.horariosBase[diaKey]
                   && config.horariosBase[diaKey][rol];
        if (baseDia) return Object.assign({nombre:rol+" — "+diaKey, fuente:"base-dia"}, baseDia);
      }

      // 4) Sistema antiguo (compatibilidad)
      var horariosViejos = (config && config.horarios) || HORARIOS_DEFAULT;
      var encontrado = horariosViejos.find(function(h){ return (h.roles||[]).indexOf(rol) >= 0; });
      if (encontrado) return Object.assign({}, encontrado, {fuente:"legacy"});

      // 5) Sin horario definido
      return null;
    }

    function getHorarioForRol(rol, config) {
      return getHorarioEfectivo(null, rol, today(), config);
    }

    function calcularPuntualidad(horaEntrada, horaEsperada) {
      if (!horaEntrada || !horaEsperada) return "Puntual";
      var partsE = horaEsperada.split(":").map(Number);
      var partsA = horaEntrada.split(":").map(Number);
      var minEsperado = partsE[0]*60 + partsE[1];
      var minActual = partsA[0]*60 + partsA[1];
      var diff = minActual - minEsperado;
      if (diff <= GRACIA_MINUTOS) return "Puntual";
      return "Tarde";
    }

      // Una tarea está "vencida" si tiene hora límite, es hoy, ya pasó esa hora y NO está hecha.
      function estaVencida(t, hecha) {
        if (!t || !t.hora || hecha) return false;
        if (fecha !== today()) return false;
        var n = new Date();
        var hhmm = ("0"+n.getHours()).slice(-2)+":"+("0"+n.getMinutes()).slice(-2);

      }

      // Grupo al que pertenece el rol actual (sistema dinámico)

      var grupoActual = grupoObjActual ? grupoObjActual.label : null;
      var prefixGrupo = grupoObjActual ? (grupoObjActual.prefix||"").toUpperCase() : null;

      // Aplicar configuracion por dia de semana.

      var diaSemannaKey = (rol === ROL_FESTIVO) ? "festivo" : getDiaSemanaKey(fecha);
      var excSemana = (config.tareasSemanales && config.tareasSemanales[diaSemannaKey] && config.tareasSemanales[diaSemannaKey][rol]) || {add:[],remove:[]};

      var tareas = tareasBase.filter(function(t){return tareasQuitadas.indexOf(t.code)<0;}).concat(tareasAgregadas);

      // Garantizar que la tarea Puntualidad (A001) esté SIEMPRE presente, sin importar el rol.

        (prog.tareas||[]).forEach(function(code){
          var yaEsta = tareas.find(function(t){return t.code===code;});
          if (!yaEsta) {
            var tarea = (config.tareas||TAREAS_BASE).find(function(t){return t.code===code;});
            // Solo agregar si pertenece al grupo correcto
            if (tarea && (!prefixGrupo || (tarea.code||"").toUpperCase().startsWith(prefixGrupo))) {
              tareas = tareas.concat([Object.assign({},tarea,{_programada:true,_nota:prog.nota})]);
            }
          }
        });
      });

      // Aplicar orden personalizado definido en admin (Por día de semana → arrastrar)
      var ordenDiaRol = (excSemana && Array.isArray(excSemana.orden)) ? excSemana.orden : [];
      if (ordenDiaRol.length > 0) {
        var enOrden = ordenDiaRol.map(function(code){
          return tareas.find(function(t){return t.code===code;});
        }).filter(Boolean);
        var fueraOrden = tareas.filter(function(t){return ordenDiaRol.indexOf(t.code)<0;});
        tareas = enOrden.concat(fueraOrden);
      }
      var metricasList = (config.metricas || METRICAS_BASE).filter(function(m){
        // Si la metrica tiene roles definidos, mostrar solo si el rol actual está incluido
        if (!Array.isArray(m.roles) || m.roles.length === 0) return true; // sin restriccion = todos
        return m.roles.indexOf(rol||"") >= 0;
      });
      var metaDiaria = getMetaEfectiva(config, fecha, rol);
      // Roles que tienen bloque de ventas (por defecto todos excepto los que se excluyan)
      var rolesConVentas = config.rolesConVentas;
      var mostrarVentas = !rolesConVentas || rolesConVentas.length === 0 || (rol && rolesConVentas.indexOf(rol) >= 0);
      var aIdx = ASESORAS.indexOf(asesora);

      useEffect(function(){

      useEffect(function(){
        // Cuando cambia el asesor o la fecha, cargamos los datos existentes y
        // bloqueamos el autoguardado del próximo ciclo (no queremos que la carga

        primerRender.current = true;
        var prev = existingData[asesora + "__" + fecha];
        if (prev) { setChecks(prev.checks||{}); setVentas(prev.ventas||""); setMetricas(prev.metricas||{}); setNotas(prev.notas||""); }
        else { setChecks({}); setVentas(""); setMetricas({}); setNotas(""); }

      useEffect(function(){
        var CHECK_MS = 5 * 60 * 1000;

          var lastSaved = localStorage.getItem("bitacora_lastsaved_" + key);
          if (!lastSaved) {
            var now = new Date();
            var startOfShift = new Date(fecha + "T08:00:00");
            if (fecha === today() && now - startOfShift > LIMIT_MS) setReminder(true);
            else setReminder(false);
          } else {
            setReminder(Date.now() - Number(lastSaved) > LIMIT_MS);
          }
        }
        checkReminder();
        var interval = setInterval(checkReminder, CHECK_MS);
        return function(){ clearInterval(interval); };
      }, [asesora, fecha]);

      function toggle(code, val) {
        if (estaBloqueada) return;
        setChecks(function(c){
          var n = Object.assign({}, c);
          n[code] = c[code] === val ? "" : val;
          return n;
        });
      }
      function setCheck(code, val) {
        // Set directo: no hace toggle, asigna el valor tal cual (o lo limpia si val es "").
        if (estaBloqueada) return;
        setChecks(function(c){
          var n = Object.assign({}, c);
          n[code] = val;
          return n;
        });
      }
      function setMet(code, val) {
        if (estaBloqueada) return;
        setMetricas(function(m){
          var n = Object.assign({}, m);
          n[code] = val;
          return n;
        });
      }

      // Autoguardado robusto basado en useEffect.
      // Se dispara automáticamente cuando cambia cualquier campo relevante.
      // Usamos un ref para evitar dispararse en el primer render (carga inicial de datos).
      React.useEffect(function() {
        // Saltar el primer render: la carga inicial de existingData también cambia los states
        // y no queremos que eso dispare un guardado.
        if (primerRender.current) {
          primerRender.current = false;
          return;
        }
        if (!rol || estaBloqueada) return;
        // Si no hay nada que guardar (todo vacío), no disparar
        var hayChecks = Object.keys(checks||{}).some(function(k){return checks[k];});
        var hayMet = Object.keys(metricas||{}).some(function(k){var v=metricas[k]; return v!==undefined && v!==null && v!=="";});
        var hayVentas = ventas !== undefined && ventas !== null && ventas !== "";
        var hayNotas = notas && notas.trim().length > 0;
        if (!hayChecks && !hayMet && !hayVentas && !hayNotas) return;

        if (autoSaveTimer.current) clearTimeout(autoSaveTimer.current);
        setAutoSaveStatus("saving");
        // Snapshot del estado actual al momento de programar el guardado
        var snapshot = {
          asesora: asesora, fecha: fecha, rol: rol,
          checks: checks, ventas: ventas, metricas: metricas, notas: notas,
          savedAt: new Date().toISOString(), enProgreso: true
        };
        autoSaveTimer.current = setTimeout(function() {
          onSave(snapshot);
          setAutoSaveStatus("saved");
          setTimeout(function(){setAutoSaveStatus(null);}, 3000);
        }, 1500);

        // Cleanup: si el efecto se re-ejecuta antes del timeout, cancelar el guardado previo
        return function() {
          if (autoSaveTimer.current) clearTimeout(autoSaveTimer.current);
        };
      }, [checks, ventas, metricas, notas, rol, fecha, asesora, estaBloqueada]);

      // (función obsoleta dejada por compatibilidad con cualquier llamada manual restante)
      function dispararAutoGuardado() { /* manejado por useEffect */ }

      function handleSave() {

                          //    marcarla manualmente (debe usar el botón "Registrar Entrada" de arriba).
                          // 2) Si hay check-in → se marca automáticamente con el resultado real
                          //    (puntual = "Si", tarde = "Tarde"). El asesor NO puede cambiarla.
                          // 3) Solo el ADMIN puede modificarla manualmente en cualquier caso.
                          var regAsist = (asistencia && asistencia.entrada) ? asistencia
                                       : ((asistenciaHoy && asistenciaHoy.entrada) ? asistenciaHoy : null);
                          var puntCheckIn = regAsist ? regAsist.puntualidad : null; // "Puntual" | "Tarde"
                          var valorAuto = puntCheckIn === "Tarde" ? "Tarde"
                                        : puntCheckIn === "Puntual" ? "Si" : null;
                          var hayCheckIn = !!regAsist;
                          // Asesor: bloqueado siempre. Admin: libre para modificar.
                          var bloqueoPuntualidad = !isAdmin;
                          // Auto-sincronización SOLO si hubo check-in y el valor difiere.
                          // Para el ADMIN solo autocompleta cuando la tarea está vacía; una vez
                          // que el admin fija un valor manual (v no vacío) NO se revierte.
                          if (valorAuto && v !== valorAuto && !estaBloqueada && (!isAdmin || !v)) {
                            setTimeout(function(){
                              if ((checks[t.code]||"") !== valorAuto && (!isAdmin || !(checks[t.code]||""))) setCheck(t.code, valorAuto);
                            }, 0);
                          }
                          // Si NO hubo check-in pero hay un valor marcado (residual de sesión vieja),
                          // limpiar — pero solo si NO es admin y la puntualidad está activa.
                          // (Si está OFF, la marca la pone el admin manualmente y debe conservarse.)
                          if (!hayCheckIn && v && !isAdmin && !estaBloqueada && puntualidadOn) {
                            setTimeout(function(){
                              if ((checks[t.code]||"") && !regAsist) setCheck(t.code, "");
                            }, 0);
                          }
                          var horaEsperada = horarioRol ? horarioRol.entrada : null;
                          var horaEntradaReg = regAsist ? regAsist.entrada : null;
                          var brdColor = v==="Si"?"#10b981":v==="No"?"#ef4444":v==="Tarde"?"#f59e0b":"#e2e8f0";
                          var bgColor = v==="Si"?"#f0fdf4":v==="No"?"#fef2f2":v==="Tarde"?"#fffbeb":"#fafafa";
                          return (
                            <div key={t.code} style={{borderRadius:12,border:"2px solid "+brdColor,background:bgColor,overflow:"hidden"}}>
                              <div style={{display:"flex",alignItems:"center",gap:8,padding:"9px 14px"}}>
                                <span style={{fontSize:10,fontWeight:700,color:"#94a3b8",minWidth:34}}>{t.code||"A001"}</span>
                                <span style={{flex:1,fontSize:13,color:"#1e293b",fontWeight:700}}>
                                  Puntualidad
                                  {!isAdmin && <span title={puntualidadOn?"Determinado automáticamente por el check-in":"Gestionada por el administrador"} style={{fontSize:9,fontWeight:800,background:"#eef2ff",color:"#4338ca",borderRadius:20,padding:"1px 7px",marginLeft:6,verticalAlign:"middle"}}>{puntualidadOn?"🔒 AUTO":"🔒 ADMIN"}</span>}
                                </span>
                                {horaEntradaReg ? (
                                  <span style={{fontSize:11,fontWeight:800,color:v==="Tarde"?"#92400e":v==="Si"?"#15803d":"#64748b",background:"#fff",padding:"2px 8px",borderRadius:6,border:"1px solid "+brdColor}}>
                                    {horaEntradaReg}{horaEsperada?" / "+horaEsperada:""}
                                  </span>
                                ) : horaEsperada && (
                                  <span style={{fontSize:11,fontWeight:700,color:"#94a3b8"}}>
                                    -- / {horaEsperada}
                                  </span>
                                )}
                              </div>
                              {(function(){
                                var deshabPunt = estaBloqueada || bloqueoPuntualidad;
                                function marcarPunt(opt){
                                  if (deshabPunt) return;
                                  var nuevoVal = (v === opt) ? "" : opt; // mismo comportamiento toggle
                                  setCheck(t.code, nuevoVal);
                                  // Solo el admin puede llegar aquí (asesora la ve deshabilitada).
                                  // Mantener consistente el registro de asistencia para el Dashboard de tardanzas.
                                  if (isAdmin) {
                                    var fbKeyP = asesora.replace(/[.#$\[\]]/g,"_");
                                    var nuevaPunt = nuevoVal === "Tarde" ? "Tarde" : nuevoVal === "Si" ? "Puntual" : null;
                                    try {
                                      var refP = db.ref("bitacora_asistencia/" + fecha + "/" + fbKeyP);
                                      if (nuevaPunt) refP.update({puntualidad:nuevaPunt, asesora:asesora, fecha:fecha, rol:rol, correccionAdmin:true});
                                      else refP.child("puntualidad").remove();
                                    } catch(e){ console.error("Error corrigiendo puntualidad:", e); }
                                  }
                                }
                                return (
                                  <div style={{display:"flex",borderTop:"1px solid #f1f5f9",opacity:(!isAdmin && !hayCheckIn)?0.5:1}}>
                                    {[["Si","A tiempo","#10b981"],["Tarde","Tarde","#f59e0b"]].map(function(item){
                                      var opt=item[0];var lbl=item[1];var col=item[2];
                                      return <button key={opt} onClick={function(){marcarPunt(opt);}} disabled={deshabPunt} style={{flex:1,padding:"8px 0",border:"none",background:v===opt?col:"transparent",color:v===opt?"#fff":"#94a3b8",fontWeight:700,fontSize:12,cursor:deshabPunt?"not-allowed":"pointer",borderRight:opt!=="Tarde"?"1px solid #f1f5f9":"none",opacity:deshabPunt&&v!==opt?0.45:1,fontFamily:"inherit"}}>{lbl}</button>;
                                    })}
                                  </div>
                                );
                              })()}
                              {!isAdmin && (
                                <div style={{padding:"6px 12px",borderTop:"1px solid #f1f5f9",background:"#fafafa",fontSize:10,color:"#64748b",fontWeight:600,textAlign:"center"}}>
                                  {!puntualidadOn
                                    ? (v==="Tarde"
                                        ? "⚠ Registrada como tarde por el administrador."
                                        : v==="Si"
                                          ? "✓ Registrada a tiempo por el administrador."
                                          : "🔒 Puntualidad gestionada por el administrador.")
                                    : !hayCheckIn
                                      ? "⏰ Debes registrar tu entrada para marcar esta tarea"
                                      : puntCheckIn==="Tarde"
                                        ? "⚠ Llegada tarde registrada en el check-in. Solo el admin puede modificar."
                                        : "✓ Llegada puntual registrada en el check-in. Solo el admin puede modificar."}
                                </div>
                              )}
                            </div>
                          );
                        }
                        // ── Campo de valor configurable (aplica a tarjeta simple y con sub-tareas) ──
                        var campoCfg = t.campoValor || null; // {label, tipo:'numero'|'texto', sufijo}
                        var esArqueo = t.code === "A006" || t.code === "A013" || !!campoCfg;
                        var valArqueo = metricas["arqueo_" + t.code] || "";
                        var campoLabel = campoCfg ? (campoCfg.label||"Valor:") : (t.code==="A006"?"Valor recibido:":"Valor entregado:");
                        var campoTipo = (campoCfg && campoCfg.tipo==="texto") ? "text" : "number";
                        var campoSufijo = campoCfg ? (campoCfg.sufijo||"") : "COP";
                        var campoValorRender = esArqueo ? (
                          <div style={{padding:"8px 12px",borderTop:"1px solid #f1f5f9",background:"#f8fafc",display:"flex",alignItems:"center",gap:8}}>
                            <span style={{fontSize:11,fontWeight:700,color:"#64748b",whiteSpace:"nowrap"}}>{campoLabel}</span>
                            <input type={campoTipo} min="0" value={valArqueo}
                              onChange={function(e){if(!estaBloqueada)setMet("arqueo_"+t.code, e.target.value);}}
                              disabled={estaBloqueada} placeholder={campoTipo==="number"?"0":"Escribe aquí..."}
                              style={{flex:1,padding:"6px 10px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:14,fontWeight:700,color:"#1e293b",background:estaBloqueada?"#f1f5f9":"#fff",outline:"none",fontFamily:"inherit"}}/>
                            {campoSufijo && <span style={{fontSize:11,color:"#94a3b8",fontWeight:600}}>{campoSufijo}</span>}
                          </div>
                        ) : null;
                        // ── Nota/recordatorio fijo de la tarea (lo escribe el admin, el asesor siempre lo ve) ──
                        var notaRender = (t.nota && String(t.nota).trim()) ? (
                          <div style={{padding:"8px 12px",borderTop:"1px solid #dbeafe",background:"#eff6ff",display:"flex",alignItems:"flex-start",gap:7}}>
                            <span style={{fontSize:13,lineHeight:1.3}}>📌</span>
                            <span style={{fontSize:12,color:"#1e40af",fontWeight:600,whiteSpace:"pre-wrap",lineHeight:1.45}}>{t.nota}</span>
                          </div>
                        ) : null;
                        // ── Tareas con sub-tareas (checklist) ──
                        var subsDef = getSubtareas(t);
                        if (subsDef && subsDef.length > 0) {
                          var subKey = "sub_" + t.code; // se guarda dentro de metricas para no romper esquemas existentes
                          var subState = (metricas[subKey] && typeof metricas[subKey]==="object") ? metricas[subKey] : {};
                          var totalSub = subsDef.length;
                          var hechasSub = subsDef.filter(function(it){return !!subState[it.id];}).length;
                          var todasHechas = hechasSub === totalSub;
                          var abierto = !!subOpen[t.code];
                          // Auto-sincronización del check principal:
                          // - Si TODAS las sub-tareas están hechas → "Si"
                          // - Si HAY alguna marcada pero NO todas, y el check estaba "Si" o "No" → limpiar
                          // - Si no hay ninguna marcada y el check estaba "Si" (residual) → limpiar
                          if (!estaBloqueada) {
                            if (todasHechas && v !== "Si") {
                              setTimeout(function(){
                                if (subsDef.every(function(it){return !!subState[it.id];}) && (checks[t.code]||"") !== "Si") setCheck(t.code,"Si");
                              },0);
                            } else if (!todasHechas && hechasSub > 0 && (v === "Si" || v === "No")) {
                              setTimeout(function(){
                                if (!subsDef.every(function(it){return !!subState[it.id];}) && ((checks[t.code]||"") === "Si" || (checks[t.code]||"") === "No")) setCheck(t.code,"");
                              },0);
                            } else if (hechasSub === 0 && v === "Si") {
                              setTimeout(function(){
                                if (Object.keys(subState).filter(function(k){return !!subState[k];}).length === 0 && (checks[t.code]||"") === "Si") setCheck(t.code,"");
                              },0);
                            }
                          }
                          var toggleSub = function(itemId) {
                            if (estaBloqueada) return;
                            var nuevasSub = Object.assign({}, subState);
                            nuevasSub[itemId] = !nuevasSub[itemId];
                            setMet(subKey, nuevasSub);
                          };
                          var marcarNoTarea = function() {
                            if (estaBloqueada) return;
                            // Marcar "No": limpiar sub-tareas y poner check en "No"
                            setMet(subKey, {});
                            if (v !== "No") setTimeout(function(){setCheck(t.code,"No");},0);
                          };
                          var vencidaSub = estaVencida(t, todasHechas || v==="No");
                          var brdColor = todasHechas ? "#10b981" : v==="No" ? "#ef4444" : vencidaSub ? "#f59e0b" : "#e2e8f0";
                          var bgColor = todasHechas ? "#f0fdf4" : v==="No" ? "#fef2f2" : vencidaSub ? "#fffbeb" : "#fafafa";
                          return (
                            <div key={t.code} style={{borderRadius:12,border:(vencidaSub?"2px":"1.5px")+" solid "+brdColor,background:bgColor,overflow:"hidden"}}>
                              <div style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px"}}>
                                <span style={{fontSize:10,fontWeight:700,color:"#94a3b8",minWidth:34}}>{t.code}</span>
                                <div style={{flex:1,minWidth:0}}>
                                  <span style={{fontSize:13,color:"#1e293b",fontWeight:600}}>
                                    {t.nombre}
                                    {t._programada && <span style={{fontSize:9,fontWeight:800,background:"#eef2ff",color:"#4338ca",borderRadius:20,padding:"1px 6px",marginLeft:6,verticalAlign:"middle"}}>📅{t._nota?" "+t._nota:""}</span>}
                                    <span style={{fontSize:10,fontWeight:700,marginLeft:8,padding:"1px 7px",borderRadius:20,background:todasHechas?"#dcfce7":"#e2e8f0",color:todasHechas?"#15803d":"#475569"}}>
                                      {hechasSub}/{totalSub}
                                    </span>
                                  </span>
                                  {t.hora && (function(){
                                    var h12n=(parseInt((t.hora||"0").split(":")[0],10)%12)||12; var art=h12n===1?"a la":"a las";
                                    var hecha = todasHechas;
                                    var color = hecha?"#16a34a":vencidaSub?"#b91c1c":"#b45309";
                                    var baseMsg = t.horaTexto ? t.horaTexto : ("Debe estar realizada "+art+" "+formatHora12(t.hora));
                                    var txt = hecha ? ("Hecha · era "+art+" "+formatHora12(t.hora)) : (baseMsg+(vencidaSub?" · ¡pendiente!":""));
                                    return <div style={{fontSize:11,fontWeight:700,color:color,marginTop:3,display:"flex",alignItems:"center",gap:4}}><span>{hecha?"✓":"⏰"}</span><span>{txt}</span></div>;
                                  })()}
                                </div>
                                <button onClick={function(){setSubOpen(function(s){var n=Object.assign({},s);n[t.code]=!s[t.code];return n;});}}
                                  style={{padding:"4px 9px",borderRadius:7,border:"1px solid #cbd5e1",cursor:"pointer",fontSize:11,fontWeight:700,background:"#fff",color:"#475569"}}>
                                  {abierto ? "▲ Cerrar" : "▼ Ver pasos"}
                                </button>
                              </div>
                              {abierto && (
                                <div style={{padding:"4px 12px 10px",borderTop:"1px solid #f1f5f9",background:"#ffffff"}}>
                                  {subsDef.map(function(it){
                                    var done = !!subState[it.id];
                                    return (
                                      <div key={it.id} onClick={function(){toggleSub(it.id);}}
                                        style={{display:"flex",alignItems:"flex-start",gap:9,padding:"7px 4px",cursor:estaBloqueada?"default":"pointer",borderBottom:"1px solid #f8fafc"}}>
                                        <div style={{width:20,height:20,borderRadius:6,border:"2px solid "+(done?"#10b981":"#cbd5e1"),background:done?"#10b981":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1,transition:"all .15s"}}>
                                          {done && <span style={{color:"#fff",fontSize:13,fontWeight:900,lineHeight:1}}>✓</span>}
                                        </div>
                                        <span style={{flex:1,fontSize:12.5,color:done?"#15803d":"#334155",fontWeight:done?600:500,textDecoration:done?"line-through":"none",opacity:done?0.85:1,lineHeight:1.35}}>
                                          {it.texto}
                                        </span>
                                      </div>
                                    );
                                  })}
                                  <div style={{display:"flex",gap:6,marginTop:8,paddingTop:8,borderTop:"1px solid #f1f5f9"}}>
                                    <button onClick={marcarNoTarea} disabled={estaBloqueada}
                                      style={{flex:1,padding:"6px 0",borderRadius:7,border:"none",cursor:estaBloqueada?"default":"pointer",fontSize:11,fontWeight:700,background:v==="No"?"#ef4444":"#fee2e2",color:v==="No"?"#fff":"#991b1b",opacity:estaBloqueada?0.7:1}}>
                                      Marcar como NO realizado
                                    </button>
                                    <div style={{flex:1,padding:"6px 0",borderRadius:7,background:todasHechas?"#dcfce7":"#f1f5f9",color:todasHechas?"#15803d":"#64748b",fontSize:11,fontWeight:700,textAlign:"center"}}>
                                      {todasHechas ? "✓ Completado" : "Faltan "+(totalSub-hechasSub)}
                                    </div>
                                  </div>
                                </div>
                              )}
                              {notaRender}
                              {campoValorRender}
                            </div>
                          );
                        }
                        var vencidaS = estaVencida(t, v==="Si" || v==="No");
                        return (
                          <div key={t.code} style={{borderRadius:10,border:(vencidaS?"2px":"1.5px")+" solid "+(v==="Si"?"#10b981":v==="No"?"#ef4444":vencidaS?"#f59e0b":"#e2e8f0"),background:v==="Si"?"#f0fdf4":v==="No"?"#fef2f2":vencidaS?"#fffbeb":"#fafafa",overflow:"hidden"}}>
                            <div style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px"}}>
                              <span style={{fontSize:10,fontWeight:700,color:"#94a3b8",minWidth:34}}>{t.code}</span>
                              <div style={{flex:1,minWidth:0}}>
                                <span style={{fontSize:13,color:"#1e293b",fontWeight:500}}>
                                  {t.nombre}
                                  {t._programada && <span style={{fontSize:9,fontWeight:800,background:"#eef2ff",color:"#4338ca",borderRadius:20,padding:"1px 6px",marginLeft:6,verticalAlign:"middle"}}>📅{t._nota?" "+t._nota:""}</span>}
                                </span>
                                {t.hora && (function(){
                                  var h12n=(parseInt((t.hora||"0").split(":")[0],10)%12)||12; var art=h12n===1?"a la":"a las";
                                  var hecha = v==="Si";
                                  var color = hecha?"#16a34a":vencidaS?"#b91c1c":"#b45309";
                                  var baseMsg = t.horaTexto ? t.horaTexto : ("Debe estar realizada "+art+" "+formatHora12(t.hora));
                                  var txt = hecha ? ("Hecha · era "+art+" "+formatHora12(t.hora)) : (baseMsg+(vencidaS?" · ¡pendiente!":""));
                                  return <div style={{fontSize:11,fontWeight:700,color:color,marginTop:3,display:"flex",alignItems:"center",gap:4}}><span>{hecha?"✓":"⏰"}</span><span>{txt}</span></div>;
                                })()}
                              </div>
                              <div style={{display:"flex",gap:5}}>
                                {["Si","No"].map(function(opt){
                                  return (
                                    <button key={opt} onClick={function(){if(!estaBloqueada)toggle(t.code,opt);}} style={{padding:"4px 11px",borderRadius:7,border:"none",cursor:estaBloqueada?"default":"pointer",fontSize:12,fontWeight:700,background:v===opt?(opt==="Si"?"#10b981":"#ef4444"):"#e2e8f0",color:v===opt?"#fff":"#64748b",opacity:estaBloqueada?0.7:1}}>
                                      {opt}
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                            {notaRender}
                            {campoValorRender}
                          </div>
                        );
                      })}
                    </div>
                  ) : <p style={{color:"#94a3b8",fontSize:13,textAlign:"center"}}>No hay tareas para este turno</p>}
                </div>

                {mostrarVentas && (
                <div>
                  <SectionTitle text="Bloque 2 — Meta de ventas"/>
                  <div style={{padding:"14px 16px",background:"#f8fafc",borderRadius:12,border:"1.5px solid #e2e8f0"}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
                      <div>
                        <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:6}}>META FIJADA (COP)</div>
                        <div style={{fontSize:22,fontWeight:800,color:metaDiaria?"#8DC63F":"#94a3b8"}}>{metaDiaria?formatCOP(metaDiaria):"Sin meta"}</div>
                        {!metaDiaria && <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>El líder no ha fijado meta</div>}
                      </div>
                      <div>
                        <label style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:6,display:"block"}}>VENTAS ALCANZADAS (COP)</label>
                        <input type="number" value={ventas} onChange={function(e){if(!estaBloqueada){setVentas(e.target.value);}}} disabled={estaBloqueada} placeholder="0" style={{width:"100%",padding:"9px 12px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:18,fontWeight:700,color:"#10b981",background:estaBloqueada?"#f1f5f9":"#f8fafc",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
                        {metaDiaria && ventas && (
                          <div style={{fontSize:11,fontWeight:700,marginTop:4,color:Number(ventas)>=metaDiaria?"#10b981":"#f59e0b"}}>
                            {Math.round(Number(ventas)/metaDiaria*100)}% de la meta
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
                )}

                {metricasList.length > 0 && (
                <div>
                  <SectionTitle text="Bloque 3 - Actividades y rendimiento"/>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    {metricasList.map(function(m) {
                      return (
                        <div key={m.code} style={{background:"#f8fafc",borderRadius:10,padding:"10px 12px",border:"1.5px solid #e2e8f0"}}>
                          <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:5,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{m.nombre}</div>
                          <input type="number" min="0" value={metricas[m.code]||""} onChange={function(e){if(!estaBloqueada)setMet(m.code,e.target.value);}} disabled={estaBloqueada} placeholder="0" style={{width:"100%",padding:"7px 10px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:16,fontWeight:700,color:"#1e293b",background:estaBloqueada?"#f1f5f9":"#fff",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
                        </div>
                      );
                    })}
                  </div>
                </div>
                )}

                <div>
                  <label style={{fontSize:11,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:5,display:"block"}}>Notas / Observacíones</label>
                  <textarea value={notas} onChange={function(e){if(!estaBloqueada){setNotas(e.target.value);}}} disabled={estaBloqueada} rows={3} placeholder="Novedades del turno..." style={{width:"100%",padding:"9px 12px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:14,color:"#1e293b",background:estaBloqueada?"#f1f5f9":"#f8fafc",outline:"none",boxSizing:"border-box",fontFamily:"inherit",resize:"vertical",lineHeight:1.5}}/>
                </div>
              </div>
            )}

            {confirmarBorrar && (
              <div style={{padding:"18px",borderRadius:14,border:"2px solid #fca5a5",background:"#fef2f2"}}>
                <div style={{fontSize:14,fontWeight:800,color:"#991b1b",marginBottom:6}}>Borrar bitácora del día</div>
                <div style={{fontSize:13,color:"#b91c1c",marginBottom:14}}>
                  ¿Estás seguro de que quieres eliminar toda la información registrada hoy? Esta acción no se puede deshacer.
                </div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={handleBorrar} style={{flex:1,padding:"11px 0",borderRadius:10,border:"none",background:"#ef4444",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}}>
                    Sí, borrar todo
                  </button>
                  <button onClick={function(){setConfirmarBorrar(false);}} style={{flex:1,padding:"11px 0",borderRadius:10,border:"1.5px solid #e2e8f0",background:"#fff",color:"#475569",fontWeight:700,fontSize:14,cursor:"pointer"}}>
                    Cancelar
                  </button>
                </div>
              </div>
            )}
            <div style={{display:"flex",gap:8,flexDirection:"column"}}>
              <div style={{display:"flex",gap:8}}>
                <button onClick={handleSave} disabled={!rol || estaBloqueada} style={{flex:1,padding:13,borderRadius:12,border:"none",background:estaBloqueada?"#e2e8f0":saved?"#10b981":!rol?"#e2e8f0":"linear-gradient(135deg,#8DC63F,#5a8a1f)",color:(!rol||estaBloqueada)?"#94a3b8":"#fff",fontSize:15,fontWeight:700,cursor:(rol&&!estaBloqueada)?"pointer":"default"}}>

                </button>
                {existingData[asesora+"__"+fecha] && !confirmarBorrar && !estaBloqueada && (

                    Borrar
                  </button>
                )}
                {existingData[asesora+"__"+fecha] && !confirmarBorrar && estaBloqueada && isAdmin && (
                  <button onClick={function(){setConfirmarBorrar(true);}} style={{padding:"13px 16px",borderRadius:12,border:"none",background:"#fef2f2",color:"#ef4444",fontWeight:700,fontSize:13,cursor:"pointer",flexShrink:0}}>
                    Borrar

    // ===================== DASHBOARD =====================
    function DashboardView(props) {
      var allEntries = props.entries;
      var config = props.config;
      var ASESORAS = config.asesoras || ASESORAS_DEFAULT;
      var metricasDef = config.metricas || METRICAS_BASE;

      var [tab, setTab] = useState("hoy");
      var [filtroA, setFiltroA] = useState("Todas");
      var [filtroF, setFiltroF] = useState("");
      var [analisisDesde, setAnalisisDesde] = useState(function(){return today().slice(0,7)+"-01";});
      var [analisisHasta, setAnalisisHasta] = useState(function(){return today();});
      var [analisisAsesora, setAnalisisAsesora] = useState("Todas");
      var [fechaDesde, setFechaDesde] = useState(function(){
        var d = new Date(); d.setDate(d.getDate()-6);
        var off = d.getTimezoneOffset(); var loc = new Date(d.getTime()-off*60000);
        return loc.toISOString().slice(0,10);
      });
      var [fechaHasta, setFechaHasta] = useState(function(){return today();});

      var turnosHoy = getTurnosDelDia(today(), config.overrides||{}, config);
      var todasEntries = Object.values(allEntries);

      // ── Helpers ──
      function getMetrica(e, code) { return Number((e.metricas&&e.metricas[code])||0); }
      function sumMetrica(lista, code) { return lista.reduce(function(s,e){return s+getMetrica(e,code);},0); }
      function avgPct(lista) {
        var ps = lista.map(function(e){return pctCheck(e.checks);}).filter(function(v){return v!==null;});
        return ps.length ? Math.round(ps.reduce(function(s,v){return s+v;},0)/ps.length) : null;
      }
      function colorPct(v) { return v===null?"#94a3b8":v>=90?"#10b981":v>=70?"#f59e0b":"#ef4444"; }

      // ── Datos HOY ──
      var asesorasHoy = ASESORAS.map(function(a,i){
        var rol = turnosHoy[a];
        var entry = allEntries[a+"__"+today()];
        var meta = getMetaEfectiva(config, today(), rol);
        var ventas = entry ? Number(entry.ventas||0) : 0;
        var pct = entry ? pctCheck(entry.checks) : null;
        var pctVentas = meta && ventas ? Math.round(ventas/meta*100) : null;
        return {a:a, i:i, rol:rol, entry:entry, meta:meta, ventas:ventas, pct:pct, pctVentas:pctVentas};
      });
      var totalVentasHoy = asesorasHoy.reduce(function(s,x){return s+x.ventas;},0);
      var registradasHoy = asesorasHoy.filter(function(x){return !!x.entry;}).length;
      var trabajanHoy = asesorasHoy.filter(function(x){return !!x.rol;}).length;

      // ── Datos PERÍODO ──
      var entriesPeriodo = todasEntries.filter(function(e){return e.fecha>=fechaDesde&&e.fecha<=fechaHasta;});
      var datosPeriodo = ASESORAS.map(function(a,i){
        var sus = entriesPeriodo.filter(function(e){return e.asesora===a;});
        var ventas = sus.reduce(function(s,e){return s+(Number(e.ventas)||0);},0);
        var pctT = avgPct(sus);
        var metaTotal = sus.reduce(function(s,e){
          var m = getMetaEfectiva(config,e.fecha,e.rol);
          return s+(m?Number(m):0);
        },0);
        var pctMeta = metaTotal>0 ? Math.round(ventas/metaTotal*100) : null;
        return {
          a:a, i:i,
          registros: sus.length,
          ventas: ventas,
          metaTotal: metaTotal,
          pctMeta: pctMeta,
          pctTareas: pctT,
          msgs: sumMetrica(sus,"R001"),
          atajos: sumMetrica(sus,"R009"),
          campanas: sumMetrica(sus,"R002"),
          seguimientos: sumMetrica(sus,"R003"),
          llamadas: sumMetrica(sus,"R004"),
          ventasPresenciales: sumMetrica(sus,"R005"),
          ventas2da: sumMetrica(sus,"R006"),
          ventas1ra: sumMetrica(sus,"R007"),
          novedades: sumMetrica(sus,"R011"),
        };
      }).sort(function(a,b){return b.ventas-a.ventas;});
      var fechasUnicas = Array.from(new Set(entriesPeriodo.map(function(e){return e.fecha;}))).sort();
      var maxVentasDia = Math.max.apply(null, fechasUnicas.map(function(f){
        return entriesPeriodo.filter(function(e){return e.fecha===f;}).reduce(function(s,e){return s+(Number(e.ventas)||0);},0);
      }).concat([1]));

      // Datos por asesor x rol (para gráfico de rendimiento)
      var rendimientoPorAsesoraRol = ASESORAS.map(function(a, ai) {
        var roles = getRoleKeys(config);
        var datosRol = roles.map(function(rol) {
          var sus = entriesPeriodo.filter(function(e){ return e.asesora===a && e.rol===rol; });
          if (sus.length === 0) return null;
          var ventas = sus.reduce(function(s,e){return s+(Number(e.ventas)||0);},0);
          var pctT = avgPct(sus);
          var metaTotal = sus.reduce(function(s,e){
            var m = getMetaEfectiva(config,e.fecha,rol);
            return s+(m?Number(m):0);
          },0);
          var pctMeta = metaTotal>0 ? Math.round(ventas/metaTotal*100) : null;
          return { rol:rol, dias:sus.length, ventas:ventas, pctTareas:pctT, pctMeta:pctMeta };
        }).filter(Boolean);
        return { a:a, ai:ai, datos:datosRol };
      }).filter(function(x){ return x.datos.length > 0; });

      // ── Historial ──
      var listaHistorial = todasEntries
        .filter(function(e){return (filtroA==="Todas"||e.asesora===filtroA)&&(!filtroF||e.fecha===filtroF);})
        .sort(function(a,b){return b.fecha.localeCompare(a.fecha);});

      var sel = {padding:"7px 10px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:12,background:"#f8fafc",color:"#1e293b",cursor:"pointer",fontFamily:"inherit"};
      var tabBtn = function(id,lbl){return <button onClick={function(){setTab(id);}} style={{padding:"8px 18px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:13,background:tab===id?"#8DC63F":"transparent",color:tab===id?"#fff":"#64748b",fontFamily:"inherit"}}>{lbl}</button>;};

              <h2 style={{fontSize:20,fontWeight:800,color:"#1a2e0a",margin:"0 0 2px"}}>Dashboard</h2>
              <span style={{fontSize:12,color:"#94a3b8"}}>{todasEntries.length} registros totales</span>
            </div>
            <div style={{display:"flex",gap:3,background:"#f1f5f9",borderRadius:10,padding:4}}>
              {tabBtn("hoy","Hoy")}
              {tabBtn("periodo","Período")}
              {tabBtn("historial","Historial")}
            </div>
          </div>

          {/* ══════ TAB HOY ══════ */}
          {tab === "hoy" && (
            <div style={{display:"flex",flexDirection:"column",gap:14}}>

              {/* KPIs del día */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:10}}>
                {[
                  {label:"Trabajando hoy", val:trabajanHoy+"/"+ASESORAS.length, color:"#8DC63F"},
                  {label:"Registradas", val:registradasHoy+"/"+trabajanHoy, color:"#10b981"},
                  {label:"Ventas del día", val:totalVentasHoy>0?formatCOP(totalVentasHoy):"$0", color:"#6366f1"},
                  {label:"Pendientes", val:(trabajanHoy-registradasHoy)+"", color:trabajanHoy-registradasHoy>0?"#f59e0b":"#10b981"},
                ].map(function(k,i){
                  return (
                    <div key={i} style={Object.assign({},card,{textAlign:"center"})}>
                      <div style={{fontSize:11,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>{k.label}</div>
                      <div style={{fontSize:22,fontWeight:900,color:k.color}}>{k.val}</div>
                    </div>
                  );
                })}
              </div>

              {/* Alertas tardanzas */}
              {(function(){
                var asistHoy = (config.asistencia && config.asistencia[today()]) || {};
                var tardanzas = ASESORAS.filter(function(a){
                  var fbKey = a.replace(/[.#$\[\]]/g,"_");
                  var reg = asistHoy[fbKey];
                  return reg && reg.puntualidad === "Tarde";

                  <div style={{padding:"12px 16px",borderRadius:12,background:"#fffbeb",border:"2px solid #f59e0b",display:"flex",alignItems:"center",gap:12}}>
                    <span style={{fontSize:20}}>&#9888;&#65039;</span>
                    <div>
                      <div style={{fontSize:13,fontWeight:800,color:"#92400e"}}>Llegadas tarde hoy</div>
                      <div style={{fontSize:12,color:"#b45309"}}>{tardanzas.join(", ")}</div>

                  </div>

              {/* Tarjetas asesoras */}
              <div style={card}>

                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                          <div style={{width:34,height:34,borderRadius:10,background:AVATAR_BG[x.i%AVATAR_BG.length],display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"#fff",fontWeight:800,flexShrink:0}}>{initials(x.a)}</div>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:13,fontWeight:700,color:"#0f172a",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.a.split(" ")[0]}</div>
                            <div style={{fontSize:10,color:"#64748b"}}>{x.a.split(" ").slice(1).join(" ")}</div>

                        {x.meta>0 && <div style={{fontSize:11,color:"#64748b",marginTop:5}}>Meta: <b style={{color:"#8DC63F"}}>{formatCOP(x.meta)}</b></div>}
                        {x.ventas>0 && (
                          <div style={{marginTop:4}}>
                            <span style={{fontSize:12,fontWeight:700,color:"#10b981"}}>{formatCOP(x.ventas)}</span>
                            {x.pctVentas!==null && <span style={{fontSize:10,color:x.pctVentas>=100?"#10b981":"#f59e0b",marginLeft:5}}>({x.pctVentas}% meta)</span>}
                          </div>
                        )}
                        {estado==="pendiente" && <div style={{fontSize:11,color:"#f59e0b",fontWeight:700,marginTop:6}}>⏳ Sin registrar</div>}
                        {estado==="libre" && <div style={{fontSize:11,color:"#94a3b8",marginTop:4,fontStyle:"italic"}}>No trabaja hoy</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* ══════ TAB PERÍODO ══════ */}
          {tab === "periodo" && (
            <div style={{display:"flex",flexDirection:"column",gap:14}}>

              {/* Filtros */}

                <input type="date" value={fechaDesde} onChange={function(e){setFechaDesde(e.target.value);}} style={sel}/>
                <span style={{fontSize:13,fontWeight:700,color:"#475569"}}>Hasta</span>
                <input type="date" value={fechaHasta} onChange={function(e){setFechaHasta(e.target.value);}} style={sel}/>
                <div style={{marginLeft:"auto",display:"flex",gap:5}}>
                  {[["7","7 días",6],["30","30 días",29],["mes","Este mes",-1]].map(function(item){

                      var d=new Date();d.setDate(d.getDate()-item[2]);

                      setFechaDesde(loc.toISOString().slice(0,10));setFechaHasta(today());
                    }} style={{padding:"5px 11px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"#f8fafc",color:"#475569",fontWeight:700,fontSize:11,cursor:"pointer"}}>{item[1]}</button>;
                  })}
                </div>
                <span style={{fontSize:11,color:"#94a3b8"}}>{entriesPeriodo.length} registros</span>
              </div>

              {/* KPIs período */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:10}}>
                {[
                  {label:"Total ventas", val:formatCOP(datosPeriodo.reduce(function(s,d){return s+d.ventas;},0)), color:"#10b981"},
                  {label:"Registros", val:entriesPeriodo.length+"", color:"#6366f1"},
                  {label:"Msgs enviados", val:datosPeriodo.reduce(function(s,d){return s+d.msgs;},0)+"", color:"#0ea5e9"},

                  {label:"V. recurrente", val:datosPeriodo.reduce(function(s,d){return s+d.ventas2da;},0)+"", color:"#a855f7"},

                      <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:5}}>{k.label}</div>

                  );

          {/* ══════ TAB HISTORIAL ══════ */}

            return (

                // Calcular arcos SVG
                var cx=120,cy=120,r=90,ri=50;
                var angulo = -Math.PI/2;
                var arcos = dataTorta.map(function(d){

                  var xi2=cx+ri*Math.cos(angulo+ang), yi2=cy+ri*Math.sin(angulo+ang);
                  var large = ang>Math.PI?1:0;
                  var path = "M "+xi1+" "+yi1+" L "+x1+" "+y1+" A "+r+" "+r+" 0 "+large+" 1 "+x2+" "+y2+" L "+xi2+" "+yi2+" A "+ri+" "+ri+" 0 "+large+" 0 "+xi1+" "+yi1+" Z";
                  var labelAng = angulo + ang/2;
                  var lx=cx+(r+ri)/2*Math.cos(labelAng), ly=cy+(r+ri)/2*Math.sin(labelAng);

                          </div>
                          {x.datos.length>1 && mejorRolVentas && mejorRolVentas.ventas>0 && (

                          {x.datos.sort(function(a,b){return b.ventas-a.ventas;}).map(function(d,di){
                            var c = getRoleColors(config)[d.rol] || {};
                            var barW = maxVentas>0 ? Math.max(2, Math.round((d.ventas/maxVentas)*100)) : 2;

                            return (

                                border:"1.5px solid "+(di===0&&d.ventas>0?"#d4edaa":"#e2e8f0")}}>

                                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
                                  <RolBadge rol={d.rol}/>
                                  <span style={{fontSize:11,color:"#94a3b8"}}>{d.dias} día{d.dias>1?"s":""}</span>
                                  <div style={{marginLeft:"auto",display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
                                    {d.ventas>0 && <span style={{fontSize:13,fontWeight:800,color:"#10b981"}}>{formatCOP(d.ventas)}</span>}
                                    {d.ventas===0 && <span style={{fontSize:12,color:"#94a3b8",fontStyle:"italic"}}>Sin ventas</span>}
                                    {d.pctMeta!==null && <span style={{fontSize:11,fontWeight:700,color:pcMColor,background:pcMColor+"18",borderRadius:20,padding:"2px 9px"}}>{d.pctMeta}% meta</span>}
                                    {d.pctTareas!==null && <span style={{fontSize:11,fontWeight:700,color:pcTColor,background:pcTColor+"18",borderRadius:20,padding:"2px 9px"}}>{d.pctTareas}% tareas</span>}
                                  </div>
                                </div>
                                {/* Barra ventas */}
                                <div style={{height:10,background:"#e2e8f0",borderRadius:5,overflow:"hidden",marginBottom:10}}>
                                  <div style={{height:"100%",width:d.ventas>0?barW+"%":"0%",
                                    background:"linear-gradient(90deg,"+(c.dot||"#8DC63F")+","+(c.dot||"#5a8a1f")+")",
                                    borderRadius:5,transition:"width 0.6s"}}/>
                                </div>
                                {/* Métricas secundarias */}
                                <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                                  {[
                                    {label:"Msgs",val:d.msgs,color:"#0ea5e9"},
                                    {label:"Llamadas",val:d.llamadas,color:"#f59e0b"},
                                    {label:"V.1ra",val:d.v1,color:"#8DC63F"},
                                    {label:"V.2da+",val:d.v2,color:"#a855f7"},
                                    {label:"Seguim.",val:d.seguim,color:"#64748b"},
                                  ].filter(function(m){return m.val>0;}).map(function(m){
                                    return (
                                      <div key={m.label} style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:44}}>
                                        <div style={{fontSize:14,fontWeight:800,color:m.color}}>{m.val}</div>
                                        <div style={{fontSize:9,color:"#94a3b8",fontWeight:600,textTransform:"uppercase"}}>{m.label}</div>

                              </div>

                        </div>
                      </div>
                    );
                  })

              {/* Tabla historial detallado — usa los mismos filtros de arriba */}
              <div style={Object.assign({},card,{padding:0,overflow:"hidden"})}>

                  <span style={{fontSize:13,fontWeight:700,color:"#0f172a",marginRight:"auto"}}>Registros detallados</span>

                </div>
                {analisisEntries.length===0
                  ? <div style={{padding:40,textAlign:"center",color:"#94a3b8",fontSize:14}}>Sin registros</div>
                  : <div style={{overflowX:"auto"}}>
                      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                        <thead>
                          <tr style={{background:"#f8fafc"}}>

                              return <th key={h} style={{padding:"9px 12px",textAlign:"left",fontWeight:700,color:"#64748b",fontSize:10,textTransform:"uppercase",whiteSpace:"nowrap",borderBottom:"1px solid #e2e8f0"}}>{h}</th>;
                            })}
                          </tr>
                        </thead>
                        <tbody>
                          {analisisEntries.slice().sort(function(a,b){return b.fecha.localeCompare(a.fecha);}).map(function(e,i){

                            var ai=ASESORAS.indexOf(e.asesora);
                            var metaE=getMetaEfectiva(config,e.fecha,e.rol);
                            var pctV=metaE&&e.ventas?Math.round(Number(e.ventas)/metaE*100):null;
                            return (

                                <td style={{padding:"9px 12px"}}>
                                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                                    <div style={{width:22,height:22,borderRadius:6,background:AVATAR_BG[ai>=0?ai%AVATAR_BG.length:0],display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"#fff",fontWeight:800}}>{initials(e.asesora)}</div>

    // ===================== TURNOS TAB =====================
    function applyOverride(overrides, fecha, persona, rol) {
      var updated = JSON.parse(JSON.stringify(overrides));
      var day = updated[fecha] || {};
      if (rol === "auto") delete day[persona];
      else day[persona] = rol;
      if (Object.keys(day).length === 0) delete updated[fecha];
      else updated[fecha] = day;
      return updated;
    }

    function TurnosTab(props) {
      var overrides = props.overrides;
      var setOverrides = props.setOverrides;
      var onSave = props.onSave;
      var saved = props.saved;
      var ASESORAS_TODAS = props.asesoras || ASESORAS_DEFAULT;
      var config = props.config || {};

      // Filtrar: solo asesoras que NO tienen rol fijo aparecen en este tab.
      // Las de rol fijo (definidas en config.rolesAsesoras) no rotan, no tiene sentido mostrarlas
      // en el tablero de turnos porque su rol es siempre el mismo.
      var rolesAsesorasFijos = (config && config.rolesAsesoras) || {};
      var ASESORAS = ASESORAS_TODAS.filter(function(a){
        return !rolesAsesorasFijos[a]; // si no tiene rol fijo asignado, se incluye
      });

      var [viewMode, setViewMode] = useState("tablero");
      var [semana, setSemana] = useState(function(){return getMondayOf(today());});
      var [weekRoles, setWeekRoles] = useState({});
      var [diaFecha, setDiaFecha] = useState(function(){return today();});
      var [stagingDay, setStagingDay] = useState({});
      // tablero: celda activa para editar {asesora, fecha} o null
      var [celdaActiva, setCeldaActiva] = useState(null);
      var [celdaRol, setCeldaRol] = useState("");

      var diasSemana = getWeekDays(semana);

      function commitOverrides(updated) { setOverrides(updated); onSave(updated); }
      function setWeekRole(asesora, rol) { setWeekRoles(function(w){var n=Object.assign({},w);n[asesora]=w[asesora]===rol?"":rol;return n;}); }

      function applyWeek() {
        var updated = JSON.parse(JSON.stringify(overrides));
        diasSemana.forEach(function(fecha) {
          ASESORAS.forEach(function(a) {
            var r = weekRoles[a];
            if (!r && r !== "libre") return;
            updated = applyOverride(updated, fecha, a, r || "auto");
          });
        });
        commitOverrides(updated);
        setWeekRoles({});
      }

      function stageRol(persona, rol) { setStagingDay(function(s){var n=Object.assign({},s);n[persona]=s[persona]===rol?undefined:rol;return n;}); }

      function applyDay() {
        var updated = JSON.parse(JSON.stringify(overrides));
        Object.entries(stagingDay).forEach(function(entry) {
          var persona = entry[0]; var rol = entry[1];
          if (rol === undefined) return;
          updated = applyOverride(updated, diaFecha, persona, rol);
        });
        commitOverrides(updated);
        setStagingDay({});
      }

      function clearDayOverride(fecha, persona) { commitOverrides(applyOverride(overrides, fecha, persona, "auto")); }
      function clearAllDay(fecha) { var u=JSON.parse(JSON.stringify(overrides));delete u[fecha];commitOverrides(u); }

      // tablero: abrir editor de celda
      function abrirCelda(asesora, fecha) {
        var over = overrides[fecha] && overrides[fecha][asesora];
        var rolActual = over !== undefined ? over : getRolBase(asesora, fecha) || "libre";
        setCeldaActiva({asesora:asesora, fecha:fecha});
        setCeldaRol(rolActual);
      }
      function guardarCelda() {
        if (!celdaActiva) return;
        var updated = applyOverride(overrides, celdaActiva.fecha, celdaActiva.asesora, celdaRol === getRolBase(celdaActiva.asesora, celdaActiva.fecha) ? "auto" : celdaRol);
        commitOverrides(updated);
        setCeldaActiva(null);
      }
      function limpiarCelda() {
        if (!celdaActiva) return;
        commitOverrides(applyOverride(overrides, celdaActiva.fecha, celdaActiva.asesora, "auto"));
        setCeldaActiva(null);
      }

      var hasWeekChanges = Object.values(weekRoles).some(function(r){return r!=="";});
      var hasDayChanges = Object.values(stagingDay).some(function(r){return r!==undefined;});

      var modeBtn = function(id, lbl) {
        return <button onClick={function(){setViewMode(id);}} style={{flex:1,padding:"8px 10px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,background:viewMode===id?"#8DC63F":"transparent",color:viewMode===id?"#fff":"#64748b",fontFamily:"inherit"}}>{lbl}</button>;
      };

      return (
        <div>

    // ===================== METAS TAB =====================
    function MetasTab(props) {
      var config = props.config;
      var onSave = props.onSave;
      var onConfigChange = props.onConfigChange;
      var saved = props.saved;

      var metasBase = (config.metas && config.metas.default) || {};
      var metasDias = (config.metas && config.metas.dias) || {};
      // Solo roles con ventas activas
      var todosRoles = getRoleKeys(config);
      var rolesConVentasActivos = (config.rolesConVentas && config.rolesConVentas.length > 0)
        ? todosRoles.filter(function(r){ return config.rolesConVentas.indexOf(r) >= 0; })
        : todosRoles;

      var [modo, setModo] = useState("semana");
      var [semana, setSemana] = useState(function(){return getMondayOf(today());});
      var [diaFecha, setDiaFecha] = useState(function(){return today();});

                        <span style={{fontSize:12,color:"#94a3b8",fontWeight:600}}>COP</span>

                      {base && <div style={{fontSize:11,color:"#94a3b8",marginTop:4}}>Base: {Number(base).toLocaleString("es-CO")} COP</div>}

              <div style={{display:"flex",gap:8}}>

                    <div key={r} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:"#f8fafc",borderRadius:12,border:"1px solid #e2e8f0"}}>
                      <RolBadge rol={r}/>
                      <div style={{flex:1}}/>
                      <input type="number" value={localBase[r]||""} onChange={function(e){setLocalBase(function(m){var n=Object.assign({},m);n[r]=e.target.value;return n;});}} placeholder="0" style={Object.assign({},inp2,{width:150,textAlign:"right",fontWeight:700,fontSize:15})}/>
                      <span style={{fontSize:12,color:"#94a3b8",fontWeight:600}}>COP</span>
                    </div>
                  );

              </div>
              <button onClick={saveBase} style={{width:"100%",padding:12,borderRadius:11,border:"none",background:saved?"#10b981":"linear-gradient(135deg,#8DC63F,#5a8a1f)",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}}>
                {saved?"Guardado":"Guardar meta base"}

              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {getRoleKeys(config).map(function(rol){
                  var rolesConVentas = config.rolesConVentas;
                  // Si no hay config, todos activos por defecto
                  var activo = !rolesConVentas || rolesConVentas.length === 0 || rolesConVentas.indexOf(rol) >= 0;
                  var c = getRoleColors(config)[rol] || {};
                  return (
                    <div key={rol} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderRadius:12,
                      border:"1.5px solid "+(activo?(c.dot||"#8DC63F"):"#e2e8f0"),

                      <span style={{background:c.bg||"#f1f5f9",color:c.text||"#475569",padding:"3px 10px",borderRadius:20,fontWeight:700,fontSize:12,border:"1.5px solid "+(c.dot||"#e2e8f0"),flex:1}}>{rol}</span>
                      <span style={{fontSize:12,color:activo?"#15803d":"#94a3b8",fontWeight:600,minWidth:80,textAlign:"right"}}>
                        {activo?"✓ Con ventas":"Sin ventas"}
                      </span>
                      <button onClick={function(){
                        var base = (config.rolesConVentas && config.rolesConVentas.length > 0)

                          : getRoleKeys(config).slice();
                        var nuevos = base.indexOf(rol) >= 0

        </div>

      var mesData = novedades[mesKey] || {};

      var [detallesLocal, setDetallesLocal] = useState(function(){return Object.assign({},(config.novedadesDetalle&&config.novedadesDetalle[mesKey])||{});});

        setLocalMes(Object.assign({},(novedades[mesKey]||{})));
        setDetallesLocal(Object.assign({},(config.novedadesDetalle&&config.novedadesDetalle[mesKey])||{}));
      }, [mesIdx,anio]);

      function handleSave() {
        var u=Object.assign({},novedades); u[mesKey]=localMes; setNovedades(u);
        var nd=Object.assign({},config.novedadesDetalle||{}); nd[mesKey]=detallesLocal;
        onSave(u, nd);

        if (!newMotivo.trim()) return;
        var det = (detallesLocal[asesora]||[]).slice();
        det.push({ticket:newTicket.trim()||"S/N", motivo:newMotivo.trim(), fecha:today()});
        var nd = Object.assign({},detallesLocal); nd[asesora]=det;
        setDetallesLocal(nd);
        setVal(asesora, (Number(localMes[asesora]||0)+1));
        setNewTicket(""); setNewMotivo("");

      function eliminarDetalle(asesora, idx) {
        var det = (detallesLocal[asesora]||[]).filter(function(_,i){return i!==idx;});
        var nd = Object.assign({},detallesLocal); nd[asesora]=det;
        setDetallesLocal(nd);
        setVal(asesora, Math.max(0,(Number(localMes[asesora]||0)-1)));

                            <div style={{display:"grid",gridTemplateColumns:"110px 1fr",gap:8,marginBottom:8}}>
                              <input placeholder="Ticket #" value={newTicket} onChange={function(e){setNewTicket(e.target.value);}} style={inp2}/>
                              <input placeholder="Motivo..." value={newMotivo} onChange={function(e){setNewMotivo(e.target.value);}} onKeyDown={function(e){if(e.key==="Enter")agregarDetalle(a);}} style={inp2}/>
                            </div>
