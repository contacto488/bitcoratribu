                      })}
                    </div>

                    <div style={{padding:"12px 14px",borderRadius:10,background:"#fffbeb",border:"1px solid #fde68a",fontSize:12,color:"#92400e"}}>
                      ⚠️ Cada tarea debe tener un código que empiece con el prefijo de su grupo (ej: <b>A001</b> para Vendedores, <b>S001</b> para Soporte). Si creas una tarea con un prefijo nuevo (ej: <b>M001</b>), la app te ofrecerá crear un grupo nuevo automáticamente.
                    </div>
                  </div>
                );
              })()}
            </div>
          )}
        </div>
      );
    }

    // ===================== METRICAS ADMIN TAB =====================
    function MetricasAdminTab(props) {
      var metricas = props.metricas || [];
      var setMetricas = props.setMetricas;
      var config = props.config || {};
      var onSave = props.onSave;
      var guardado = props.saved;

      var [editandoCode, setEditandoCode] = useState(null);
      var [textoEdicion, setTextoEdicion] = useState("");
      var [confirmarEliminar, setConfirmarEliminar] = useState(null);
      var [nuevaMet, setNuevaMet] = useState({code:"", nombre:""});

      var rolesDisponibles = getRolesAsignables(config);
      var coloresRoles = getRoleColors(config);
      var inp2 = {padding:"9px 12px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,color:"#1e293b",background:"#f8fafc",outline:"none",fontFamily:"inherit"};

      function toggleRolMetrica(code, rol) {
        setMetricas(function(lista) {
          return lista.map(function(m) {
            if (m.code !== code) return m;
            var rls = Array.isArray(m.roles) ? m.roles : rolesDisponibles.slice();
            var nuevosRoles = rls.indexOf(rol) >= 0
              ? rls.filter(function(r) { return r !== rol; })
              : rls.concat([rol]);
            return Object.assign({}, m, {roles: nuevosRoles});
          });
        });
      }

      function empezarEdicion(m) { setEditandoCode(m.code); setTextoEdicion(m.nombre); }
      function confirmarEdicion(code) {
        if (!textoEdicion.trim()) return;
        setMetricas(function(lista) {
          return lista.map(function(m) { return m.code===code ? Object.assign({},m,{nombre:textoEdicion.trim()}) : m; });
        });
        setEditandoCode(null);
      }
      function eliminarMetrica(code) {
        setMetricas(function(lista) { return lista.filter(function(m) { return m.code !== code; }); });
        setConfirmarEliminar(null);
      }
      function agregarMetrica() {
        if (!nuevaMet.code.trim() || !nuevaMet.nombre.trim()) return;
        setMetricas(function(lista) { return lista.concat([{code:nuevaMet.code.trim(), nombre:nuevaMet.nombre.trim(), roles:rolesDisponibles.slice()}]); });
        setNuevaMet({code:"", nombre:""});
      }

      return (
        <div>
          <p style={{fontSize:13,color:"#64748b",marginTop:0,marginBottom:14}}>
            Define las métricas y qué roles las ven. Si un rol no tiene métricas asignadas, no verá el Bloque 3.
          </p>

          <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>
            {metricas.map(function(m) {
              var esteEditando = editandoCode === m.code;
              var rolesMetrica = Array.isArray(m.roles) ? m.roles : rolesDisponibles.slice();
              return (
                <div key={m.code} style={{padding:"10px 14px",borderRadius:11,
                  border:"1.5px solid "+(esteEditando?"#f59e0b":"#e2e8f0"),
                  background:esteEditando?"#fffbeb":"#f8fafc"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:esteEditando?10:8}}>
                    <span style={{fontSize:10,fontWeight:700,color:"#94a3b8",minWidth:38}}>{m.code}</span>
                    {esteEditando ? (
                      <input
                        value={textoEdicion}
                        onChange={function(e){setTextoEdicion(e.target.value);}}
                        onKeyDown={function(e){if(e.key==="Enter")confirmarEdicion(m.code);if(e.key==="Escape")setEditandoCode(null);}}
                        autoFocus
                        style={Object.assign({},inp2,{flex:1,fontWeight:600,borderColor:"#f59e0b",background:"#fff"})}
                      />
                    ) : (
                      <span style={{flex:1,fontSize:13,fontWeight:600,color:"#1e293b"}}>{m.nombre}</span>
                    )}
                    <div style={{display:"flex",gap:4}}>
                      {esteEditando ? (
                        <>
                          <button onClick={function(){confirmarEdicion(m.code);}}
                            style={{padding:"4px 12px",borderRadius:7,border:"none",background:"#8DC63F",color:"#fff",fontWeight:700,fontSize:11,cursor:"pointer"}}>✓ Guardar</button>
                          <button onClick={function(){setEditandoCode(null);}}
                            style={{padding:"4px 10px",borderRadius:7,border:"1.5px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:700,fontSize:11,cursor:"pointer"}}>Cancelar</button>
                        </>
                      ) : (
                        <>
                          <button onClick={function(){empezarEdicion(m);}}
                            style={{padding:"4px 10px",borderRadius:7,border:"1.5px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:700,fontSize:11,cursor:"pointer"}}>✏ Editar</button>
                          <button onClick={function(){setConfirmarEliminar(m.code);setEditandoCode(null);}}
                            style={{padding:"4px 9px",borderRadius:7,border:"none",background:"#fef2f2",color:"#ef4444",fontWeight:700,fontSize:11,cursor:"pointer"}}>✕</button>
                        </>
                      )}
                    </div>
                  </div>
                  {!esteEditando && (
                    <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                      {rolesDisponibles.map(function(r){
                        var activo = rolesMetrica.indexOf(r) >= 0;
                        var c = coloresRoles[r] || {};
                        return (
                          <button key={r} onClick={function(){toggleRolMetrica(m.code,r);}}
                            style={{padding:"2px 9px",borderRadius:20,fontWeight:700,fontSize:10,cursor:"pointer",
                              border:"1.5px solid "+(activo?(c.dot||"#8DC63F"):"#e2e8f0"),
                              background:activo?(c.bg||"#eef6d5"):"transparent",
                              color:activo?(c.text||"#3d6b10"):"#94a3b8"}}>{r}</button>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {confirmarEliminar && (
            <div style={{marginBottom:14,padding:"16px",borderRadius:14,border:"2px solid #fca5a5",background:"#fef2f2"}}>
              <div style={{fontSize:14,fontWeight:800,color:"#991b1b",marginBottom:6}}>¿Eliminar esta métrica?</div>
              <div style={{fontSize:13,color:"#b91c1c",marginBottom:14}}>
                Se eliminará <b>{(metricas.find(function(m){return m.code===confirmarEliminar;})||{}).nombre}</b>. Esta acción no se puede deshacer.
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={function(){eliminarMetrica(confirmarEliminar);}}
                  style={{flex:1,padding:"10px 0",borderRadius:10,border:"none",background:"#ef4444",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                  Sí, eliminar
                </button>
                <button onClick={function(){setConfirmarEliminar(null);}}
                  style={{flex:1,padding:"10px 0",borderRadius:10,border:"1.5px solid #e2e8f0",background:"#fff",color:"#475569",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                  Cancelar
                </button>
              </div>
            </div>
          )}

          <div style={{padding:"14px 16px",borderRadius:12,border:"2px dashed #e2e8f0",background:"#f8fafc",marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:10}}>+ NUEVA MÉTRICA</div>
            <div style={{display:"grid",gridTemplateColumns:"90px 1fr",gap:8}}>
              <input placeholder="Código" value={nuevaMet.code}
                onChange={function(e){setNuevaMet(function(x){return Object.assign({},x,{code:e.target.value});});}}
                style={inp2}/>
              <input placeholder="Nombre" value={nuevaMet.nombre}
                onChange={function(e){setNuevaMet(function(x){return Object.assign({},x,{nombre:e.target.value});});}}
                onKeyDown={function(e){if(e.key==="Enter")agregarMetrica();}}
                style={inp2}/>
            </div>
            <button onClick={agregarMetrica}
              style={{marginTop:10,padding:"8px 18px",borderRadius:9,border:"none",background:"#8DC63F",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>
              Agregar
            </button>
          </div>

          <button onClick={function(){onSave();}}
            style={{width:"100%",padding:12,borderRadius:11,border:"none",fontWeight:700,fontSize:14,cursor:"pointer",
              background:guardado?"#10b981":"linear-gradient(135deg,#8DC63F,#5a8a1f)",color:"#fff"}}>
            {guardado?"Guardado":"Guardar cambios"}
          </button>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    // ADMIN TAB: HORARIOS (nuevo sistema por día/rol + overrides)
    // ═══════════════════════════════════════════════════
    function HorariosTab(props) {
      var config = props.config;
      var onConfigChange = props.onConfigChange;
      var flash = props.flash || function(){};
      var saved = props.saved;
      var ASESORAS = props.asesoras || config.asesoras || ASESORAS_DEFAULT;

      var rolesDisponibles = getRoleKeys(config);
      // Agregar roles fijos al listado si no están
      var rolesFijosExtra = ROLES_FIJOS_EXTRA;
      rolesFijosExtra.forEach(function(rf){
        if(rolesDisponibles.indexOf(rf)<0) rolesDisponibles = rolesDisponibles.concat([rf]);
      });

      var [pantalla, setPantalla] = useState("base"); // base | overrides | calendario
      var [horariosBase, setHorariosBase] = useState(function(){
        return config.horariosBase || {};
      });
      var [overrides, setOverrides] = useState(function(){
        return config.horariosOverrides || {};
      });

      // Estado del formulario de override
      var [ovrFecha, setOvrFecha] = useState(today());
      var [ovrTipo, setOvrTipo] = useState("rol"); // rol | asesora
      var [ovrTarget, setOvrTarget] = useState(""); // nombre del rol o asesor
      var [ovrEntrada, setOvrEntrada] = useState("08:00");
      var [ovrSalida, setOvrSalida] = useState("17:00");
      var [ovrDescanso, setOvrDescanso] = useState(false);
      var [ovrFiltroFecha, setOvrFiltroFecha] = useState("");

      // Estado del CALENDARIO de programación semanal/rango
      // Visualiza el mes y permite seleccionar un rango de fechas (clic en inicio, clic en fin)
      var hoyDate = new Date(today() + "T12:00:00");
      var [calMes, setCalMes] = useState(hoyDate.getMonth()); // 0-11
      var [calAnio, setCalAnio] = useState(hoyDate.getFullYear());
      var [rangoInicio, setRangoInicio] = useState(null); // fecha ISO "YYYY-MM-DD"
      var [rangoFin, setRangoFin] = useState(null);
      var [rangoTipo, setRangoTipo] = useState("rol"); // rol | asesora
      var [rangoTarget, setRangoTarget] = useState("");
      var [rangoEntrada, setRangoEntrada] = useState("09:00");
      var [rangoSalida, setRangoSalida] = useState("13:00");
      var [rangoDescanso, setRangoDescanso] = useState(false);
      var [rangoIncluirDomingo, setRangoIncluirDomingo] = useState(false);

      var inp = {padding:"8px 10px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,color:"#1e293b",background:"#f8fafc",outline:"none",fontFamily:"inherit",width:"100%",boxSizing:"border-box"};

      // Helpers para base
      function setHorarioDiaRol(diaKey, rol, campo, valor) {
        setHorariosBase(function(prev){
          var n = Object.assign({}, prev);
          if (!n[diaKey]) n[diaKey] = {};
          else n[diaKey] = Object.assign({}, n[diaKey]);
          var actual = n[diaKey][rol] || {entrada:"08:00", salida:"17:00", descanso:false};
          n[diaKey][rol] = Object.assign({}, actual);
          n[diaKey][rol][campo] = valor;
          return n;
        });
      }
      function eliminarHorarioDiaRol(diaKey, rol) {
        setHorariosBase(function(prev){
          var n = Object.assign({}, prev);
          if (n[diaKey]) {
            n[diaKey] = Object.assign({}, n[diaKey]);
            delete n[diaKey][rol];
            if (Object.keys(n[diaKey]).length === 0) delete n[diaKey];
          }
          return n;
        });
      }
      function copiarLunesATodos() {
        var lunes = horariosBase["lunes"] || {};
        if (Object.keys(lunes).length === 0) {
          alert("Primero configura los horarios del lunes para poder copiarlos.");
          return;
        }
        var nuevo = Object.assign({}, horariosBase);
        DIAS_SEMANA_KEYS.forEach(function(d){
          if (d === "lunes") return;
          if (d === "sabado" || d === "domingo") return; // no sobrescribir fin de semana
          nuevo[d] = JSON.parse(JSON.stringify(lunes));
        });
        setHorariosBase(nuevo);
      }
      function guardarBase() {
        onConfigChange(Object.assign({}, config, {horariosBase: horariosBase}));
        flash();
      }

      // Helpers para overrides
      function agregarOverride() {
        if (!ovrFecha || !ovrTarget) { alert("Selecciona fecha y rol/asesora."); return; }
        if (!ovrDescanso && (!ovrEntrada || !ovrSalida)) { alert("Especifica entrada y salida o marca como descanso."); return; }
        var keyTarget = ovrTipo === "rol"
          ? "__rol_" + ovrTarget.replace(/[.#$\[\]\s]/g,"_")
          : "__asesora_" + ovrTarget.replace(/[.#$\[\]\s]/g,"_");
        var nuevo = Object.assign({}, overrides);
        nuevo[ovrFecha] = Object.assign({}, nuevo[ovrFecha] || {});
        nuevo[ovrFecha][keyTarget] = ovrDescanso
          ? {descanso:true}
          : {entrada: ovrEntrada, salida: ovrSalida};
        // Guardar también un label legible para listarlos
        nuevo[ovrFecha][keyTarget]._tipo = ovrTipo;
        nuevo[ovrFecha][keyTarget]._target = ovrTarget;
        setOverrides(nuevo);
        onConfigChange(Object.assign({}, config, {horariosOverrides: nuevo}));
        flash();
        // Limpiar formulario
        setOvrTarget("");
        setOvrDescanso(false);
      }
      function eliminarOverride(fecha, keyTarget) {
        var nuevo = Object.assign({}, overrides);
        if (nuevo[fecha]) {
          nuevo[fecha] = Object.assign({}, nuevo[fecha]);
          delete nuevo[fecha][keyTarget];
          if (Object.keys(nuevo[fecha]).length === 0) delete nuevo[fecha];
        }
        setOverrides(nuevo);
        onConfigChange(Object.assign({}, config, {horariosOverrides: nuevo}));
        flash();
      }

      // Crea overrides para un rango de fechas (todos los días entre rangoInicio y rangoFin)
      // Por defecto omite domingos (a menos que rangoIncluirDomingo sea true)
      function agregarRango() {
        if (!rangoInicio || !rangoFin) { alert("Selecciona fecha de inicio y fecha de fin en el calendario."); return; }
        if (!rangoTarget) { alert("Selecciona un rol o asesora."); return; }
        if (!rangoDescanso && (!rangoEntrada || !rangoSalida)) { alert("Especifica entrada y salida o marca como descanso."); return; }
        var keyTarget = rangoTipo === "rol"
          ? "__rol_" + rangoTarget.replace(/[.#$\[\]\s]/g,"_")
          : "__asesora_" + rangoTarget.replace(/[.#$\[\]\s]/g,"_");
        var nuevo = Object.assign({}, overrides);
        // Recorrer todos los días del rango
        var d1 = new Date(rangoInicio + "T12:00:00");
        var d2 = new Date(rangoFin + "T12:00:00");
        var cursor = new Date(d1);
        var cuenta = 0;
        while (cursor <= d2) {
          var jsDay = cursor.getDay(); // 0=Domingo
          if (jsDay !== 0 || rangoIncluirDomingo) {
            var fechaISO = cursor.getFullYear() + "-" +
              String(cursor.getMonth()+1).padStart(2,"0") + "-" +
              String(cursor.getDate()).padStart(2,"0");
            nuevo[fechaISO] = Object.assign({}, nuevo[fechaISO] || {});
            nuevo[fechaISO][keyTarget] = rangoDescanso
              ? {descanso:true, _tipo:rangoTipo, _target:rangoTarget}
              : {entrada: rangoEntrada, salida: rangoSalida, _tipo:rangoTipo, _target:rangoTarget};
            cuenta++;
          }
          cursor.setDate(cursor.getDate() + 1);
        }
        setOverrides(nuevo);
        onConfigChange(Object.assign({}, config, {horariosOverrides: nuevo}));
        flash();
        alert("✓ Se programaron " + cuenta + " día(s) de horario especial.");
        // Limpiar selección
        setRangoInicio(null);
        setRangoFin(null);
        setRangoTarget("");
        setRangoDescanso(false);
      }

      // Maneja el clic en un día del calendario
      function clickDiaCalendario(fechaISO) {
        if (!rangoInicio || (rangoInicio && rangoFin)) {
          // Empezar nueva selección
          setRangoInicio(fechaISO);
          setRangoFin(null);
        } else {
          // Ya hay inicio, ahora elegir fin
          if (fechaISO < rangoInicio) {
            // Si se hace clic antes del inicio, intercambiar
            setRangoFin(rangoInicio);
            setRangoInicio(fechaISO);
          } else {
            setRangoFin(fechaISO);
          }
        }
      }

      function navegarMes(delta) {
        var m = calMes + delta;
        var a = calAnio;
        if (m < 0) { m = 11; a--; }
        if (m > 11) { m = 0; a++; }
        setCalMes(m);
        setCalAnio(a);
      }

      // Lista plana de overrides para mostrar (filtrando los pasados opcionalmente)
      var hoyStr = today();
      var listaOverrides = [];
      Object.keys(overrides).forEach(function(fecha){
        Object.keys(overrides[fecha]).forEach(function(k){
          var item = overrides[fecha][k];
          listaOverrides.push({fecha:fecha, key:k, tipo:item._tipo||"rol", target:item._target||k, entrada:item.entrada, salida:item.salida, descanso:item.descanso});
        });
      });
      // Filtrar pasados (mantenerlos pero ocultar visualmente)
      var overridesVisibles = listaOverrides.filter(function(o){ return o.fecha >= hoyStr; });
      overridesVisibles.sort(function(a,b){return a.fecha.localeCompare(b.fecha);});
      var overridesPasados = listaOverrides.length - overridesVisibles.length;

      var btnTab = function(id, lbl){
        return (
          <button onClick={function(){setPantalla(id);}}
            style={{flex:1,padding:"8px 10px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,
              background:pantalla===id?"#8DC63F":"transparent",
              color:pantalla===id?"#fff":"#64748b",fontFamily:"inherit"}}>{lbl}</button>
        );
      };

      return (
        <div>
          <p style={{fontSize:13,color:"#64748b",marginTop:0,marginBottom:14}}>
            Configura horarios por día de semana y rol. Para casos puntuales (citas, permisos, días especiales) usa <b>Overrides</b>. Hay <b>{GRACIA_MINUTOS} minutos</b> de gracia para marcar puntual.
          </p>

          <div style={{display:"flex",gap:6,padding:4,background:"#f1f5f9",borderRadius:11,marginBottom:18,flexWrap:"wrap"}}>
            {btnTab("base","📅 Horario base")}
            {btnTab("overrides","⚡ Overrides puntuales"+(overridesVisibles.length>0?" ("+overridesVisibles.length+")":""))}
            {btnTab("calendario","🗓 Programar por rango")}
          </div>

          {pantalla === "base" && (
            <div>
              <div style={{padding:"10px 12px",background:"#eef6d5",border:"1px solid #d4edaa",borderRadius:10,marginBottom:14,fontSize:12,color:"#3d6b10",lineHeight:1.5}}>
                💡 Define para cada día y rol la hora de entrada y salida. Si un rol no tiene horario para un día específico, ese día no se evaluará la puntualidad para ese rol. Marca <b>"Descanso"</b> para días no laborables.
              </div>

              <div style={{marginBottom:14,display:"flex",gap:8,flexWrap:"wrap"}}>
                <button onClick={copiarLunesATodos}
                  style={{padding:"7px 14px",borderRadius:9,border:"1.5px solid #c7d2fe",background:"#eef2ff",color:"#4338ca",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                  📋 Copiar Lunes a Mar-Vie
                </button>
                <button onClick={function(){setHorariosBase({});}}
                  style={{padding:"7px 14px",borderRadius:9,border:"1.5px solid #fecaca",background:"#fef2f2",color:"#dc2626",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                  🗑 Limpiar todo
                </button>
              </div>

              {/* Una sección por día */}
              {DIAS_SEMANA_KEYS.map(function(diaKey, idxDia){
                var label = DIAS_SEMANA_LABELS[idxDia];
                var horariosDelDia = horariosBase[diaKey] || {};
                var rolesConfigurados = Object.keys(horariosDelDia);
                var rolesSinConfig = rolesDisponibles.filter(function(r){return rolesConfigurados.indexOf(r)<0;});
                return (
                  <div key={diaKey} style={{marginBottom:14,borderRadius:12,border:"1.5px solid #e2e8f0",background:"#fff",overflow:"hidden"}}>
                    <div style={{padding:"10px 14px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"center",gap:10}}>
                      <span style={{fontSize:14,fontWeight:800,color:"#1e293b"}}>{label}</span>
                      <span style={{fontSize:10,color:"#94a3b8"}}>{rolesConfigurados.length} rol(es) configurado(s)</span>
                    </div>
                    <div style={{padding:"10px 12px"}}>
                      {rolesConfigurados.length === 0 && (
                        <div style={{padding:"10px 12px",textAlign:"center",color:"#94a3b8",fontSize:12,background:"#f8fafc",borderRadius:8,marginBottom:8}}>
                          Sin horarios definidos para este día
                        </div>
                      )}
                      {rolesConfigurados.map(function(rol){
                        var h = horariosDelDia[rol];
                        var rc = getColorRol(rol, config);
                        return (
                          <div key={rol} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderBottom:"1px dashed #f1f5f9"}}>
                            <span style={{minWidth:110,padding:"3px 9px",borderRadius:20,background:rc.bg,color:rc.text,fontWeight:700,fontSize:11,textAlign:"center"}}>{rol}</span>
                            {h.descanso ? (
                              <div style={{flex:1,display:"flex",alignItems:"center",gap:8}}>
                                <span style={{flex:1,fontSize:12,color:"#92400e",fontWeight:700,background:"#fef3c7",padding:"5px 10px",borderRadius:7,border:"1px solid #fde68a"}}>🌴 Día de descanso</span>
                                <button onClick={function(){setHorarioDiaRol(diaKey,rol,"descanso",false);}}
                                  style={{padding:"3px 9px",borderRadius:6,border:"1px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:700,fontSize:10,cursor:"pointer"}}>
                                  Convertir a horario
                                </button>
                              </div>
                            ) : (
                              <>
                                <input type="time" value={h.entrada||"08:00"}
                                  onChange={function(e){setHorarioDiaRol(diaKey,rol,"entrada",e.target.value);}}
                                  style={Object.assign({},inp,{width:110,padding:"5px 7px",fontSize:12})}/>
                                <span style={{fontSize:11,color:"#94a3b8"}}>—</span>
                                <input type="time" value={h.salida||"17:00"}
                                  onChange={function(e){setHorarioDiaRol(diaKey,rol,"salida",e.target.value);}}
                                  style={Object.assign({},inp,{width:110,padding:"5px 7px",fontSize:12})}/>
                                <button onClick={function(){setHorarioDiaRol(diaKey,rol,"descanso",true);}}
                                  title="Marcar como día de descanso"
                                  style={{padding:"3px 8px",borderRadius:6,border:"1px solid #fde68a",background:"#fffbeb",color:"#92400e",fontWeight:700,fontSize:10,cursor:"pointer"}}>🌴</button>
                              </>
                            )}
                            <button onClick={function(){eliminarHorarioDiaRol(diaKey,rol);}}
                              style={{padding:"3px 7px",borderRadius:6,border:"none",background:"#fef2f2",color:"#ef4444",fontWeight:700,fontSize:10,cursor:"pointer"}}>✕</button>
                          </div>
                        );
                      })}
                      {rolesSinConfig.length > 0 && (
                        <div style={{marginTop:rolesConfigurados.length>0?10:0,padding:"8px 10px",background:"#f8fafc",borderRadius:8,border:"1px dashed #e2e8f0"}}>
                          <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.05em"}}>+ Agregar rol a {label}</div>
                          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                            {rolesSinConfig.map(function(r){
                              var rc = getColorRol(r, config);
                              return (
                                <button key={r} onClick={function(){setHorarioDiaRol(diaKey,r,"entrada","08:00");setHorarioDiaRol(diaKey,r,"salida","17:00");}}
                                  style={{padding:"3px 9px",borderRadius:20,fontWeight:700,fontSize:10,cursor:"pointer",border:"1px dashed "+rc.text,background:"transparent",color:rc.text}}>+ {r}</button>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}

              <button onClick={guardarBase}
                style={{width:"100%",padding:12,borderRadius:11,border:"none",background:saved?"#10b981":"linear-gradient(135deg,#8DC63F,#5a8a1f)",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}}>
                {saved?"✓ Guardado":"Guardar horario base"}
              </button>
            </div>
          )}

          {pantalla === "overrides" && (
            <div>
              <div style={{padding:"10px 12px",background:"#eef2ff",border:"1px solid #c7d2fe",borderRadius:10,marginBottom:14,fontSize:12,color:"#4338ca",lineHeight:1.5}}>
                ⚡ Crea excepciones puntuales para un día específico (citas, permisos, capacitaciones). Tienen <b>prioridad</b> sobre el horario base. Los overrides pueden aplicarse a un rol completo o a un asesor individual.
              </div>

              {/* Formulario nuevo override */}
              <div style={{padding:"14px 16px",borderRadius:12,border:"2px dashed #c7d2fe",background:"#fafbff",marginBottom:18}}>
                <div style={{fontSize:11,fontWeight:800,color:"#4338ca",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>+ Nuevo override</div>

                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                  <div>
                    <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:4}}>FECHA</div>
                    <input type="date" value={ovrFecha} onChange={function(e){setOvrFecha(e.target.value);}} style={inp}/>
                  </div>
                  <div>
                    <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:4}}>APLICAR A</div>
                    <div style={{display:"flex",gap:4}}>
                      {[["rol","Rol"],["asesora","Asesor"]].map(function(opt){
                        return (
                          <button key={opt[0]} onClick={function(){setOvrTipo(opt[0]);setOvrTarget("");}}
                            style={{flex:1,padding:"7px 0",borderRadius:8,border:"1.5px solid "+(ovrTipo===opt[0]?"#8DC63F":"#e2e8f0"),
                              background:ovrTipo===opt[0]?"#eef6d5":"#fff",
                              color:ovrTipo===opt[0]?"#3d6b10":"#64748b",
                              fontWeight:700,fontSize:11,cursor:"pointer"}}>
                            {opt[1]}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <div style={{marginBottom:10}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:4}}>
                    {ovrTipo==="rol"?"SELECCIONA ROL":"SELECCIONA ASESORA"}
                  </div>
                  <select value={ovrTarget} onChange={function(e){setOvrTarget(e.target.value);}} style={Object.assign({},inp,{cursor:"pointer"})}>
                    <option value="">— Seleccionar —</option>
                    {ovrTipo==="rol"
                      ? rolesDisponibles.map(function(r){return <option key={r} value={r}>{r}</option>;})
                      : ASESORAS.map(function(a){return <option key={a} value={a}>{a}</option>;})
                    }
                  </select>
                </div>

                <div style={{marginBottom:10}}>
                  <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:12,color:"#64748b",fontWeight:600}}>
                    <input type="checkbox" checked={ovrDescanso} onChange={function(e){setOvrDescanso(e.target.checked);}}/>
                    🌴 Marcar este día como descanso
                  </label>
                </div>

                {!ovrDescanso && (
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                    <div>
                      <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:4}}>ENTRADA</div>
                      <input type="time" value={ovrEntrada} onChange={function(e){setOvrEntrada(e.target.value);}} style={inp}/>
                    </div>
                    <div>
                      <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:4}}>SALIDA</div>
                      <input type="time" value={ovrSalida} onChange={function(e){setOvrSalida(e.target.value);}} style={inp}/>
                    </div>
                  </div>
                )}

                <button onClick={agregarOverride}
                  disabled={!ovrTarget}
                  style={{width:"100%",padding:"9px 0",borderRadius:9,border:"none",
                    background:ovrTarget?"linear-gradient(135deg,#6366f1,#4338ca)":"#e2e8f0",
                    color:ovrTarget?"#fff":"#94a3b8",fontWeight:700,fontSize:13,cursor:ovrTarget?"pointer":"default"}}>
                  + Crear override
                </button>
              </div>

              {/* Lista overrides activos */}
              <div style={{fontSize:11,fontWeight:800,color:"#475569",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.05em"}}>
                Overrides activos ({overridesVisibles.length})
              </div>
              {overridesVisibles.length === 0 ? (
                <div style={{padding:"20px 16px",textAlign:"center",color:"#94a3b8",fontSize:13,background:"#f8fafc",borderRadius:10,border:"1px dashed #e2e8f0"}}>
                  No hay overrides programados para hoy o el futuro
                </div>
              ) : (
                <div style={{display:"flex",flexDirection:"column",gap:7}}>
                  {overridesVisibles.map(function(o,i){
                    var esAsesora = o.tipo === "asesora";
                    return (
                      <div key={i} style={{padding:"10px 12px",borderRadius:11,border:"1.5px solid "+(esAsesora?"#fde68a":"#c7d2fe"),background:esAsesora?"#fffbeb":"#eef2ff",display:"flex",alignItems:"center",gap:10}}>
                        <div style={{width:34,height:34,borderRadius:9,background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>
                          {o.descanso?"🌴":esAsesora?"👤":"🎯"}
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:800,color:"#1e293b"}}>
                            {formatEs(o.fecha)}
                          </div>
                          <div style={{fontSize:11,color:"#64748b",marginTop:1}}>
                            <span style={{fontWeight:700,color:esAsesora?"#92400e":"#4338ca"}}>{o.target}</span>
                            {" · "}
                            {o.descanso ? "Día de descanso" : o.entrada+" – "+o.salida}
                          </div>
                        </div>
                        <button onClick={function(){eliminarOverride(o.fecha, o.key);}}
                          style={{padding:"4px 9px",borderRadius:7,border:"none",background:"#fef2f2",color:"#ef4444",fontWeight:700,fontSize:11,cursor:"pointer",flexShrink:0}}>✕</button>
                      </div>
                    );
                  })}
                </div>
              )}
              {overridesPasados > 0 && (
                <div style={{marginTop:12,padding:"7px 12px",background:"#f8fafc",border:"1px dashed #cbd5e1",borderRadius:9,fontSize:11,color:"#64748b",textAlign:"center"}}>
                  🕘 {overridesPasados} override(s) anterior(es) ocultos automáticamente (siguen guardados en el historial)
                </div>
              )}
            </div>
          )}

          {pantalla === "calendario" && (
            <div>
              <div style={{padding:"10px 12px",background:"#fef3c7",border:"1px solid #fde68a",borderRadius:10,marginBottom:14,fontSize:12,color:"#92400e",lineHeight:1.5}}>
                🗓 Selecciona un <b>rango de fechas</b> en el calendario (clic en el día de inicio, después clic en el día final) y define el horario. Útil para semanas con horarios no convencionales (ej: del 1 al 5, María entra 9:00 – 13:00).
              </div>

              {/* Selector de rol/asesora y horario primero */}
              <div style={{padding:"14px 16px",borderRadius:12,border:"2px dashed #fde68a",background:"#fffbeb",marginBottom:16}}>
                <div style={{fontSize:11,fontWeight:800,color:"#92400e",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>1️⃣ Configuración del rango</div>

                <div style={{marginBottom:10}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:4}}>APLICAR A</div>
                  <div style={{display:"flex",gap:4,marginBottom:8}}>
                    {[["rol","Rol"],["asesora","Asesor"]].map(function(opt){
                      return (
                        <button key={opt[0]} onClick={function(){setRangoTipo(opt[0]);setRangoTarget("");}}
                          style={{flex:1,padding:"7px 0",borderRadius:8,border:"1.5px solid "+(rangoTipo===opt[0]?"#f59e0b":"#e2e8f0"),
                            background:rangoTipo===opt[0]?"#fef3c7":"#fff",
                            color:rangoTipo===opt[0]?"#92400e":"#64748b",
                            fontWeight:700,fontSize:11,cursor:"pointer"}}>
                          {opt[1]}
                        </button>
                      );
                    })}
                  </div>
                  <select value={rangoTarget} onChange={function(e){setRangoTarget(e.target.value);}} style={Object.assign({},inp,{cursor:"pointer"})}>
                    <option value="">— Seleccionar {rangoTipo==="rol"?"rol":"asesora"} —</option>
                    {rangoTipo==="rol"
                      ? rolesDisponibles.map(function(r){return <option key={r} value={r}>{r}</option>;})
                      : ASESORAS.map(function(a){return <option key={a} value={a}>{a}</option>;})
                    }
                  </select>
                </div>

                <div style={{marginBottom:10}}>
                  <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:12,color:"#64748b",fontWeight:600}}>
                    <input type="checkbox" checked={rangoDescanso} onChange={function(e){setRangoDescanso(e.target.checked);}}/>
                    🌴 Marcar todos los días del rango como descanso
                  </label>
                </div>

                {!rangoDescanso && (
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                    <div>
                      <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:4}}>ENTRADA</div>
                      <input type="time" value={rangoEntrada} onChange={function(e){setRangoEntrada(e.target.value);}} style={inp}/>
                    </div>
                    <div>
                      <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:4}}>SALIDA</div>
                      <input type="time" value={rangoSalida} onChange={function(e){setRangoSalida(e.target.value);}} style={inp}/>
                    </div>
                  </div>
                )}

                <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:11,color:"#64748b",fontWeight:600}}>
                  <input type="checkbox" checked={rangoIncluirDomingo} onChange={function(e){setRangoIncluirDomingo(e.target.checked);}}/>
                  Incluir domingos en el rango (por defecto se omiten)
                </label>
              </div>

              {/* Calendario mensual */}
              <div style={{padding:"14px 16px",borderRadius:12,border:"1.5px solid #e2e8f0",background:"#fff",marginBottom:16}}>
                <div style={{fontSize:11,fontWeight:800,color:"#475569",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>2️⃣ Selecciona el rango en el calendario</div>

                {/* Header del calendario */}
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                  <button onClick={function(){navegarMes(-1);}}
                    style={{padding:"6px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"#f8fafc",color:"#475569",fontWeight:700,fontSize:13,cursor:"pointer"}}>← Mes anterior</button>
                  <div style={{flex:1,textAlign:"center",fontSize:15,fontWeight:800,color:"#1e293b"}}>
                    {MESES_FULL[calMes]} {calAnio}
                  </div>
                  <button onClick={function(){navegarMes(1);}}
                    style={{padding:"6px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"#f8fafc",color:"#475569",fontWeight:700,fontSize:13,cursor:"pointer"}}>Mes siguiente →</button>
                </div>

                {/* Días de la semana */}
                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
                  {["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(function(d,i){
                    return <div key={i} style={{textAlign:"center",fontSize:10,fontWeight:800,color:"#94a3b8",padding:"4px 0",textTransform:"uppercase",letterSpacing:"0.05em"}}>{d}</div>;
                  })}
                </div>

                {/* Grid de días */}
                {(function(){
                  var primerDia = new Date(calAnio, calMes, 1);
                  var jsDayPrimero = primerDia.getDay(); // 0=Dom
                  var offset = jsDayPrimero === 0 ? 6 : jsDayPrimero - 1; // empezar lunes
                  var ultDia = new Date(calAnio, calMes+1, 0).getDate();
                  var hoyISO = today();
                  var celdas = [];
                  // Celdas vacías al inicio
                  for (var i = 0; i < offset; i++) {
                    celdas.push(<div key={"e"+i} style={{padding:"10px 0"}}></div>);
                  }
                  for (var d = 1; d <= ultDia; d++) {
                    var dStr = calAnio + "-" + String(calMes+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
                    var esHoy = dStr === hoyISO;
                    var esPasado = dStr < hoyISO;
                    var esInicio = dStr === rangoInicio;
                    var esFin = dStr === rangoFin;
                    var enRango = rangoInicio && rangoFin && dStr >= rangoInicio && dStr <= rangoFin;
                    var enRangoTentativo = rangoInicio && !rangoFin && dStr === rangoInicio;
                    var fechaDate = new Date(dStr + "T12:00:00");
                    var esDomingo = fechaDate.getDay() === 0;
                    var seraOmitido = enRango && esDomingo && !rangoIncluirDomingo;

                    // Detectar si ese día ya tiene un override programado
                    var tieneOvr = !!overrides[dStr];

                    var bg = "#fff", color = "#1e293b", border = "1px solid #e2e8f0";
                    if (esPasado) { color = "#cbd5e1"; bg = "#fafafa"; }
                    if (tieneOvr && !esInicio && !esFin && !enRango) { bg = "#fef3c7"; border = "1px solid #fde68a"; }
                    if (esHoy) { border = "2px solid #8DC63F"; }
                    if (enRango) { bg = seraOmitido ? "#f8fafc" : "#dbeafe"; color = seraOmitido ? "#94a3b8" : "#1e3a8a"; border = "1px solid "+(seraOmitido?"#e2e8f0":"#93c5fd"); }
                    if (esInicio) { bg = "#3b82f6"; color = "#fff"; border = "1px solid #2563eb"; }
                    if (esFin) { bg = "#3b82f6"; color = "#fff"; border = "1px solid #2563eb"; }
                    if (enRangoTentativo) { bg = "#3b82f6"; color = "#fff"; border = "1px solid #2563eb"; }

                    celdas.push(
                      <button key={dStr}
                        onClick={function(f){return function(){clickDiaCalendario(f);};}(dStr)}
                        disabled={esPasado}
                        title={tieneOvr ? "Este día ya tiene horario programado" : ""}
                        style={{padding:"10px 0",borderRadius:8,border:border,background:bg,color:color,
                          fontWeight:esInicio||esFin||esHoy?800:600,fontSize:13,cursor:esPasado?"not-allowed":"pointer",
                          opacity:esPasado?0.5:1,
                          position:"relative",fontFamily:"inherit"}}>
                        {d}
                        {tieneOvr && !esInicio && !esFin && !enRango && (
                          <span style={{position:"absolute",bottom:2,left:"50%",transform:"translateX(-50%)",width:4,height:4,borderRadius:"50%",background:"#f59e0b"}}></span>
                        )}
                        {seraOmitido && (
                          <span style={{position:"absolute",top:1,right:3,fontSize:9}}>✕</span>
                        )}
                      </button>
                    );
                  }
                  return <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>{celdas}</div>;
                })()}

                {/* Resumen de selección */}
                <div style={{marginTop:14,padding:"10px 12px",borderRadius:9,background:rangoInicio?"#dbeafe":"#f8fafc",border:"1px solid "+(rangoInicio?"#93c5fd":"#e2e8f0")}}>
                  {!rangoInicio ? (
                    <div style={{fontSize:12,color:"#64748b",textAlign:"center"}}>👆 Haz clic en el día de inicio del rango</div>
                  ) : !rangoFin ? (
                    <div style={{fontSize:12,color:"#1e3a8a",fontWeight:700,textAlign:"center"}}>
                      Inicio: <b>{formatEs(rangoInicio)}</b> · Ahora elige el día final
                    </div>
                  ) : (
                    <div style={{fontSize:12,color:"#1e3a8a"}}>
                      <div style={{fontWeight:800,marginBottom:3}}>📅 Rango seleccionado:</div>
                      <div>Del <b>{formatEs(rangoInicio)}</b> al <b>{formatEs(rangoFin)}</b></div>
                      {(function(){
                        var d1 = new Date(rangoInicio + "T12:00:00");
                        var d2 = new Date(rangoFin + "T12:00:00");
                        var dias = 0, domingos = 0;
                        var c = new Date(d1);
                        while (c <= d2) {
                          if (c.getDay() === 0) { domingos++; } else { dias++; }
                          c.setDate(c.getDate() + 1);
                        }
                        var totalDias = dias + (rangoIncluirDomingo ? domingos : 0);
                        return (
                          <div style={{fontSize:11,marginTop:3,opacity:0.85}}>
                            {totalDias} día(s) en total {!rangoIncluirDomingo && domingos>0 && "("+domingos+" domingo(s) omitidos)"}
                          </div>
                        );
                      })()}
                    </div>
                  )}
                  {(rangoInicio || rangoFin) && (
                    <button onClick={function(){setRangoInicio(null);setRangoFin(null);}}
                      style={{marginTop:8,padding:"4px 10px",borderRadius:7,border:"1px solid #cbd5e1",background:"#fff",color:"#64748b",fontWeight:700,fontSize:11,cursor:"pointer"}}>
                      ✕ Limpiar selección
                    </button>
                  )}
                </div>
              </div>

              {/* Botón final */}
              <button onClick={agregarRango}
                disabled={!rangoInicio || !rangoFin || !rangoTarget}
                style={{width:"100%",padding:"12px 0",borderRadius:11,border:"none",
                  background:(rangoInicio && rangoFin && rangoTarget)?"linear-gradient(135deg,#f59e0b,#d97706)":"#e2e8f0",
                  color:(rangoInicio && rangoFin && rangoTarget)?"#fff":"#94a3b8",
                  fontWeight:800,fontSize:14,cursor:(rangoInicio && rangoFin && rangoTarget)?"pointer":"default",
                  boxShadow:(rangoInicio && rangoFin && rangoTarget)?"0 4px 12px rgba(245,158,11,0.3)":"none"}}>
                ✨ Programar horario para el rango
              </button>

              <div style={{marginTop:14,padding:"10px 12px",background:"#f8fafc",borderRadius:9,border:"1px solid #e2e8f0",fontSize:11,color:"#64748b",lineHeight:1.5}}>
                💡 <b>Cómo funciona:</b> Esta función crea overrides individuales para cada día del rango. Si quieres modificar un día específico después, ve a <b>"⚡ Overrides puntuales"</b>. Los días con horarios ya programados se marcan con un punto amarillo en el calendario.
              </div>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    // INFORMES / DATOS (export CSV, rendimiento, tendencia, rachas, respaldo)
    // ═══════════════════════════════════════════════════
    function ControlArqueosTab(props) {
      var entries = props.entries || {};
      var config = props.config || {};
      var base = Number(config.baseCaja) || 501500;
      var [desde, setDesde] = useState("");
      function fmt(n){ return (n===null||n===undefined||n==="")?"—":"$"+Number(n).toLocaleString("es-CO"); }
      function setBase(v){ if(props.onConfigChange) props.onConfigChange(Object.assign({},config,{baseCaja:Number(v)||0})); }
      var porFecha = {};
      Object.keys(entries).forEach(function(k){
        var p=k.split("__"); var persona=p[0], fecha=p[1]; if(!fecha) return;
        var met=(entries[k] && entries[k].metricas) || {};
        var rec=met["arqueo_A006"], ent=met["arqueo_A013"], rc=met["arqueo_A033"];
        if(!porFecha[fecha]) porFecha[fecha]={};
        if(rec!=null && rec!==""){ porFecha[fecha].recibido=Number(rec); porFecha[fecha].qRec=persona; }
        if(ent!=null && ent!==""){ porFecha[fecha].entregado=Number(ent); porFecha[fecha].qEnt=persona; }
        if(rc!=null && rc!==""){ porFecha[fecha].recaudo=Number(rc); }
      });
      var fechas=Object.keys(porFecha).sort();
      var filas=[];
      for(var i=0;i<fechas.length;i++){
        var d=fechas[i]; var pf=porFecha[d];
        if(pf.recibido===undefined && pf.recaudo===undefined && pf.entregado===undefined) continue;
        var prevEnt=null;
        for(var j=i-1;j>=0;j--){ if(porFecha[fechas[j]].entregado!==undefined){ prevEnt=porFecha[fechas[j]].entregado; break; } }
        var contDif = (pf.recibido!==undefined && prevEnt!==null) ? (pf.recibido - prevEnt) : null;
        var quedo = (pf.recibido!==undefined && pf.recaudo!==undefined) ? (pf.recibido - pf.recaudo) : null;
        var difQuedo = (quedo!==null) ? (quedo - base) : null;
        filas.push({fecha:d, recibido:pf.recibido, qRec:pf.qRec, prevEnt:prevEnt, contDif:contDif, recaudo:pf.recaudo, quedo:quedo, difQuedo:difQuedo});
      }
      if(desde){ filas = filas.filter(function(f){ return f.fecha >= desde; }); }
      filas.reverse();
      var descuadres = filas.filter(function(f){ return (f.contDif!==null&&f.contDif!==0) || (f.difQuedo!==null&&f.difQuedo!==0); }).length;
      var inp={padding:"7px 10px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:14,fontWeight:700,color:"#1e293b",fontFamily:"inherit"};
      function Linea(pp){
        return (
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",padding:"5px 0"}}>
            <span style={{fontSize:13,color:pp.fuerte?"#1e293b":"#64748b",fontWeight:pp.fuerte?800:600}}>{pp.label}</span>
            <span style={{fontSize:pp.fuerte?17:15,fontWeight:pp.fuerte?900:700,color:pp.color||"#1e293b"}}>{pp.valor}</span>
          </div>
        );
      }
      return (
        <div>
          <p style={{fontSize:13,color:"#64748b",marginTop:0,marginBottom:12,lineHeight:1.5}}>Cada día: lo que se <b>recibió</b> al abrir, menos lo que se <b>envió</b> a contabilidad, es lo que <b>quedó</b> en caja — que debe ser igual a la <b>base</b>.</p>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:14,background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:12,padding:"12px 14px"}}>
            <span style={{fontSize:13,fontWeight:700,color:"#475569"}}>Base de caja:</span>
            <input type="number" value={config.baseCaja!==undefined?config.baseCaja:501500} onChange={function(e){setBase(e.target.value);}} style={Object.assign({width:130},inp)}/>
            <span style={{fontSize:12,color:"#94a3b8"}}>COP</span>
            <span style={{width:1,height:24,background:"#e2e8f0",margin:"0 4px"}}></span>
            <span style={{fontSize:13,fontWeight:700,color:"#475569"}}>Mostrar desde:</span>
            <input type="date" value={desde} onChange={function(e){setDesde(e.target.value);}} style={Object.assign({},inp,{fontWeight:600,fontSize:13})}/>
            {desde && <button onClick={function(){setDesde("");}} style={{padding:"6px 10px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Ver todo</button>}
            <span style={{marginLeft:"auto",display:"inline-block",background:descuadres>0?"#fef2f2":"#f0fdf4",border:"1px solid "+(descuadres>0?"#fecaca":"#bbf7d0"),color:descuadres>0?"#b91c1c":"#15803d",borderRadius:9,padding:"7px 14px",fontWeight:800,fontSize:13}}>
              {descuadres>0 ? ("⚠ "+descuadres+" por revisar") : "✓ Todo cuadra"}
            </span>
          </div>
          {filas.length===0
            ? <p style={{color:"#94a3b8",fontSize:13}}>No hay arqueos en el rango seleccionado.</p>
            : (
              <div style={{display:"flex",flexDirection:"column",gap:12}}>
                {filas.map(function(f,idx){
                  var malCont = f.contDif!==null && f.contDif!==0;
                  var malQuedo = f.difQuedo!==null && f.difQuedo!==0;
                  var hayMal = malCont||malQuedo;
                  var faltaRecaudo = f.recaudo===undefined;
                  var resultColor = f.difQuedo===null?"#94a3b8":(f.difQuedo===0?"#15803d":"#b91c1c");
                  var resultTxt = f.difQuedo===null ? "— falta registrar el recaudo"
                    : (f.difQuedo===0 ? "✓ Caja cuadra con la base"
                    : (f.difQuedo>0 ? "⚠ Sobró "+fmt(f.difQuedo)+" en caja" : "⚠ Faltó "+fmt(Math.abs(f.difQuedo))+" en caja"));
                  return (
                    <div key={idx} style={{border:"1.5px solid "+(hayMal?"#fecaca":"#e2e8f0"),background:"#fff",borderRadius:14,padding:"14px 16px",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,paddingBottom:8,borderBottom:"1px solid #f1f5f9"}}>
                        <span style={{fontSize:15,fontWeight:800,color:"#1e293b"}}>{f.fecha}</span>
                        <span style={{fontSize:12,color:"#94a3b8"}}>{f.qRec||""}</span>
                        <span style={{marginLeft:"auto",fontSize:12,fontWeight:800,color:hayMal?"#b91c1c":"#15803d"}}>{hayMal?"⚠ Revisar":"✓ OK"}</span>
                      </div>
                      <Linea label="Recibió al abrir" valor={fmt(f.recibido)}/>
                      {f.prevEnt!==null && (
                        <div style={{fontSize:11,marginTop:-2,marginBottom:2,color:malCont?"#b91c1c":"#15803d",fontWeight:600}}>
                          {malCont ? ("⚠ No coincide con lo entregado anoche ("+fmt(f.prevEnt)+")") : ("✓ Coincide con lo entregado anoche")}
                        </div>
                      )}
                      <Linea label="Enviado a contabilidad" valor={"− "+fmt(f.recaudo)} color="#b45309"/>
                      <div style={{borderTop:"1px dashed #cbd5e1",margin:"4px 0"}}></div>
                      <Linea label="Quedó en caja" valor={"= "+fmt(f.quedo)} fuerte={true}/>
                      <Linea label="Debe quedar (base)" valor={fmt(base)}/>
                      <div style={{marginTop:8,background:f.difQuedo===0?"#f0fdf4":(faltaRecaudo?"#f8fafc":"#fef2f2"),borderRadius:9,padding:"9px 12px",textAlign:"center",fontSize:15,fontWeight:900,color:resultColor}}>
                        {resultTxt}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          <p style={{fontSize:11,color:"#94a3b8",marginTop:14,lineHeight:1.4}}>Como el control es nuevo, los días viejos (datos de prueba) saldrán como descuadre — usa "Mostrar desde" con la fecha en que empezaron a hacerlo bien. "Coincide con lo entregado anoche" salta domingos/festivos. Corrige valores en el Detalle de cada asesor.</p>
        </div>
      );
    }

    function InformesTab(props) {
      var config = props.config;
      var entries = props.entries || {};
      var onConfigChange = props.onConfigChange;
      var ASESORAS = (config.asesoras || ASESORAS_DEFAULT).filter(function(a){return !(config.inactivoAsesor && config.inactivoAsesor[a]);});
      var hoy = today();
      var primerDiaMes = hoy.slice(0,7) + "-01";
      var [desde, setDesde] = useState(primerDiaMes);
      var [hasta, setHasta] = useState(hoy);
      var [msg, setMsg] = useState("");
      var [mesPlan, setMesPlan] = useState(hoy.slice(0,7));
      var [genPlan, setGenPlan] = useState(false);
      var DIAS_LBL = ["Domingo","Lunes","Martes","Miercoles","Jueves","Viernes","Sabado"];

      function descargarPlaneacion(){
        if(typeof fflate==="undefined"){ setMsg("No se pudo cargar el generador (revisa tu conexión)."); return; }
        if(!window.PLANTILLA_PLANEACION){ setMsg("La plantilla no está incrustada."); return; }
        setGenPlan(true); setMsg("Generando planeación de "+mesPlan+"…");
        try{
          var REN={53:"R001",54:"R009",55:"R002",56:"R003",57:"R004",58:"R005",59:"R006",60:"R007",61:"R011",62:"R000"};
          var FAC={84:"R001",85:"R009",86:"R002",87:"R003",88:"R004",89:"R005",90:"R006",91:"R007",92:"R011"};
          var ROL_ROW=40, VENTAS_ROW=42;
          function setHidden(xml,rowNum,hide){
            var re=new RegExp('<row r="'+rowNum+'"[^>]*>');
            return xml.replace(re,function(tag){ tag=tag.replace(/\s+hidden="[^"]*"/g,''); if(hide) tag=tag.replace(/>$/,' hidden="1">'); return tag; });
          }
          var FACT={clientes:{R001:0.21,R009:0.08,R002:0.07,R003:0.07,R004:0.56,R005:0.56,R006:1.11,R007:2.22,R011:-0.84},leads:{R001:0.28,R009:0.08,R002:0.07,R003:0.07,R004:0.56,R005:0.56,R006:1.11,R007:2.22,R011:-0.84}};
          function grupoRol(rol){ return ((rol||"").toLowerCase().indexOf("cliente")>=0)?"clientes":"leads"; }
          function siNo(ch,c){ var v=(ch&&ch[c])||""; if(v==="")return null; if(v==="Si"||v==="Tarde")return "Si"; if(v==="No")return "No"; if(typeof v==="string"&&v.indexOf("/")>=0){ if(v==="s/s")return "Si"; var q=v.split("/"); var a=parseFloat(q[0]),b=parseFloat(q[1]); return (b>0&&a>=b)?"Si":"No"; } return "Si"; }
          function colLetter(n){ var s=""; while(n>0){ var r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
          function patchSheet(xml, cellMap){
            return xml.replace(/<c r="([A-Z]+\d+)"([^>]*?)(\/>|>[\s\S]*?<\/c>)/g, function(full, ref, attrs){
              if(!(ref in cellMap)) return full;
              var spec=cellMap[ref]; var sm=/\ss="(\d+)"/.exec(attrs); var st=sm?(' s="'+sm[1]+'"'):"";
              if(spec.blank) return '<c r="'+ref+'"'+st+'/>';
              if(spec.num!==undefined) return '<c r="'+ref+'"'+st+'><v>'+spec.num+'</v></c>';
              var esc=String(spec.str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
              return '<c r="'+ref+'"'+st+' t="inlineStr"><is><t>'+esc+'</t></is></c>';
            });
          }
          var b64=window.PLANTILLA_PLANEACION, bin=atob(b64), raw=new Uint8Array(bin.length), i;
          for(i=0;i<bin.length;i++) raw[i]=bin.charCodeAt(i);
          var files=fflate.unzipSync(raw);
          var dec=new TextDecoder(), enc=new TextEncoder();
          var wbxml=dec.decode(files["xl/workbook.xml"]);
          var relsxml=dec.decode(files["xl/_rels/workbook.xml.rels"]);
          var sheets=[], mm, reS=/<sheet name="([^"]*)"[^>]*r:id="(rId\d+)"/g;
          while((mm=reS.exec(wbxml))!==null) sheets.push([mm[1],mm[2]]);
          var relmap={}, reR=/Id="(rId\d+)"[^>]*Target="([^"]*)"/g;
          while((mm=reR.exec(relsxml))!==null) relmap[mm[1]]=mm[2];
          var asesores=(config.asesoras||ASESORAS_DEFAULT).slice();
          // --- Tareas de VENTAS (código "A…"); SAC y otros roles no entran en este informe ---
          var ventasTareas=(config.tareas||TAREAS_BASE).filter(function(t){ return t&&t.code&&String(t.code).toUpperCase().charAt(0)==="A"; });
          var nombrePorCode={}, codeSet={}, tt;
          for(tt=0;tt<ventasTareas.length;tt++){ nombrePorCode[ventasTareas[tt].code]=ventasTareas[tt].nombre||ventasTareas[tt].code; codeSet[ventasTareas[tt].code]=true; }
          // Orden curado de la plantilla; las tareas nuevas de la bitácora se agregan al final.
          var ORDEN=["A001","A002","A003","A005","A006","A008","A014","A026","A028","A015","A016","A010","A011","A024","A025","A004","A009","A029","A012","A013","A031"];
          var finalCodes=[], visto={}, oi;
          for(oi=0;oi<ORDEN.length;oi++){ if(codeSet[ORDEN[oi]]&&!visto[ORDEN[oi]]){ finalCodes.push(ORDEN[oi]); visto[ORDEN[oi]]=true; } }
          for(tt=0;tt<ventasTareas.length;tt++){ if(!visto[ventasTareas[tt].code]){ finalCodes.push(ventasTareas[tt].code); visto[ventasTareas[tt].code]=true; } }
          var ACT_MIN=2, ACT_MAX=36, CAP=ACT_MAX-ACT_MIN+1;
          var sobran=finalCodes.slice(CAP), usar=finalCodes.slice(0,CAP);
          var ACT={}, ai; for(ai=0;ai<usar.length;ai++){ ACT[ACT_MIN+ai]=usar[ai]; }
          // Empareja el nombre de la hoja con el asesor por tokens (evita confundir "Valentina" con "Valentina Granada").
          function matchAsesor(sn){
            var t=sn.trim().toLowerCase().split(/\s+/), cands=[], k;
            for(k=0;k<asesores.length;k++){
              var a=asesores[k].toLowerCase().split(/\s+/), n=Math.min(a.length,t.length), ok=true, i2;
              for(i2=0;i2<n;i2++){ if(a[i2]!==t[i2]){ ok=false; break; } }
              if(ok) cands.push({name:asesores[k], diff:Math.abs(a.length-t.length)});
            }
            if(!cands.length) return null;
            cands.sort(function(x,y){return x.diff-y.diff;});
            return cands[0].name;
          }
          var ym=mesPlan, pp=ym.split("-"), yy=+pp[0], mes=+pp[1], dim=new Date(yy,mes,0).getDate();
          var cfgSheets=["Factores","Frases","Tareas","Tareas SAC"];
          var llenadas=[], s2;
          for(s2=0;s2<sheets.length;s2++){
            var name=sheets[s2][0], rid=sheets[s2][1];
            if(cfgSheets.indexOf(name.trim())>=0) continue;
            var asesor=matchAsesor(name); if(!asesor) continue;
            var path="xl/"+relmap[rid]; if(!files[path]) continue;
            var xml=dec.decode(files[path]), cellMap={}, hubo=false, d, rr, fila;
            // Actividades = tareas de ventas de la bitácora: código (col A) + nombre (col B). Filas sin tarea quedan vacías.
            for(fila=ACT_MIN; fila<=ACT_MAX; fila++){
              if(ACT[fila]){ cellMap["A"+fila]={str:ACT[fila]}; cellMap["B"+fila]={str:nombrePorCode[ACT[fila]]||ACT[fila]}; }
              else { cellMap["A"+fila]={blank:true}; cellMap["B"+fila]={blank:true}; }
            }
            for(d=1;d<=dim;d++){
              var col=colLetter(2+d), fecha=ym+"-"+(d<10?"0"+d:d), e=entries[asesor+"__"+fecha];
              if(e) hubo=true;
              for(fila=ACT_MIN; fila<=ACT_MAX; fila++){
                if(ACT[fila]){ var v=e?siNo(e.checks,ACT[fila]):null; cellMap[col+fila]=(v===null)?{blank:true}:{str:v}; }
                else { cellMap[col+fila]={blank:true}; }
              }
              cellMap[col+ROL_ROW]=(e&&e.rol)?{str:e.rol}:{blank:true};
              cellMap[col+VENTAS_ROW]=(e&&e.ventas!==undefined&&e.ventas!=="")?{num:Number(e.ventas)||0}:{blank:true};
              for(rr in REN){ var mv=e&&e.metricas&&e.metricas[REN[rr]]; cellMap[col+rr]=(mv!==undefined&&mv!=="")?{num:Number(mv)||0}:{blank:true}; }
              for(rr in FAC){ var fv=e?FACT[grupoRol(e.rol)][FAC[rr]]:undefined; cellMap[col+rr]=(fv!==undefined)?{num:fv}:{blank:true}; }
            }
            var patched=patchSheet(xml,cellMap);
            // Oculta las filas de actividad sin tarea (para que la tabla crezca/encoja); muestra las usadas.
            for(fila=ACT_MIN; fila<=ACT_MAX; fila++){ patched=setHidden(patched, fila, !ACT[fila]); }
            files[path]=enc.encode(patched);
            if(hubo) llenadas.push(name.trim());
          }
          // Quita calcChain.xml (quedaría desactualizado y Excel pediría "reparar").
          if(files["xl/calcChain.xml"]){
            delete files["xl/calcChain.xml"];
            files["[Content_Types].xml"]=enc.encode(dec.decode(files["[Content_Types].xml"]).replace(/<Override[^>]*calcChain[^>]*\/>/,""));
            files["xl/_rels/workbook.xml.rels"]=enc.encode(dec.decode(files["xl/_rels/workbook.xml.rels"]).replace(/<Relationship[^>]*calcChain[^>]*\/>/,""));
          }
          var out=fflate.zipSync(files);
          var blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
          var url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download="Planeacion_ventas_"+ym+".xlsx"; document.body.appendChild(a); a.click();
          setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},150);
          setGenPlan(false);
          var aviso = sobran.length ? (" ⚠️ "+sobran.length+" tarea(s) de ventas no caben en la plantilla (máx. "+CAP+"): "+sobran.join(", ")+". Avísame para ampliarla.") : "";
          setMsg((llenadas.length? ("✓ Planeación de "+ym+" generada con datos de: "+llenadas.join(", ")+".") : ("Se descargó la plantilla, pero no había datos de "+ym+" en la bitácora."))+aviso);
        }catch(err){ setGenPlan(false); setMsg("Error al generar: "+err.message); }
      }
      function registrosEnRango(d, h) {
        return Object.keys(entries).map(function(k){return entries[k];})
          .filter(function(e){ return e && e.fecha && e.rol && e.fecha>=d && e.fecha<=h && !(config.inactivoAsesor && config.inactivoAsesor[e.asesora]); })
          .sort(function(a,b){ return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.asesora<b.asesora?-1:1); });
      }
      function descargarCSV(nombre, filas) {
        var csv = filas.map(function(row){ return row.map(function(c){
          var s=(c===null||c===undefined)?"":String(c);
          if (/[",\n\r]/.test(s)) s='"'+s.replace(/"/g,'""')+'"';
          return s;
        }).join(","); }).join("\r\n");
        var blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8;"});
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a"); a.href=url; a.download=nombre;
        document.body.appendChild(a); a.click();
        setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},120);
      }
      function flash(t){ setMsg(t); setTimeout(function(){setMsg("");},2500); }

      function exportarDetalle() {
        var regs = registrosEnRango(desde,hasta);
        if (!regs.length) { flash("No hay registros en ese rango."); return; }
        var filas=[["Fecha","Anio","Mes","Dia semana","Asesor","Categoria","Rol","Codigo","Tarea","Estado","Hecha","Hora limite","Puntualidad del dia"]];
        regs.forEach(function(e){
          var asign=getTareasAsignadas(e.asesora,e.fecha,e.rol,config);
          var rend=calcRendimientoRegistro(e,config);
          var d=new Date(e.fecha+"T12:00:00");
          var cat=(config.categoriaAsesor&&config.categoriaAsesor[e.asesora])||"";
          asign.forEach(function(t){
            var v=(e.checks&&e.checks[t.code])||"";
            var estado=v==="Si"?"Hecha":v==="Tarde"?"Tarde":v==="No"?"No":"Pendiente";
            var hecha=(v==="Si"||v==="Tarde")?1:0;
            filas.push([e.fecha,e.fecha.slice(0,4),e.fecha.slice(5,7),DIAS_LBL[d.getDay()],e.asesora,cat,e.rol,t.code,t.nombre,estado,hecha,t.hora||"",rend.puntualidad]);
          });
        });
        descargarCSV("bitacora_detalle_"+desde+"_a_"+hasta+".csv",filas);
        flash("Detalle exportado ("+(filas.length-1)+" filas).");
      }
      function exportarResumen() {
        var regs=registrosEnRango(desde,hasta);
        if (!regs.length) { flash("No hay registros en ese rango."); return; }
        var filas=[["Fecha","Anio","Mes","Dia semana","Asesor","Categoria","Rol","Tareas asignadas","Hechas","% Cumplimiento","Puntualidad","Ventas"]];
        regs.forEach(function(e){
          var r=calcRendimientoRegistro(e,config);
          var d=new Date(e.fecha+"T12:00:00");
          var cat=(config.categoriaAsesor&&config.categoriaAsesor[e.asesora])||"";
          filas.push([e.fecha,e.fecha.slice(0,4),e.fecha.slice(5,7),DIAS_LBL[d.getDay()],e.asesora,cat,e.rol,r.total,r.hechas,r.pct===null?"":r.pct,r.puntualidad,e.ventas||""]);
        });
        descargarCSV("bitacora_resumen_"+desde+"_a_"+hasta+".csv",filas);
        flash("Resumen exportado ("+(filas.length-1)+" filas).");
      }
      function exportarMensual() {
        var regs=registrosEnRango(desde,hasta);
        if (!regs.length) { flash("No hay registros en ese rango."); return; }
        var acc={};
        regs.forEach(function(e){
          var mes=e.fecha.slice(0,7); var k=mes+"||"+e.asesora;
          if(!acc[k]) acc[k]={mes:mes,asesor:e.asesora,cat:(config.categoriaAsesor&&config.categoriaAsesor[e.asesora])||"",dias:0,sumaPct:0,conPct:0,aTiempo:0,tarde:0,conPunt:0};
          var r=calcRendimientoRegistro(e,config); var o=acc[k]; o.dias++;
          if(r.pct!==null){o.sumaPct+=r.pct;o.conPct++;}
          if(r.aTiempo){o.aTiempo++;o.conPunt++;} else if(r.tarde){o.tarde++;o.conPunt++;}
        });
        var filas=[["Mes","Asesor","Categoria","Dias registrados","% Cumplimiento promedio","A tiempo","Tarde","% Puntualidad"]];
        Object.keys(acc).sort().forEach(function(k){var o=acc[k];
          filas.push([o.mes,o.asesor,o.cat,o.dias,o.conPct?Math.round(o.sumaPct/o.conPct):"",o.aTiempo,o.tarde,o.conPunt?Math.round(o.aTiempo/o.conPunt*100):""]);
        });
        descargarCSV("bitacora_consolidado_mensual_"+desde+"_a_"+hasta+".csv",filas);
        flash("Consolidado mensual exportado.");
      }

      // Agregado por asesor en el rango (para panel de rendimiento)
      function rendimientoPorAsesor() {
        var regs=registrosEnRango(desde,hasta);
        var acc={};
        regs.forEach(function(e){
          if(!acc[e.asesora]) acc[e.asesora]={asesor:e.asesora,dias:0,sumaPct:0,conPct:0,aTiempo:0,punt:0};
          var r=calcRendimientoRegistro(e,config); var o=acc[e.asesora]; o.dias++;
          if(r.pct!==null){o.sumaPct+=r.pct;o.conPct++;}
          if(r.aTiempo||r.tarde){o.punt++; if(r.aTiempo)o.aTiempo++;}
        });
        return Object.keys(acc).map(function(k){var o=acc[k];
          return {asesor:o.asesor,dias:o.dias,pct:o.conPct?Math.round(o.sumaPct/o.conPct):null,punt:o.punt?Math.round(o.aTiempo/o.punt*100):null};
        }).sort(function(a,b){return (b.pct||0)-(a.pct||0);});
      }
      function semaforo(pct){ if(pct===null)return{bg:"#f1f5f9",tx:"#64748b",e:"—"}; if(pct>=90)return{bg:"#dcfce7",tx:"#15803d",e:"🟢"}; if(pct>=70)return{bg:"#fef9c3",tx:"#92400e",e:"🟡"}; return{bg:"#fee2e2",tx:"#b91c1c",e:"🔴"}; }

      // Tendencia últimos 30 días de un asesor
      function tendencia30(asesor) {
        var res=[];
        for (var i=29;i>=0;i--){
          var d=new Date(); d.setDate(d.getDate()-i);
          var off=d.getTimezoneOffset(); var loc=new Date(d.getTime()-off*60000);
          var f=loc.toISOString().slice(0,10);
          var e=entries[asesor+"__"+f];
          if (e && e.rol){ var r=calcRendimientoRegistro(e,config); res.push({f:f,pct:r.pct,tarde:r.tarde}); }
          else res.push({f:f,pct:null,tarde:false});
        }
        return res;
      }
      // Racha actual: días consecutivos con registro y 100% cumplimiento (desde hoy hacia atrás)
      function rachaAsesor(asesor) {
        var cumpl=0, punt=0, i, roto1=false, roto2=false;
        for (i=0;i<120 && (!roto1||!roto2);i++){
          var d=new Date(); d.setDate(d.getDate()-i);
          var off=d.getTimezoneOffset(); var loc=new Date(d.getTime()-off*60000);
          var f=loc.toISOString().slice(0,10);
          var e=entries[asesor+"__"+f];
          if (!e || !e.rol){ continue; } // día sin registro (descanso/libre) no rompe la racha
          var r=calcRendimientoRegistro(e,config);
          if (!roto1){ if(r.pct===100) cumpl++; else roto1=true; }
          if (!roto2){ if(!r.tarde) punt++; else roto2=true; }
        }
        return {cumpl:cumpl, punt:punt};
      }

      function exportarConfig() {
        var data=JSON.stringify(config,null,2);
        var blob=new Blob([data],{type:"application/json"});
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a"); a.href=url; a.download="bitacora_respaldo_config_"+hoy+".json";
        document.body.appendChild(a); a.click();
        setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},120);
        flash("Respaldo de configuración descargado.");
      }
      var fileRef=React.useRef(null);
      function importarConfig(e) {
        var file=e.target.files&&e.target.files[0]; if(!file)return;
        var reader=new FileReader();
        reader.onload=function(ev){
          try{
            var nueva=JSON.parse(ev.target.result);
            if(!nueva||typeof nueva!=="object"){flash("Archivo inválido.");return;}
            if(window.confirm("¿Restaurar esta configuración? Reemplazará roles, tareas, horarios, turnos, colores y demás ajustes actuales. (No afecta los registros de bitácora.)")){
              onConfigChange(nueva); flash("Configuración restaurada.");
            }
          }catch(err){ flash("No se pudo leer el archivo JSON."); }
          if(fileRef.current) fileRef.current.value="";
        };
        reader.readAsText(file);
      }

      var card={borderRadius:14,border:"1px solid #e2e8f0",background:"#fff",padding:16,marginBottom:16};
      var h3={fontSize:14,fontWeight:800,color:"#1a2e0a",margin:"0 0 4px"};
      var sub={fontSize:12,color:"#64748b",margin:"0 0 12px",lineHeight:1.4};
      var btn={padding:"9px 14px",borderRadius:10,border:"none",fontWeight:700,fontSize:13,cursor:"pointer",color:"#fff"};
      var inp={padding:"8px 10px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,color:"#1e293b",background:"#f8fafc",fontFamily:"inherit"};


      return (
        <div>
          {msg && <div style={{padding:"8px 12px",borderRadius:9,background:"#dcfce7",color:"#15803d",fontWeight:700,fontSize:12,marginBottom:12}}>{msg}</div>}

          {/* PLANEACIÓN DE VENTAS */}
          <div style={Object.assign({},card,{background:"#f7fdf0",borderColor:"#8DC63F"})}>
            <div style={h3}>📋 Planeación de ventas (Excel)</div>
