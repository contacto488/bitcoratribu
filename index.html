    // ===================== ROLES TAB =====================
    function RolesTab(props) {
      var config = props.config;
      var onSave = props.onSave;
      var saved = props.saved;
      var allRoles = getRoleKeys(config);
      // Helper: dado un rol, obtener su entrada efectiva (con migración a paleta limitada)
      function rolToEntry(nombre, existing) {
        if (existing && existing.paletaKey) {
          var p = paletaPorKey(existing.paletaKey);
          return {nombre:nombre, paletaKey:existing.paletaKey, bg:p.bg, text:p.text, dot:p.dot};
        }
        // Si no hay paletaKey, asignar auto según nombre
        var auto = colorAutoPorRol(nombre);
        return {nombre:nombre, paletaKey:auto.key, bg:auto.bg, text:auto.text, dot:auto.dot};
      }
      var [roles, setRoles] = useState(function(){
        var existentes = config.customRoles && config.customRoles.length > 0 ? config.customRoles : [];
        var lista = getRoleKeys(config).map(function(r){
          var prev = existentes.find(function(e){return e.nombre === r;});
          return rolToEntry(r, prev);
        });
        // Incluir roles fijos extra (que existan en config pero no en getRoleKeys)
        var rolesFijosExtra = ROLES_FIJOS_EXTRA;
        rolesFijosExtra.forEach(function(rf){
          if (!lista.find(function(x){return x.nombre === rf;})) {
            var prev = existentes.find(function(e){return e.nombre === rf;});
            lista.push(rolToEntry(rf, prev));
          }
        });
        // Incluir cualquier otro rol custom que ya esté en existentes
        existentes.forEach(function(e){
          if (!lista.find(function(x){return x.nombre === e.nombre;})) {
            lista.push(rolToEntry(e.nombre, e));
          }
        });
        return lista;
      });
      var [nuevoRol, setNuevoRol] = useState("");
      var [nuevoRolCat, setNuevoRolCat] = useState("Equipo Ventas");
      var [confirmarEliminarRol, setConfirmarEliminarRol] = useState(null);
      var [rolEditandoColor, setRolEditandoColor] = useState(null); // nombre del rol cuyo selector está abierto
      function catDeRol(r){ return r.categoria || getCategoriaRol(r.nombre, config); }

      function cambiarColorRol(nombre, paletaKey) {
        var p = paletaPorKey(paletaKey);
        var updated = roles.map(function(r){
          return r.nombre === nombre ? Object.assign({}, r, {nombre:r.nombre, paletaKey:paletaKey, bg:p.bg, text:p.text, dot:p.dot}) : r;
        });
        setRoles(updated);
        onSave(updated);
        setRolEditandoColor(null);
      }
      function cambiarCategoriaRol(nombre, cat) {
        var updated = roles.map(function(r){ return r.nombre===nombre ? Object.assign({},r,{categoria:cat}) : r; });
        setRoles(updated);
        onSave(updated);
      }
      function addRol() {
        var nombre = nuevoRol.trim();
        if (!nombre) return;
        if (roles.find(function(r){return r.nombre===nombre;})) return;
        var auto = colorAutoPorRol(nombre);
        var entry = {nombre:nombre, paletaKey:auto.key, bg:auto.bg, text:auto.text, dot:auto.dot, categoria:nuevoRolCat};
        var updated = roles.concat([entry]);
        setRoles(updated);
        setNuevoRol("");
        onSave(updated);
      }
      function removeRol(nombre) { setConfirmarEliminarRol(nombre); }
      function confirmarRemoveRol() {
        var updated = roles.filter(function(r){return r.nombre!==confirmarEliminarRol;});
        setRoles(updated);
        onSave(updated);
        setConfirmarEliminarRol(null);
      }

      return (
        <div>
          <p style={{fontSize:13,color:"#64748b",marginTop:0,marginBottom:14}}>
            Crea roles personalizados. Los colores se asignan automáticamente según el tipo (Ventas, Servicio, Logística, Líder) pero puedes cambiarlos haciendo clic en el círculo de color.
          </p>

          <div style={{padding:"9px 13px",background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:10,marginBottom:14,fontSize:11,color:"#64748b",lineHeight:1.5}}>
            🎨 <b>Asignación automática:</b> Ventas (Leads/Clientes/Híbrido) → <b style={{color:"#16a34a"}}>verde</b> · Servicio al cliente → <b style={{color:"#3b82f6"}}>azul</b> · Logística → <b style={{color:"#ea580c"}}>naranja</b> · Líder → <b style={{color:"#dc2626"}}>rojo</b>
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:14,marginBottom:14}}>
            {CATEGORIAS_ASESOR.concat(["Sin categoría"]).map(function(cat){
              var rolesCat = roles.filter(function(r){ return catDeRol(r)===cat; });
              if (rolesCat.length===0) return null;
              return (
                <div key={cat}>
                  <div style={{fontSize:12,fontWeight:800,color:"#475569",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6,paddingBottom:4,borderBottom:"2px solid #e2e8f0"}}>{cat} <span style={{color:"#94a3b8",fontWeight:600}}>({rolesCat.length})</span></div>
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>
                    {rolesCat.map(function(r,i){
              return (
                <div key={r.nombre} style={{borderRadius:11,border:"1.5px solid "+(r.dot||"#e2e8f0"),background:r.bg||"#f8fafc",overflow:"hidden"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,padding:"11px 14px",flexWrap:"wrap"}}>
                    <button onClick={function(){setRolEditandoColor(rolEditandoColor===r.nombre?null:r.nombre);}}
                      title="Cambiar color"
                      style={{width:20,height:20,borderRadius:"50%",background:r.dot||"#94a3b8",flexShrink:0,border:"2px solid rgba(255,255,255,0.7)",cursor:"pointer",padding:0,boxShadow:"0 0 0 1px "+(r.dot||"#94a3b8")}}></button>
                    <span style={{flex:1,minWidth:110,fontSize:13,fontWeight:700,color:r.text||"#1e293b"}}>{r.nombre}</span>
                    <select value={catDeRol(r)} onChange={function(e){cambiarCategoriaRol(r.nombre, e.target.value);}} title="Categoría del rol" style={{padding:"4px 7px",borderRadius:7,border:"1.5px solid rgba(0,0,0,0.12)",fontSize:11,color:"#334155",background:"#fff",cursor:"pointer",fontFamily:"inherit"}}>
                      {CATEGORIAS_ASESOR.concat(["Sin categoría"]).map(function(c){return <option key={c} value={c}>{c}</option>;})}
                    </select>
                    <button onClick={function(){removeRol(r.nombre);}} style={{padding:"4px 10px",borderRadius:7,border:"none",background:"#fef2f2",color:"#ef4444",fontWeight:700,fontSize:11,cursor:"pointer"}}>Eliminar</button>
                  </div>
                  {rolEditandoColor === r.nombre && (
                    <div style={{padding:"10px 14px",background:"#fff",borderTop:"1px solid "+(r.dot||"#e2e8f0")}}>
                      <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:7,textTransform:"uppercase",letterSpacing:"0.05em"}}>Elige un color</div>
                      <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:6}}>
                        {PALETA_ROLES.map(function(p){
                          var activo = r.paletaKey === p.key;
                          return (
                            <button key={p.key} onClick={function(){cambiarColorRol(r.nombre, p.key);}}
                              title={p.label}
                              style={{padding:"7px 4px",borderRadius:9,border:"2px solid "+(activo?p.dot:"#e2e8f0"),
                                background:p.bg,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,
                                boxShadow:activo?"0 0 0 2px "+p.dot+"40":"none"}}>
                              <div style={{width:18,height:18,borderRadius:"50%",background:p.dot}}></div>
                              <span style={{fontSize:9,fontWeight:700,color:p.text}}>{p.label}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
                  </div>
                </div>
              );
            })}
          </div>

          {confirmarEliminarRol && (
            <div style={{padding:"16px",borderRadius:12,border:"2px solid #fca5a5",background:"#fef2f2",marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:800,color:"#991b1b",marginBottom:8}}>Eliminar rol: <b>{confirmarEliminarRol}</b></div>
              <div style={{fontSize:12,color:"#b91c1c",marginBottom:12}}>Esta acción no se puede deshacer. Las tareas asignadas a este rol se verán afectadas.</div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={confirmarRemoveRol} style={{flex:1,padding:"9px 0",borderRadius:9,border:"none",background:"#ef4444",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>Sí, eliminar</button>
                <button onClick={function(){setConfirmarEliminarRol(null);}} style={{flex:1,padding:"9px 0",borderRadius:9,border:"1.5px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:700,fontSize:13,cursor:"pointer"}}>Cancelar</button>
              </div>
            </div>
          )}

          <div style={{padding:"14px 16px",borderRadius:12,border:"2px dashed #e2e8f0",background:"#f8fafc",marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>+ Nuevo rol</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <input placeholder="Nombre del rol (ej: Mensajero, Coordinador...)" value={nuevoRol}
                onChange={function(e){setNuevoRol(e.target.value);}}
                onKeyDown={function(e){if(e.key==="Enter")addRol();}}
                style={{flex:1,minWidth:160,padding:"9px 12px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,color:"#1e293b",background:"#fff",outline:"none",fontFamily:"inherit"}}/>
              <select value={nuevoRolCat} onChange={function(e){setNuevoRolCat(e.target.value);}} title="Categoría del nuevo rol" style={{padding:"9px 10px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,color:"#1e293b",background:"#fff",cursor:"pointer",fontFamily:"inherit"}}>
                {CATEGORIAS_ASESOR.map(function(c){return <option key={c} value={c}>{c}</option>;})}
              </select>
              <button onClick={addRol} style={{padding:"8px 18px",borderRadius:9,border:"none",background:"#8DC63F",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>Agregar</button>
            </div>
            <div style={{fontSize:10,color:"#94a3b8",marginTop:7,lineHeight:1.4}}>
              💡 Elige la <b>categoría</b> donde se guardará el rol. El color se asigna automáticamente según el nombre y lo puedes cambiar después.
            </div>
          </div>
        </div>
      );
    }

    // ===================== CONTRASENAS TAB =====================
    function ContrasenasTab(props) {
      var config = props.config;
      var passwords = props.passwords;
      var onSave = props.onSave;
      var saved = props.saved;
      var ASESORAS = config.asesoras || ASESORAS_DEFAULT;

      var [local, setLocal] = useState(function(){return Object.assign({},passwords);});
      var [visible, setVisible] = useState({});
      var [editando, setEditando] = useState(null);
      var [nuevaPwd, setNuevaPwd] = useState("");
      var [confirmPwd, setConfirmPwd] = useState("");
      var [errorMsg, setErrorMsg] = useState("");

      function toggleVisible(a) { setVisible(function(v){var n=Object.assign({},v);n[a]=!v[a];return n;}); }
      function abrirEditor(a) { setEditando(a); setNuevaPwd(""); setConfirmPwd(""); setErrorMsg(""); }
      function cerrarEditor() { setEditando(null); setNuevaPwd(""); setConfirmPwd(""); setErrorMsg(""); }

      function guardarPwd(a) {
        if (nuevaPwd.length > 0 && nuevaPwd.length < 4) { setErrorMsg("Mínimo 4 caracteres"); return; }
        if (nuevaPwd !== confirmPwd) { setErrorMsg("Las contraseñas no coinciden"); return; }
        var updated = Object.assign({},local);
        if (nuevaPwd === "") delete updated[a];
        else updated[a] = nuevaPwd;
        setLocal(updated);
        onSave(updated);
        cerrarEditor();
      }

      function quitarPwd(a) {
        var updated = Object.assign({},local);
        delete updated[a];
        setLocal(updated);
        onSave(updated);
      }

      var inp2 = {padding:"9px 12px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,color:"#1e293b",background:"#f8fafc",outline:"none",fontFamily:"inherit",width:"100%",boxSizing:"border-box"};

      return (
        <div>
          <div style={{padding:"12px 16px",background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:12,marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,color:"#0369a1",marginBottom:4}}>Cómo funciona</div>
            <div style={{fontSize:12,color:"#0c4a6e",lineHeight:1.5}}>
              Si un asesor tiene contraseña configurada, se le pedirá al selecciónarla en el login.
              Si no tiene contraseña, entra directamente. Deja el campo vacío para quitar la contraseña.
            </div>
          </div>
          <div style={{marginBottom:16,borderRadius:14,border:"2px solid #6366f1",background:"#f5f3ff",overflow:"hidden"}}>
            <div style={{padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:36,height:36,borderRadius:10,background:"#6366f1",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,color:"#fff",fontWeight:800,flexShrink:0}}>A</div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700,color:"#1e293b"}}>Administrador</div>
                <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>
                  {passwords["__admin__"]
                    ? <span style={{display:"flex",alignItems:"center",gap:6}}>
                        <span style={{fontFamily:"monospace",letterSpacing:3,fontWeight:700,color:"#6366f1"}}>{"*".repeat((passwords["__admin__"]||"").length)}</span>

                  <div style={{padding:"13px 16px",display:"flex",alignItems:"center",gap:12}}>

                    {!esEditando && (

                        <button onClick={function(){abrirEditor(a);}} style={{padding:"6px 12px",borderRadius:8,border:"1.5px solid #d4edaa",background:"#eef6d5",color:"#3d6b10",fontWeight:700,fontSize:11,cursor:"pointer"}}>
                          {tienePwd?"Cambiar":"Agregar"}
                        </button>
                        {tienePwd && <button onClick={function(){quitarPwd(a);}} style={{padding:"6px 10px",borderRadius:8,border:"none",background:"#fef2f2",color:"#ef4444",fontWeight:700,fontSize:11,cursor:"pointer"}}>Quitar</button>}
                      </div>
                    )}

                  {esEditando && (
                    <div style={{padding:"14px 16px",borderTop:"1px solid #fde68a",background:"#fffbeb"}}>
                      <div style={{fontSize:11,fontWeight:800,color:"#92400e",marginBottom:10}}>
                        {local[a]?"Cambiar contraseña de "+a.split(" ")[0]:"Nueva contraseña para "+a.split(" ")[0]}
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:10}}>
                        <div>
                          <label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:4}}>Nueva contraseña (mínimo 4 caracteres)</label>
                          <input type="password" value={nuevaPwd} onChange={function(e){setNuevaPwd(e.target.value);setErrorMsg("");}} placeholder="Nueva contraseña..." style={inp2} autoFocus/>
                        </div>
                        <div>
                          <label style={{fontSize:11,fontWeight:700,color:"#64748b",display:"block",marginBottom:4}}>Confirmar contraseña</label>
                          <input type="password" value={confirmPwd} onChange={function(e){setConfirmPwd(e.target.value);setErrorMsg("");}} onKeyDown={function(e){if(e.key==="Enter")guardarPwd(a);}} placeholder="Repetir contraseña..." style={Object.assign({},inp2,{borderColor:errorMsg?"#fca5a5":"#e2e8f0"})}/>
                        </div>
                      </div>
                      {errorMsg && <div style={{fontSize:12,color:"#dc2626",fontWeight:700,marginBottom:8}}>{errorMsg}</div>}
                      <div style={{display:"flex",gap:8}}>
                        <button onClick={function(){guardarPwd(a);}} style={{flex:1,padding:"10px 0",borderRadius:10,border:"none",background:"linear-gradient(135deg,#8DC63F,#5a8a1f)",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                          Guardar contraseña
                        </button>
                        <button onClick={cerrarEditor} style={{padding:"10px 14px",borderRadius:10,border:"1.5px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:700,fontSize:12,cursor:"pointer"}}>Cancelar</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }


    // ===================== TAREAS ADMIN TAB =====================
    function TareasAdminTab(props) {
      // Fusionar tareas de Firebase con roles de TAREAS_BASE para compatibilidad
      var tareasFB = props.tareas || [];
      var listaTareas = tareasFB.map(function(t) {
        // Si la tarea de Firebase no tiene roles o tiene roles vacíos, buscar en TAREAS_BASE
        if (!t.roles || t.roles.length === 0) {
          var base = TAREAS_BASE.find(function(b){ return b.code === t.code; });
          if (base) return Object.assign({}, t, {roles: base.roles});
        }
        return t;
      });
      var setListaTareas = props.setTareas;
      var cfg = props.config || {};
      var onGuardar = props.onSave;
      var onCambiarConfig = props.onConfigChange;
      var guardado = props.saved;
      function onGuardarConfig(nuevaCfg) { if(onCambiarConfig) onCambiarConfig(nuevaCfg); }

      var [editandoCode, setEditandoCode] = useState(null);
      var [textoEdicion, setTextoEdicion] = useState("");
      var [pantallaActiva, setPantallaActiva] = useState("base");
      var [diaActivo, setDiaActivo] = useState("lunes");
      var [confirmarLimpiarDia, setConfirmarLimpiarDia] = useState(null);
      var [nuevaTarea, setNuevaTarea] = useState({code:"", nombre:"", roles:[]});
      var [confirmarEliminar, setConfirmarEliminar] = useState(null);
      // Estado del diálogo "crear grupo nuevo" cuando una tarea usa un prefijo desconocido
      // Forma: {tareaPendiente:{code,nombre}, prefijo, labelGrupo, emojiGrupo} o null
      var [dialogoNuevoGrupo, setDialogoNuevoGrupo] = useState(null);
      // Grupos de tareas base abiertos (Ventas/SAC/Otras). Por defecto Ventas abierto.
      var [grupoTareasAbierto, setGrupoTareasAbierto] = useState({ventas:true, sac:false, otras:false});
      // Estados para gestión de sub-tareas (qué tarea está expandida y texto del nuevo paso)
      var [subTareaExpandida, setSubTareaExpandida] = useState(null);
      var [campoExpandido, setCampoExpandido] = useState(null); // qué tarea tiene abierto el panel "Campo de valor"
      var [notaExpandida, setNotaExpandida] = useState(null); // qué tarea tiene abierto el panel "Nota/recordatorio"
      var [nuevoSubPaso, setNuevoSubPaso] = useState("");
      var [confirmarEliminarSub, setConfirmarEliminarSub] = useState(null); // {code, itemId}
      var [editandoSub, setEditandoSub] = useState(null); // {code, itemId}
      var [textoEdicionSub, setTextoEdicionSub] = useState("");
      // Estados para Tareas Programadas (deben estar al nivel del componente)
      var [progNuevaFecha, setProgNuevaFecha] = useState(today());
      var [progNuevoDia, setProgNuevoDia] = useState("15");
      var [progNuevoTipo, setProgNuevoTipo] = useState("fecha");
      var [progNuevasTareas, setProgNuevasTareas] = useState([]);
      var [progNuevosRoles, setProgNuevosRoles] = useState([]);
      var [progNuevaNota, setProgNuevaNota] = useState("");
      var [progExpandido, setProgExpandido] = useState(null);
      var [progBusqueda, setProgBusqueda] = useState("");

      var estiloInput = {padding:"9px 12px", borderRadius:9, border:"1.5px solid #e2e8f0", fontSize:13, color:"#1e293b", background:"#f8fafc", outline:"none", fontFamily:"inherit"};

      var rolesDisponibles = getRoleKeys(cfg);
      // Agregar roles fijos al listado si no estan
      var rolesFijosExtra = ROLES_FIJOS_EXTRA;
      rolesFijosExtra.forEach(function(rf){
        if(rolesDisponibles.indexOf(rf)<0) rolesDisponibles = rolesDisponibles.concat([rf]);
      });
      var coloresRoles = getRoleColors(cfg);

      // Guarda la lista de tareas al instante (estado local + Firebase). Evita que un cambio se pierda o se revierta.
      function guardarTareas(nuevaLista) {
        setListaTareas(nuevaLista);
        if (onCambiarConfig) onCambiarConfig(Object.assign({}, cfg, {tareas: nuevaLista}));
      }

      // ── funciones base ──
      function cambiarRolTarea(code, rol) {
        var nuevaLista = listaTareas.map(function(t) {
          if (t.code !== code) return t;
          var rolesActuales = Array.isArray(t.roles) ? t.roles : [];
          var nuevosRoles = rolesActuales.indexOf(rol) >= 0
            ? rolesActuales.filter(function(r) { return r !== rol; })
            : rolesActuales.concat([rol]);
          return Object.assign({}, t, {roles: nuevosRoles});
        });
        guardarTareas(nuevaLista);
      }

      function eliminarTarea(code) {
        guardarTareas(listaTareas.filter(function(t) { return t.code !== code; }));
      }

      function empezarEdicion(t) {
        setEditandoCode(t.code);
        setTextoEdicion(t.nombre || "");
      }

      function confirmarEdicion(code) {
        if (!textoEdicion.trim()) return;
        guardarTareas(listaTareas.map(function(t) {
          return t.code === code ? Object.assign({}, t, {nombre: textoEdicion.trim()}) : t;
        }));
        setEditandoCode(null);
      }
      // Activa/edita/quita el campo de valor de una tarea (se guarda solo)
      function actualizarCampoTarea(code, nuevoCampo) {
        var nuevaLista = listaTareas.map(function(x){
          if (x.code !== code) return x;
          var c = Object.assign({}, x);
          if (nuevoCampo) c.campoValor = nuevoCampo; else delete c.campoValor;
          return c;
        });
        setListaTareas(nuevaLista);
        if (onCambiarConfig) onCambiarConfig(Object.assign({},cfg,{tareas:nuevaLista}));
      }
      // Escribe/borra la nota (recordatorio/comentario) fija de una tarea (se guarda solo)
      function actualizarNotaTarea(code, texto) {
        var nuevaLista = listaTareas.map(function(x){
          if (x.code !== code) return x;
          var c = Object.assign({}, x);
          if (texto && texto.trim()) c.nota = texto; else delete c.nota;
          return c;
        });
        guardarTareas(nuevaLista);
      }

      function agregarNuevaTarea() {
        var code = nuevaTarea.code.trim();
        var nombre = nuevaTarea.nombre.trim();
        if (!code || !nombre) return;
        // Verificar si el prefijo del código pertenece a un grupo existente
        var pref = extraerPrefijo(code);
        var prefijosExistentes = getPrefijosExistentes(cfg);
        if (pref && prefijosExistentes.indexOf(pref) < 0) {
          // Prefijo nuevo → abrir diálogo para crear el grupo
          var nextEmoji = EMOJIS_GRUPOS[getGruposEfectivos(cfg).length % EMOJIS_GRUPOS.length];
          setDialogoNuevoGrupo({
            tareaPendiente: {code: code, nombre: nombre},
            prefijo: pref,
            labelGrupo: "Nuevo grupo " + pref,
            emojiGrupo: nextEmoji
          });
          return;
        }
        // Prefijo conocido → agregar la tarea directamente
        guardarTareas(listaTareas.concat([{code: code, nombre: nombre, roles: []}]));
        setNuevaTarea({code:"", nombre:"", roles:[]});
      }

      // Crea el grupo nuevo confirmando el diálogo y agrega la tarea pendiente
      function confirmarCrearGrupo() {
        if (!dialogoNuevoGrupo) return;
        var pref = dialogoNuevoGrupo.prefijo;
        var label = (dialogoNuevoGrupo.labelGrupo||"").trim() || ("Grupo " + pref);
        var emoji = (dialogoNuevoGrupo.emojiGrupo||"").trim() || "📋";
        // Generar key único (slug del label en minúsculas, sin espacios/acentos)
        var keyBase = label.toLowerCase()
          .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
          .replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"") || ("grupo_" + pref.toLowerCase());
        var key = keyBase;
        var gruposActuales = getGruposEfectivos(cfg);
        var sufijo = 1;
        while (gruposActuales.find(function(g){return g.key === key;})) {
          sufijo++;
          key = keyBase + "_" + sufijo;
        }
        var colorIdx = gruposActuales.length % PALETAS_GRUPOS.length;
        var grupoNuevo = {
          key: key,
          label: label,
          emoji: emoji,
          prefix: pref,
          colors: PALETAS_GRUPOS[colorIdx],
          roles: []
        };
        // Guardar el grupo nuevo Y la tarea pendiente en una sola operación (para no pisarse)
        var tp = dialogoNuevoGrupo.tareaPendiente;
        var nuevaLista = listaTareas.concat([{code: tp.code, nombre: tp.nombre, roles: []}]);
        setListaTareas(nuevaLista);
        onGuardarConfig(Object.assign({}, cfg, {gruposCustom: nuevosGrupos, tareas: nuevaLista}));
        setNuevaTarea({code:"", nombre:"", roles:[]});
        setDialogoNuevoGrupo(null);
      }

      function toggleRolNueva(rol) {
        setNuevaTarea(function(nt) {
          var rolesNt = Array.isArray(nt.roles) ? nt.roles : [];
          var nuevosRoles = rolesNt.indexOf(rol) >= 0
            ? rolesNt.filter(function(r) { return r !== rol; })
            : rolesNt.concat([rol]);
          return Object.assign({}, nt, {roles: nuevosRoles});
        });
      }

      // ── funciones de sub-tareas ──
      // Las sub-tareas se almacenan dentro de la tarea como propiedad `subtareas` (array de {id, texto}).
      // Auto-generación de ID: usamos un contador basado en marca de tiempo + índice (sub_xxxx).
      function genSubId() {
        return "s" + Date.now().toString(36) + Math.floor(Math.random()*1000).toString(36);
      }
      function obtenerSubtareasTarea(code) {
        var t = listaTareas.find(function(x){return x.code===code;});
        if (!t) return [];
        if (Array.isArray(t.subtareas)) return t.subtareas;
        // Si no tiene subtareas explícitas pero existe en TAREAS_BASE con ellas, devolverlas (compatibilidad)
        var base = TAREAS_BASE.find(function(b){return b.code===code;});
        if (base && Array.isArray(base.subtareas)) return base.subtareas;
        return [];
      }
      function setSubtareasTarea(code, nuevas) {
        var nuevaLista = listaTareas.map(function(t){
          if (t.code !== code) return t;
          if (!nuevas || nuevas.length === 0) {
            var copia = Object.assign({}, t);
            delete copia.subtareas;
            return copia;
          }
          return Object.assign({}, t, {subtareas: nuevas});
        });
        guardarTareas(nuevaLista);
      }
      function agregarSubPaso(code) {
        var texto = (nuevoSubPaso || "").trim();
        if (!texto) return;
        var actuales = obtenerSubtareasTarea(code).slice();
        actuales.push({id: genSubId(), texto: texto});
        setSubtareasTarea(code, actuales);
        setNuevoSubPaso("");
      }
      function eliminarSubPaso(code, itemId) {
        var actuales = obtenerSubtareasTarea(code).filter(function(s){return s.id !== itemId;});
        setSubtareasTarea(code, actuales);
      }
      function moverSubPaso(code, itemId, direccion) {
        var actuales = obtenerSubtareasTarea(code).slice();
        var idx = actuales.findIndex(function(s){return s.id === itemId;});
        if (idx < 0) return;
        var nuevoIdx = idx + direccion;
        if (nuevoIdx < 0 || nuevoIdx >= actuales.length) return;
        var temp = actuales[idx];
        actuales[idx] = actuales[nuevoIdx];
        actuales[nuevoIdx] = temp;
        setSubtareasTarea(code, actuales);
      }
      function confirmarEdicionSub(code, itemId) {
        var texto = (textoEdicionSub || "").trim();
        if (!texto) return;
        var actuales = obtenerSubtareasTarea(code).map(function(s){
          return s.id === itemId ? Object.assign({}, s, {texto: texto}) : s;
        });
        setSubtareasTarea(code, actuales);
        setEditandoSub(null);
        setTextoEdicionSub("");
      }

      // ── funciones semanales ──
      var [feedbackSemana, setFeedbackSemana] = useState(null);
      // Estado para drag & drop de tareas en "Por día de semana"
      // Estructura: {rol: string, idx: number} de la tarea que se está arrastrando
      var [dragging, setDragging] = useState(null);
      var [dragOverIdx, setDragOverIdx] = useState(null);

      function toggleConfigSemana(dia, rol, code, tipo) {
        var semana = JSON.parse(JSON.stringify(cfg.tareasSemanales || {}));
        if (!semana[dia]) semana[dia] = {};
        if (!semana[dia][rol]) semana[dia][rol] = {add:[], remove:[], orden:[]};
        var lista = semana[dia][rol][tipo] || [];
        var pos = lista.indexOf(code);
        if (pos >= 0) { lista.splice(pos, 1); } else { lista.push(code); }
        semana[dia][rol][tipo] = lista;
        var opuesto = tipo === "add" ? "remove" : "add";
        semana[dia][rol][opuesto] = (semana[dia][rol][opuesto] || []).filter(function(c) { return c !== code; });
        // Si se quita una tarea (remove), también limpiar de orden
        if (tipo === "remove" && pos < 0) {
          // recién añadida a remove → quitarla de orden si está
          var orden = semana[dia][rol].orden || [];
          semana[dia][rol].orden = orden.filter(function(c){return c !== code;});
        }
        var ordenLen = (semana[dia][rol].orden || []).length;
        if (semana[dia][rol].add.length === 0 && semana[dia][rol].remove.length === 0 && ordenLen === 0) {
          delete semana[dia][rol];
        }
        if (Object.keys(semana[dia] || {}).length === 0) { delete semana[dia]; }
        onCambiarConfig(Object.assign({}, cfg, {tareasSemanales: semana}));
        setFeedbackSemana(code + tipo);
        setTimeout(function(){ setFeedbackSemana(null); }, 1500);
      }

      // Reordenar tareas de un rol/día. listaCodes es el array final en el orden deseado.
      function setOrdenDiaRol(dia, rol, listaCodes) {
        var semana = JSON.parse(JSON.stringify(cfg.tareasSemanales || {}));
        if (!semana[dia]) semana[dia] = {};
        if (!semana[dia][rol]) semana[dia][rol] = {add:[], remove:[], orden:[]};
        semana[dia][rol].orden = (listaCodes || []).slice();
        // Limpieza: si todo queda vacío, eliminar la entrada
        var r = semana[dia][rol];
        if ((r.add||[]).length === 0 && (r.remove||[]).length === 0 && (r.orden||[]).length === 0) {
          delete semana[dia][rol];
          if (Object.keys(semana[dia] || {}).length === 0) delete semana[dia];
        }
        onCambiarConfig(Object.assign({}, cfg, {tareasSemanales: semana}));
      }

      // Mover una tarea de fromIdx a toIdx dentro de la lista actual de tareas activas del día/rol.
      // tareasActivas es el array completo de objetos {code, nombre, ...} en su orden actual.
      function moverTareaDiaRol(dia, rol, tareasActivas, fromIdx, toIdx) {
        if (fromIdx === toIdx) return;
        if (fromIdx < 0 || toIdx < 0) return;
        if (fromIdx >= tareasActivas.length || toIdx >= tareasActivas.length) return;
        var codes = tareasActivas.map(function(t){return t.code;});
        var movido = codes.splice(fromIdx, 1)[0];
        codes.splice(toIdx, 0, movido);
        setOrdenDiaRol(dia, rol, codes);
      }

      function limpiarConfigDia(dia) {
        var semana = JSON.parse(JSON.stringify(cfg.tareasSemanales || {}));
        delete semana[dia];

                    style={{background:"#fff",borderRadius:18,maxWidth:480,width:"100%",padding:"22px 24px",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                      <div style={{width:42,height:42,borderRadius:11,background:"linear-gradient(135deg,#fef3c7,#fde68a)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>✨</div>
                      <div>
                        <div style={{fontSize:16,fontWeight:900,color:"#0f172a"}}>Nuevo grupo detectado</div>
                        <div style={{fontSize:12,color:"#64748b",marginTop:1}}>El prefijo <b style={{color:"#1e293b"}}>"{dialogoNuevoGrupo.prefijo}"</b> no pertenece a ningún grupo. Crea uno nuevo.</div>
                      </div>
                    </div>

                    <div style={{padding:"10px 12px",background:"#f8fafc",borderRadius:9,border:"1px solid #e2e8f0",marginBottom:14,fontSize:12,color:"#475569",lineHeight:1.5}}>
                      Vas a crear la tarea <b style={{color:"#1e293b"}}>{dialogoNuevoGrupo.tareaPendiente.code} — {dialogoNuevoGrupo.tareaPendiente.nombre}</b>. Antes, dale un nombre al nuevo grupo que la contendrá.
                    </div>

                    <div style={{display:"grid",gridTemplateColumns:"70px 1fr",gap:8,marginBottom:14}}>
                      <div>
                        <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:4}}>EMOJI</div>
                        <input value={dialogoNuevoGrupo.emojiGrupo} maxLength={2}
                          onChange={function(e){setDialogoNuevoGrupo(Object.assign({},dialogoNuevoGrupo,{emojiGrupo:e.target.value}));}}
                          style={Object.assign({},estiloInput,{textAlign:"center",fontSize:18,padding:"8px 4px"})}/>
                      </div>
                      <div>
                        <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:4}}>NOMBRE DEL GRUPO</div>
                        <input value={dialogoNuevoGrupo.labelGrupo} autoFocus
                          onChange={function(e){setDialogoNuevoGrupo(Object.assign({},dialogoNuevoGrupo,{labelGrupo:e.target.value}));}}
                          onKeyDown={function(e){if(e.key==="Enter") confirmarCrearGrupo();}}
                          placeholder="Ej: Marketing, Logística..."
                          style={estiloInput}/>
                      </div>
                    </div>

                    <div style={{display:"flex",gap:8}}>
                      <button onClick={function(){setDialogoNuevoGrupo(null);}}
                        style={{flex:1,padding:"10px 0",borderRadius:10,border:"1.5px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                        Cancelar
                      </button>
                      <button onClick={confirmarCrearGrupo}
                        disabled={!(dialogoNuevoGrupo.labelGrupo||"").trim()}
                        style={{flex:2,padding:"10px 0",borderRadius:10,border:"none",
                          background:(dialogoNuevoGrupo.labelGrupo||"").trim()?"linear-gradient(135deg,#8DC63F,#5a8a1f)":"#cbd5e1",
                          color:"#fff",fontWeight:800,fontSize:13,cursor:(dialogoNuevoGrupo.labelGrupo||"").trim()?"pointer":"default"}}>
                        ✨ Crear grupo y agregar tarea
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {confirmarEliminar && (
                <div style={{marginBottom:14,padding:"16px",borderRadius:14,border:"2px solid #fca5a5",background:"#fef2f2"}}>
                  <div style={{fontSize:14,fontWeight:800,color:"#991b1b",marginBottom:6}}>¿Eliminar esta tarea?</div>
                  <div style={{fontSize:13,color:"#b91c1c",marginBottom:14}}>
                    Se eliminará <b>{(listaTareas.find(function(t){return t.code===confirmarEliminar;})||{}).nombre}</b> de la lista y de todas las configuraciones semanales.
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={function(){eliminarTarea(confirmarEliminar);setConfirmarEliminar(null);}}
                      style={{flex:1,padding:"10px 0",borderRadius:10,border:"none",background:"#ef4444",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                      Sí, eliminar
                    </button>
                    <button onClick={function(){setConfirmarEliminar(null);}}
                      style={{flex:1,padding:"10px 0",borderRadius:10,border:"1.5px solid #e2e8f0",background:"#fff",color:"#475569",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                      Cancelar
                    </button>
                  </div>
                </div>
              )}

              <button onClick={function() { onGuardar(listaTareas); }}
                style={{width:"100%", padding:12, borderRadius:11, border:"none", fontWeight:700, fontSize:14, cursor:"pointer",
                  background: guardado ? "#10b981" : "linear-gradient(135deg,#8DC63F,#5a8a1f)", color:"#fff"}}>
                {guardado ? "Guardado" : "Guardar cambios"}
              </button>
            </div>
          )}

          {pantallaActiva === "semana" && (
            <div>
              <p style={{fontSize:13,color:"#64748b",marginTop:0,marginBottom:14}}>
                Define las tareas de cada rol por día. Las secciones se dividen según el grupo asignado en <b>Grupos</b>.
              </p>

              {/* Selector de días */}
              <div style={{display:"flex",gap:5,marginBottom:16,flexWrap:"wrap"}}>
                {DIAS_CON_FESTIVO_KEYS.map(function(dk,di){
                  var tieneConf = !!(cfg.tareasSemanales && cfg.tareasSemanales[dk] && Object.keys(cfg.tareasSemanales[dk]).length > 0);
                  var activo = diaActivo === dk;
                  var esFest = dk === "festivo";
                  return (
                    <button key={dk} onClick={function(){setDiaActivo(dk);}}
                      style={{padding:"7px 14px",borderRadius:20,fontWeight:700,fontSize:12,cursor:"pointer",
                        border:"1.5px solid "+(activo?(esFest?"#c026d3":"#8DC63F"):tieneConf?"#f59e0b":esFest?"#e9d5ff":"#e2e8f0"),
                        background:activo?(esFest?"#c026d3":"#8DC63F"):tieneConf?"#fffbeb":esFest?"#faf5ff":"#f8fafc",
                        color:activo?"#fff":tieneConf?"#92400e":esFest?"#a21caf":"#64748b"}}>
                      {esFest?"🎉 ":""}{DIAS_CON_FESTIVO_LABELS[di]}{tieneConf&&!activo?" •":""}
                    </button>
                  );
                })}
              </div>

              {/* Header del día */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
                <div>
                  <div style={{fontSize:15,fontWeight:800,color:"#1a2e0a"}}>{DIAS_CON_FESTIVO_LABELS[DIAS_CON_FESTIVO_KEYS.indexOf(diaActivo)]}{diaActivo==="festivo"?" — se aplica al asignar el rol «Híbrido festivo» en Turnos":""}</div>
                  <div style={{fontSize:11,color:"#64748b",marginTop:2}}>Activa o desactiva los roles que trabajan este día abajo</div>
                </div>
                {cfg.tareasSemanales && cfg.tareasSemanales[diaActivo] && (
                  confirmarLimpiarDia === diaActivo ? (
                    <div style={{display:"flex",gap:5,alignItems:"center"}}>
                      <span style={{fontSize:11,color:"#ef4444",fontWeight:700}}>¿Borrar?</span>
                      <button onClick={function(){limpiarConfigDia(diaActivo);setConfirmarLimpiarDia(null);}} style={{padding:"3px 10px",borderRadius:7,border:"none",background:"#ef4444",color:"#fff",fontWeight:700,fontSize:11,cursor:"pointer"}}>Sí</button>
                      <button onClick={function(){setConfirmarLimpiarDia(null);}} style={{padding:"3px 10px",borderRadius:7,border:"1px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:700,fontSize:11,cursor:"pointer"}}>No</button>
                    </div>
                  ) : (
                    <button onClick={function(){setConfirmarLimpiarDia(diaActivo);}} style={{padding:"4px 12px",borderRadius:8,border:"none",background:"#fef2f2",color:"#ef4444",fontWeight:700,fontSize:11,cursor:"pointer"}}>Limpiar día</button>
                  )
                )}
              </div>

              {/* Selector de roles activos */}
              {(function(){
                var rolesDia = (cfg.rolesPorDia && cfg.rolesPorDia[diaActivo]) || (
                  diaActivo==="festivo" ? [ROL_FESTIVO] :
                  diaActivo==="sabado" ? ["Leads Sab","Clientes Sab","Servicio al cliente","Lider"] :
                  diaActivo==="domingo" ? ["Hibrido","Servicio al cliente"] :
                  rolesDisponibles.filter(function(r){return ["Leads Sab","Clientes Sab",ROL_FESTIVO].indexOf(r)<0;})
                );
                return (
                  <div style={{marginBottom:16,padding:"12px 14px",background:"#f0f9ff",borderRadius:12,border:"1px solid #bae6fd"}}>
                    <div style={{fontSize:11,fontWeight:800,color:"#0369a1",marginBottom:8}}>Roles que trabajan este día — haz clic para activar/desactivar</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {rolesDisponibles.map(function(r){
                        var activo = rolesDia.indexOf(r) >= 0;
                        var c = coloresRoles[r] || {};
                        return (
                          <button key={r} onClick={function(){
                            var nuevos = activo ? rolesDia.filter(function(x){return x!==r;}) : rolesDia.concat([r]);
                            var rpd = Object.assign({},cfg.rolesPorDia||{}); rpd[diaActivo]=nuevos;
                            onGuardarConfig(Object.assign({},cfg,{rolesPorDia:rpd}));
                          }} style={{padding:"4px 12px",borderRadius:20,fontWeight:700,fontSize:11,cursor:"pointer",
                            border:"1.5px solid "+(activo?(c.dot||"#8DC63F"):"#e2e8f0"),
                            background:activo?(c.bg||"#eef6d5"):"#fff",
                            color:activo?(c.text||"#3d6b10"):"#94a3b8"}}>
                            {r}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}

              {/* Secciones por grupo — dinámicas según config.gruposCustom */}
              {(function(){
                var rolesDia = (cfg.rolesPorDia && cfg.rolesPorDia[diaActivo]) || (
                  diaActivo==="festivo" ? [ROL_FESTIVO] :
                  diaActivo==="sabado" ? ["Leads Sab","Clientes Sab","Servicio al cliente","Lider"] :
                  diaActivo==="domingo" ? ["Hibrido","Servicio al cliente"] :
                  rolesDisponibles.filter(function(r){return ["Leads Sab","Clientes Sab",ROL_FESTIVO].indexOf(r)<0;})
                );
                var rolesDelDia = rolesDisponibles.filter(function(r){return rolesDia.indexOf(r)>=0;});

                // Definición dinámica de grupos
                var gruposDef = getGruposEfectivos(cfg);

                return gruposDef.map(function(gDef){
                  var colors = gDef.colors || PALETAS_GRUPOS[0];
                  var rolesGrupo = (gDef.roles||[]).filter(function(r){return rolesDelDia.indexOf(r)>=0;});
                  if (rolesGrupo.length === 0) return null;

                  // Tareas disponibles para este grupo (filtradas por prefijo)
                  var prefijo = (gDef.prefix||"").toUpperCase();
                  var tareasGrupo = listaTareas.filter(function(t){
                    return prefijo && (t.code||"").toUpperCase().startsWith(prefijo);
                  });

                  return (
                    <div key={gDef.key} style={{marginBottom:20,borderRadius:16,border:"1.5px solid "+colors.border,overflow:"hidden"}}>
                      {/* Header sección */}
                      <div style={{padding:"12px 16px",background:"linear-gradient(135deg,"+colors.text+","+colors.color+")",display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:18}}>{gDef.emoji||"📋"}</span>
                        <div style={{fontSize:14,fontWeight:800,color:"#fff"}}>{gDef.label}</div>
                        <span style={{fontSize:10,background:"rgba(255,255,255,0.2)",color:"#fff",borderRadius:20,padding:"2px 8px",fontWeight:700}}>
                          Tareas prefijo {prefijo}... · {rolesGrupo.length} roles
                        </span>
                      </div>

                      {/* Roles del grupo */}
                      <div style={{padding:"12px 16px",background:gDef.bg}}>
                        {rolesGrupo.map(function(rol){
                          var confRol = getConfigDiaRol(diaActivo, rol);
                          var tareasBase = tareasGrupo.filter(function(t){
                            var r = Array.isArray(t.roles) ? t.roles : [];
                            return r.indexOf(rol) >= 0;
                          });
                          var tareasAgregadas = confRol.add.map(function(code){
                            return listaTareas.find(function(t){return t.code===code;});
                          }).filter(Boolean);
                          var tareasUnificadas = tareasBase.concat(tareasAgregadas.filter(function(ta){
                            return !tareasBase.find(function(tb){return tb.code===ta.code;});
                          }));
                          // Disponibles para agregar = TODAS las del grupo que no estén activas ahora
                          // (incluye tareas base que se hayan "quitado", para poder re-agregarlas).
                          var codesActivosSet = {};
                          tareasUnificadas.forEach(function(t){ if(confRol.remove.indexOf(t.code)<0) codesActivosSet[t.code]=1; });
                          var tareasDisponibles = tareasGrupo.filter(function(t){
                            return !codesActivosSet[t.code];
                          });
                          // Tareas activas: las unificadas menos las removidas
                          var tareasActivasRaw = tareasUnificadas.filter(function(t){return confRol.remove.indexOf(t.code)<0;});
                          // Aplicar orden personalizado si existe
                          var ordenGuardado = confRol.orden || [];
                          var tareasActivas;
                          if (ordenGuardado.length > 0) {
                            // 1. Tareas en el orden guardado (que existan en activasRaw)
                            var enOrden = ordenGuardado.map(function(code){
                              return tareasActivasRaw.find(function(t){return t.code===code;});
                            }).filter(Boolean);
                            // 2. Nuevas tareas que aún no están en el orden guardado (van al final)
                            var fueraOrden = tareasActivasRaw.filter(function(t){return ordenGuardado.indexOf(t.code)<0;});
                            tareasActivas = enOrden.concat(fueraOrden);
                          } else {
                            tareasActivas = tareasActivasRaw;
                          }
                          var c = coloresRoles[rol] || {};
                          var tieneConf = confRol.add.length>0 || confRol.remove.length>0 || ordenGuardado.length>0;

                          // Handlers de drag & drop específicos para este rol
                          var onDragStart = function(idx) {
                            return function(e) {
                              setDragging({rol:rol, idx:idx});
                              try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(idx)); } catch(err){}
                            };
                          };
                          var onDragOver = function(idx) {
                            return function(e) {
                              e.preventDefault();
                              if (dragging && dragging.rol === rol) {
                                if (dragOverIdx !== idx) setDragOverIdx(idx);
                              }
                            };
                          };
                          var onDrop = function(idx) {
                            return function(e) {
                              e.preventDefault();
                              if (dragging && dragging.rol === rol && dragging.idx !== idx) {
                                moverTareaDiaRol(diaActivo, rol, tareasActivas, dragging.idx, idx);
                              }
                              setDragging(null);
                              setDragOverIdx(null);
                            };
                          };
                          var onDragEnd = function() {
                            setDragging(null);
                            setDragOverIdx(null);
                          };

                          // ── Soporte para móviles (touch events) ──
                          // El HTML5 drag nativo no dispara en touch, así que detectamos
                          // touchmove sobre las tarjetas y resolvemos sobre cuál soltamos.
                          var onTouchStartHandle = function(idx) {
                            return function(e) {
                              // Sólo iniciamos si tocaron la manija
                              setDragging({rol:rol, idx:idx, touch:true});
                            };
                          };
                          var onTouchMoveCard = function(e) {
                            if (!dragging || dragging.rol !== rol || !dragging.touch) return;
                            e.preventDefault();
                            var touch = e.touches[0];
                            if (!touch) return;
                            // Buscar el elemento bajo el dedo
                            var el = document.elementFromPoint(touch.clientX, touch.clientY);
                            while (el && (!el.dataset || el.dataset.taskIdx === undefined) && el !== document.body) {
                              el = el.parentElement;
                            }
                            if (el && el.dataset && el.dataset.taskIdx !== undefined && el.dataset.taskRol === rol) {
                              var nuevoIdx = parseInt(el.dataset.taskIdx, 10);
                              if (!isNaN(nuevoIdx) && dragOverIdx !== nuevoIdx) setDragOverIdx(nuevoIdx);
                            }
                          };
                          var onTouchEndCard = function() {
                            if (dragging && dragging.rol === rol && dragging.touch && dragOverIdx !== null && dragOverIdx !== dragging.idx) {
                              moverTareaDiaRol(diaActivo, rol, tareasActivas, dragging.idx, dragOverIdx);
                            }
                            setDragging(null);
                            setDragOverIdx(null);
                          };

                          return (
                            <div key={rol} style={{marginBottom:10,padding:"12px 14px",borderRadius:12,
                              border:"1.5px solid "+(tieneConf?"#8DC63F":"#e2e8f0"),
                              background:tieneConf?"#f9fef0":"#fff"}}>
                              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
                                <span style={{background:c.bg||"#f1f5f9",color:c.text||"#475569",
                                  padding:"3px 10px",borderRadius:20,fontWeight:700,fontSize:12,
                                  border:"1.5px solid "+(c.dot||"#e2e8f0")}}>{rol}</span>
                                {tieneConf && <span style={{fontSize:10,background:"#eef6d5",color:"#3d6b10",borderRadius:20,padding:"1px 8px",fontWeight:700}}>Modificado</span>}
                                {ordenGuardado.length > 0 && (
                                  <button onClick={function(){setOrdenDiaRol(diaActivo,rol,[]);}}
                                    title="Restaurar orden original"
                                    style={{fontSize:10,padding:"2px 8px",borderRadius:20,border:"1px solid #cbd5e1",background:"#fff",color:"#64748b",fontWeight:700,cursor:"pointer"}}>
                                    ↺ Resetear orden
                                  </button>
                                )}
                                {tareasActivas.length > 1 && (
                                  <span style={{fontSize:9,color:"#94a3b8",marginLeft:"auto",fontWeight:600}}>
                                    💡 Arrastra ⋮⋮ para reordenar
                                  </span>
                                )}
                              </div>

                              {/* Tareas activas (con drag & drop) */}
                              <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:8}}>
                                {tareasActivas.length===0 && (
                                  <span style={{fontSize:12,color:"#94a3b8",fontStyle:"italic"}}>Sin tareas activas para este día</span>
                                )}
                                {tareasActivas.map(function(t, idx){
                                  var esAgregada = confRol.add.indexOf(t.code)>=0;
                                  var seArrastra = dragging && dragging.rol === rol && dragging.idx === idx;
                                  var esTargetDrop = dragging && dragging.rol === rol && dragOverIdx === idx && dragging.idx !== idx;
                                  var arribaDelArrastrado = dragging && dragging.rol === rol && esTargetDrop && idx < dragging.idx;
                                  return (
                                    <div key={t.code}
                                      data-task-idx={idx}
                                      data-task-rol={rol}
                                      draggable
                                      onDragStart={onDragStart(idx)}
                                      onDragOver={onDragOver(idx)}
                                      onDrop={onDrop(idx)}
                                      onDragEnd={onDragEnd}
                                      onTouchMove={onTouchMoveCard}
                                      onTouchEnd={onTouchEndCard}
                                      onTouchCancel={onTouchEndCard}
                                      style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",
                                        borderRadius:9,background:esAgregada?"#f0fdf4":"#fff",
                                        border:"1.5px solid "+(esTargetDrop?"#8DC63F":(esAgregada?"#86efac":"#e2e8f0")),
                                        boxShadow:esTargetDrop?"0 0 0 3px rgba(141,198,63,0.2)":"none",
                                        opacity:seArrastra?0.4:1,
                                        transform:esTargetDrop ? (arribaDelArrastrado?"translateY(-2px)":"translateY(2px)") : "none",
                                        transition:"transform .15s, box-shadow .15s, border-color .15s, opacity .15s",
                                        cursor:"grab",
                                        userSelect:"none",
                                        touchAction: seArrastra?"none":"auto"}}>
                                      <span title="Arrastrar para reordenar"
                                        onTouchStart={onTouchStartHandle(idx)}
                                        style={{fontSize:18,color:seArrastra?"#8DC63F":"#cbd5e1",cursor:"grab",userSelect:"none",lineHeight:1,letterSpacing:"-2px",fontWeight:800,padding:"0 4px",touchAction:"none"}}>⋮⋮</span>
                                      <span style={{fontSize:10,color:"#94a3b8",minWidth:34,fontWeight:700}}>{t.code}</span>
                                      {esAgregada && <span style={{fontSize:9,background:"#dcfce7",color:"#15803d",borderRadius:20,padding:"1px 6px",fontWeight:700}}>EXTRA</span>}
                                      <span style={{flex:1,fontSize:12,fontWeight:500,color:"#1e293b"}}>{t.nombre}</span>
                                      <button onClick={function(){toggleConfigSemana(diaActivo,rol,t.code,esAgregada?"add":"remove");}}
                                        onMouseDown={function(e){e.stopPropagation();}}
                                        style={{padding:"3px 9px",borderRadius:7,border:"none",
                                          background:esAgregada?"#fef2f2":"#fef2f2",color:"#ef4444",
                                          fontWeight:700,fontSize:10,cursor:"pointer"}}>
                                        {esAgregada?"↩ Quitar":"✕ Quitar"}
                                      </button>
                                    </div>
                                  );
                                })}
                              </div>

                              {/* Tareas disponibles para agregar */}
                              {tareasDisponibles.length > 0 && (
                                <div>
                                  <div style={{fontSize:10,fontWeight:700,color:"#64748b",marginBottom:6}}>+ AGREGAR TAREA</div>
                                  <select
                                    value=""
                                    onChange={function(e){
                                      if(e.target.value) toggleConfigSemana(diaActivo,rol,e.target.value,"add");
                                    }}
                                    style={{width:"100%",padding:"8px 10px",borderRadius:9,
                                      border:"1.5px solid "+gDef.border,fontSize:12,color:"#1e293b",
                                      background:"#fff",outline:"none",fontFamily:"inherit",
                                      boxSizing:"border-box",cursor:"pointer"}}>
                                    <option value="">-- Seleccionar tarea ({tareasDisponibles.length} disponibles) --</option>
                                    {tareasDisponibles.map(function(t){
                                      return <option key={t.code} value={t.code}>{t.code} — {t.nombre}</option>;
                                    })}
                                  </select>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                });
              })()}
            </div>
          )}

          {/* ── Panel Programadas ── */}
          {pantallaActiva === "programadas" && (
            <div>
              <p style={{fontSize:13,color:"#64748b",marginTop:0,marginBottom:14}}>
                Programa tareas para fechas específicas o que se repitan mensualmente (ej: el día 15 de cada mes).
                Aparecerán automáticamente en la bitácora de ese día para los roles seleccionados.
              </p>
              {(function(){
                var programadas = cfg.tareasProgr || [];
                var hoyStr = today();
                // Las del tipo "fecha" cuya fecha ya pasó se ocultan visualmente,
                // pero permanecen guardadas en config (no se eliminan).
                var programadasVisibles = programadas.filter(function(p){
                  if (p.tipo === "fecha" && p.fecha && p.fecha < hoyStr) return false;
                  return true;
                });
                var ocultas = programadas.length - programadasVisibles.length;
                function toggleTareaP(code) {
                  setProgNuevasTareas(function(arr){
                    return arr.indexOf(code)>=0 ? arr.filter(function(c){return c!==code;}) : arr.concat([code]);
                  });
                }
                function toggleRolP(rol) {
                  setProgNuevosRoles(function(arr){
                    return arr.indexOf(rol)>=0 ? arr.filter(function(r){return r!==rol;}) : arr.concat([rol]);
                  });
                }
                function agregarProg() {
                  if (progNuevasTareas.length===0 || progNuevosRoles.length===0) return;
                  var entrada = {
                    id: Date.now()+"",
                    tipo: progNuevoTipo,
                    fecha: progNuevoTipo==="fecha" ? progNuevaFecha : null,
                    diaMes: progNuevoTipo==="mensual" ? parseInt(progNuevoDia,10) : null,
                    tareas: progNuevasTareas.slice(),
                    roles: progNuevosRoles.slice(),
                    nota: progNuevaNota.trim()
                  };
                  var updated = programadas.concat([entrada]);
                  onGuardarConfig(Object.assign({}, cfg, {tareasProgr: updated}));
                  setProgNuevasTareas([]); setProgNuevosRoles([]); setProgNuevaNota("");
                }
                function eliminarProg(id) {
                  var updated = programadas.filter(function(p){return p.id!==id;});
                  onGuardarConfig(Object.assign({}, cfg, {tareasProgr: updated}));
                }
                var inp3 = {padding:"8px 10px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:13,color:"#1e293b",background:"#f8fafc",outline:"none",fontFamily:"inherit"};
                return (
                  <div>
                    {/* Lista de programadas existentes (solo las activas: futuras o de hoy) */}
                    {programadasVisibles.length > 0 && (
                      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
                        {programadasVisibles.map(function(p){
                          var abierto = progExpandido === p.id;
                          var labFecha = p.tipo==="mensual"
                            ? "Cada día "+p.diaMes+" del mes"
                            : "El "+p.fecha;
                          var tareasNombres = (p.tareas||[]).map(function(code){
                            var t = listaTareas.find(function(x){return x.code===code;});
                            return t ? t.nombre : code;
                          });
                          return (
                            <div key={p.id} style={{borderRadius:12,border:"1.5px solid #e2e8f0",background:"#fff",overflow:"hidden"}}>
                              <div style={{padding:"10px 14px",display:"flex",alignItems:"center",gap:10,cursor:"pointer",background:"#f8fafc"}}
                                onClick={function(){setProgExpandido(abierto?null:p.id);}}>
                                <div style={{width:36,height:36,borderRadius:10,background:p.tipo==="mensual"?"#eef2ff":"#eef6d5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>
                                  {p.tipo==="mensual"?"🔁":"📅"}
                                </div>
                                <div style={{flex:1}}>
                                  <div style={{fontSize:13,fontWeight:700,color:"#1e293b"}}>{labFecha}</div>
                                  <div style={{fontSize:11,color:"#94a3b8"}}>{tareasNombres.length} tarea(s) · {(p.roles||[]).join(", ")}</div>
                                </div>
                                <button onClick={function(e){e.stopPropagation();eliminarProg(p.id);}}
                                  style={{padding:"4px 10px",borderRadius:7,border:"none",background:"#fef2f2",color:"#ef4444",fontWeight:700,fontSize:11,cursor:"pointer"}}>✕</button>
                              </div>
                              {abierto && (
                                <div style={{padding:"10px 14px",borderTop:"1px solid #f1f5f9"}}>
                                  {p.nota && <div style={{fontSize:12,color:"#64748b",marginBottom:6,fontStyle:"italic"}}>📝 {p.nota}</div>}
                                  <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                                    {tareasNombres.map(function(n,i){return <span key={i} style={{fontSize:11,background:"#eef6d5",color:"#3d6b10",borderRadius:20,padding:"2px 8px",fontWeight:600}}>{n}</span>;})}
                                  </div>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}
                    {ocultas > 0 && (
                      <div style={{marginBottom:16,padding:"8px 12px",background:"#f8fafc",border:"1px dashed #cbd5e1",borderRadius:9,fontSize:11,color:"#64748b",textAlign:"center"}}>
                        🕘 {ocultas} tarea(s) programada(s) ya cumplieron su fecha y se ocultaron automáticamente. Siguen guardadas en el historial.
                      </div>
                    )}

                    {/* Formulario agregar nueva */}
                    <div style={{padding:"16px",borderRadius:14,border:"2px dashed #e2e8f0",background:"#f8fafc"}}>
                      <div style={{fontSize:12,fontWeight:800,color:"#64748b",marginBottom:12}}>+ NUEVA TAREA PROGRAMADA</div>

                      {/* Tipo */}
                      <div style={{display:"flex",gap:6,marginBottom:12}}>
                        {[["fecha","📅 Fecha específica"],["mensual","🔁 Día del mes"]].map(function(opt){
                          return (
                            <button key={opt[0]} onClick={function(){setProgNuevoTipo(opt[0]);}}
                              style={{flex:1,padding:"8px 0",borderRadius:9,border:"1.5px solid "+(progNuevoTipo===opt[0]?"#8DC63F":"#e2e8f0"),
                                background:progNuevoTipo===opt[0]?"#eef6d5":"#fff",
                                color:progNuevoTipo===opt[0]?"#3d6b10":"#64748b",
                                fontWeight:700,fontSize:12,cursor:"pointer"}}>
                              {opt[1]}
                            </button>
                          );
                        })}
                      </div>

                      {/* Fecha o día del mes */}
                      <div style={{marginBottom:12}}>
                        <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:4}}>
                          {progNuevoTipo==="fecha"?"FECHA ESPECÍFICA":"DÍA DEL MES (1-31)"}
                        </div>
                        {progNuevoTipo==="fecha"
                          ? <input type="date" value={progNuevaFecha} onChange={function(e){setProgNuevaFecha(e.target.value);}} style={inp3}/>
                          : <input type="number" min="1" max="31" value={progNuevoDia} onChange={function(e){setProgNuevoDia(e.target.value);}} style={Object.assign({},inp3,{width:80})} placeholder="15"/>
                        }
                      </div>

                      {/* Nota opcional */}
                      <div style={{marginBottom:12}}>
                        <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:4}}>NOTA (opcional)</div>
                        <input value={progNuevaNota} onChange={function(e){setProgNuevaNota(e.target.value);}} placeholder="Ej: Informe mensual de transportadoras" style={Object.assign({},inp3,{width:"100%",boxSizing:"border-box"})}/>
                      </div>

                      {/* Roles */}
                      <div style={{marginBottom:12}}>
                        <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:6}}>ROLES QUE VEN ESTA TAREA</div>
                        <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                          {rolesDisponibles.map(function(r){
                            var activo = progNuevosRoles.indexOf(r) >= 0;
                            var c = coloresRoles[r] || {};
                            return (
                              <button key={r} onClick={function(){toggleRolP(r);}}
                                style={{padding:"3px 10px",borderRadius:20,fontWeight:700,fontSize:11,cursor:"pointer",
                                  border:"1.5px solid "+(activo?(c.dot||"#8DC63F"):"#e2e8f0"),
                                  background:activo?(c.bg||"#eef6d5"):"transparent",
                                  color:activo?(c.text||"#3d6b10"):"#94a3b8"}}>
                                {activo?"✓ ":""}{r}
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      {/* Tareas */}
                      <div style={{marginBottom:14}}>
                        <div style={{fontSize:11,fontWeight:700,color:"#64748b",marginBottom:6}}>TAREAS A AGREGAR ({progNuevasTareas.length} seleccionadas)</div>
                        <input
                          placeholder="🔍 Buscar tarea..."
                          value={progBusqueda}
                          onChange={function(e){setProgBusqueda(e.target.value);}}
                          style={{width:"100%",padding:"7px 10px",borderRadius:9,border:"1.5px solid #e2e8f0",fontSize:12,color:"#1e293b",background:"#fff",outline:"none",fontFamily:"inherit",boxSizing:"border-box",marginBottom:6}}
                        />
                        <div style={{maxHeight:200,overflowY:"auto",display:"flex",flexDirection:"column",gap:4,padding:"4px 0"}}>
                          {listaTareas.filter(function(t){
                            if (!progBusqueda.trim()) return true;
                            var q = progBusqueda.toLowerCase();
                            return (t.nombre||"").toLowerCase().indexOf(q)>=0 || (t.code||"").toLowerCase().indexOf(q)>=0;
                          }).map(function(t){
                            var activo = progNuevasTareas.indexOf(t.code) >= 0;
                            return (
                              <div key={t.code} onClick={function(){toggleTareaP(t.code);}}
                                style={{padding:"7px 10px",borderRadius:9,cursor:"pointer",display:"flex",alignItems:"center",gap:8,
                                  background:activo?"#eef6d5":"#fff",
                                  border:"1.5px solid "+(activo?"#8DC63F":"#e2e8f0")}}>
                                <div style={{width:16,height:16,borderRadius:4,border:"2px solid "+(activo?"#8DC63F":"#e2e8f0"),
                                  background:activo?"#8DC63F":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                                  {activo && <span style={{fontSize:10,color:"#fff",fontWeight:900}}>✓</span>}
                                </div>
                                <span style={{fontSize:11,color:"#94a3b8",minWidth:36,fontWeight:700}}>{t.code}</span>
                                <span style={{fontSize:12,color:"#1e293b",fontWeight:activo?700:400}}>{t.nombre}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      <button onClick={agregarProg}
                        disabled={progNuevasTareas.length===0||progNuevosRoles.length===0}
                        style={{width:"100%",padding:12,borderRadius:11,border:"none",fontWeight:700,fontSize:14,cursor:"pointer",
                          background:(progNuevasTareas.length>0&&progNuevosRoles.length>0)?"linear-gradient(135deg,#8DC63F,#5a8a1f)":"#e2e8f0",
                          color:(progNuevasTareas.length>0&&progNuevosRoles.length>0)?"#fff":"#94a3b8"}}>
                        Guardar tarea programada
                      </button>
                    </div>
                  </div>
                );
              })()}
            </div>
          )}

          {/* ── Panel Grupos ── */}
          {pantallaActiva === "grupos" && (
            <div>
              <p style={{fontSize:13,color:"#64748b",marginTop:0,marginBottom:16}}>
                Asigna roles a cada grupo. Cada grupo solo verá las tareas que tienen su prefijo de código.
                Puedes cambiar el prefijo de cualquier tarea en <b>Tareas base</b>.
              </p>

              {/* Info prefijos — todos los grupos definidos */}
              {(function(){
                var grupos = getGruposEfectivos(cfg);
                var saveGrupos = function(nuevos){
                  onGuardarConfig(Object.assign({}, cfg, {gruposCustom: nuevos}));
                };
                var toggleRolEnGrupo = function(grupoKey, rol) {
                  var nuevos = grupos.map(function(g){
                    var rls = (g.roles||[]).slice();
                    if (g.key === grupoKey) {
                      var idx = rls.indexOf(rol);
                      if (idx >= 0) rls.splice(idx,1); else rls.push(rol);
                    } else {
                      // quitar el rol de cualquier otro grupo (un rol solo puede estar en un grupo)
                      rls = rls.filter(function(r){return r !== rol;});
                    }
                    return Object.assign({}, g, {roles: rls});
                  });
                  saveGrupos(nuevos);
                };
                var renombrarGrupo = function(grupoKey, nuevoLabel) {
                  var nuevos = grupos.map(function(g){
                    return g.key === grupoKey ? Object.assign({}, g, {label: nuevoLabel}) : g;
                  });
                  saveGrupos(nuevos);
                };
                var cambiarEmojiGrupo = function(grupoKey, nuevoEmoji) {
                  var nuevos = grupos.map(function(g){
                    return g.key === grupoKey ? Object.assign({}, g, {emoji: nuevoEmoji}) : g;
                  });
                  saveGrupos(nuevos);
                };
                var eliminarGrupo = function(grupoKey) {
                  if (grupoKey === "vendedores" || grupoKey === "soporte") return; // no se borran los fijos
                  if (!confirm("¿Eliminar este grupo? Las tareas con su prefijo quedarán sin grupo asignado.")) return;
                  var nuevos = grupos.filter(function(g){return g.key !== grupoKey;});
                  saveGrupos(nuevos);
                };

                var todosRoles = getRoleKeys(cfg);
                var rolesFijosExtra = ROLES_FIJOS_EXTRA;
                rolesFijosExtra.forEach(function(rf){ if(todosRoles.indexOf(rf)<0) todosRoles=todosRoles.concat([rf]); });

                return (
                  <div>
                    {/* Tarjetas resumen */}
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:8,marginBottom:18}}>
                      {grupos.map(function(g){
                        var c = g.colors || PALETAS_GRUPOS[0];
                        var pref = (g.prefix||"").toUpperCase();
                        var tareasGrupo = listaTareas.filter(function(t){return pref && (t.code||"").toUpperCase().startsWith(pref);});
                        return (
                          <div key={g.key} style={{borderRadius:12,border:"1.5px solid "+c.border,background:c.bg,padding:"12px 14px"}}>
                            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                              <span style={{fontSize:16}}>{g.emoji||"📋"}</span>
                              <div style={{fontSize:13,fontWeight:800,color:c.text,flex:1}}>{g.label}</div>
                              {g.key !== "vendedores" && g.key !== "soporte" && (
                                <button onClick={function(){eliminarGrupo(g.key);}}
                                  title="Eliminar grupo"
                                  style={{padding:"2px 7px",borderRadius:6,border:"none",background:"rgba(255,255,255,0.5)",color:c.text,fontWeight:700,fontSize:11,cursor:"pointer"}}>✕</button>
                              )}
                            </div>
                            <div style={{fontSize:11,color:c.text,opacity:0.8,marginBottom:4}}>Prefijo: <b>{pref}...</b> ({pref}001–{pref}099)</div>
                            <div style={{fontSize:11,color:c.text}}>{tareasGrupo.length} tareas · {(g.roles||[]).length} roles</div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Asignar roles a cada grupo */}
                    <div style={{fontSize:12,fontWeight:800,color:"#475569",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.06em"}}>Asignar roles a grupos</div>
                    <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
                      {grupos.map(function(g){
                        var c = g.colors || PALETAS_GRUPOS[0];
                        var rolesGrupo = g.roles || [];
                        return (
                          <div key={g.key} style={{borderRadius:12,border:"1.5px solid "+c.border,background:"#fff",overflow:"hidden"}}>
                            <div style={{padding:"10px 14px",background:c.bg,borderBottom:"1px solid "+c.border,display:"flex",alignItems:"center",gap:8}}>
                              <input value={g.emoji||"📋"} maxLength={2}
                                onChange={function(e){cambiarEmojiGrupo(g.key, e.target.value);}}
                                title="Editar emoji"
                                style={{width:32,padding:"4px 6px",borderRadius:7,border:"1.5px solid "+c.border,background:"rgba(255,255,255,0.7)",fontSize:16,textAlign:"center",fontFamily:"inherit",outline:"none"}}/>
                              <input value={g.label}
                                onChange={function(e){renombrarGrupo(g.key, e.target.value);}}
                                style={{flex:1,padding:"5px 9px",borderRadius:7,border:"1.5px solid "+c.border,background:"rgba(255,255,255,0.7)",fontSize:13,fontWeight:800,color:c.text,fontFamily:"inherit",outline:"none"}}/>
                              <span style={{fontSize:10,padding:"3px 8px",borderRadius:20,background:"rgba(255,255,255,0.6)",color:c.text,fontWeight:700,whiteSpace:"nowrap"}}>
                                Prefijo {(g.prefix||"").toUpperCase()}...
                              </span>
                            </div>
                            <div style={{padding:"10px 14px",display:"flex",flexWrap:"wrap",gap:6}}>
                              {todosRoles.map(function(r){
                                var activo = rolesGrupo.indexOf(r) >= 0;
                                return (
                                  <button key={r} onClick={function(){toggleRolEnGrupo(g.key,r);}}
                                    style={{padding:"4px 12px",borderRadius:20,fontWeight:700,fontSize:11,cursor:"pointer",
                                      border:"1.5px solid "+(activo?c.color:"#e2e8f0"),
                                      background:activo?c.bg:"#fff",
                                      color:activo?c.text:"#94a3b8"}}>
                                    {activo?"✓ ":""}{r}
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        );
